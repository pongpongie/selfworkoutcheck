<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <meta name="color-scheme" content="light" />
    <meta name="theme-color" content="#f5f6f7" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#060715" media="(prefers-color-scheme: dark)" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="심트" />
    <link rel="manifest" href="./manifest.json" />
    <link rel="icon" href="./icon-192.png" />
    <link rel="apple-touch-icon" href="./icon-192.png" />
    <title>심트 · Simple Training</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Roboto+Mono:wght@400;500&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="./tokens.css" />
    <script>
      /* 첫 페인트 전에 테마를 적용해야 화면이 번쩍이지 않는다. */
      (function () {
        try {
          var t = localStorage.getItem("gym.theme.v1");
          if (t === "dark" || t === "light")
            document.documentElement.setAttribute("data-theme", t);
        } catch (e) {}
      })();
    </script>
    <style>
      * { box-sizing: border-box; margin: 0; padding: 0; }
      html { -webkit-text-size-adjust: 100%; background: var(--bg); }
      body {
        background: var(--bg); color: var(--text);
        font-family: var(--font-ui);
        font-size: var(--t-body); line-height: var(--t-body-lh);
        padding-bottom: calc(var(--tap) + 34px + var(--safe-b));
        -webkit-font-smoothing: antialiased;
      }
      input, button, select, textarea { font-family: inherit; color: inherit; }
      .wrap { max-width: 720px; margin: 0 auto; padding: 0 var(--gap-md); }

      /* ---------- app bar ---------- */
      .appbar {
        position: sticky; top: 0; z-index: 40;
        background: var(--nav-bg);
        -webkit-backdrop-filter: saturate(180%) blur(20px);
        backdrop-filter: saturate(180%) blur(20px);
        border-bottom: 1px solid var(--line);
        padding-top: var(--safe-t);
      }
      .appbar-in {
        display: flex; align-items: center; gap: var(--gap-sm);
        max-width: 720px; margin: 0 auto; padding: 10px var(--gap-md);
      }
      .brandmark {
        font-size: var(--t-headline); line-height: 1;
        font-weight: var(--w-semibold); letter-spacing: -0.6px; margin-right: auto;
      }
      .brandmark small {
        display: block; margin-top: 3px;
        font-family: var(--font-mono); font-size: 10px;
        font-weight: var(--w-regular); letter-spacing: 0.08em;
        color: var(--text-3); text-transform: uppercase;
      }
      .today { font-family: var(--font-mono); font-size: var(--t-small); color: var(--text-3); }
      .today.off { color: var(--warning); font-weight: var(--w-medium); }
      .iconbtn {
        width: var(--tap); height: var(--tap); flex: none;
        display: grid; place-items: center;
        border: 1px solid var(--line); border-radius: var(--radius-button);
        background: var(--surface); color: var(--text-2); cursor: pointer;
      }
      .iconbtn:hover { color: var(--text); border-color: var(--line-strong); }
      .iconbtn.on { background: var(--accent); border-color: var(--accent); color: var(--text-on-accent); }
      .iconbtn svg { width: 20px; height: 20px; display: block; }

      /* ---------- day chips ---------- */
      .chips {
        display: flex; gap: var(--gap-sm);
        max-width: 720px; margin: 0 auto; padding: 0 var(--gap-md) 10px;
        overflow-x: auto; scrollbar-width: none;
      }
      .chips:empty { display: none; }
      .chips::-webkit-scrollbar { display: none; }
      .chip {
        flex: none; padding: 8px 14px;
        border: 1px solid var(--line); border-radius: var(--radius-pill);
        background: var(--surface); font-size: var(--t-caption);
        font-weight: var(--w-medium); color: var(--text-2);
        cursor: pointer; white-space: nowrap;
      }
      .chip.on { background: var(--text); border-color: var(--text); color: var(--bg); }
      .chip:focus-visible, .iconbtn:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

      /* ---------- bottom nav ---------- */
      .bottomnav {
        position: fixed; left: 0; right: 0; bottom: 0; z-index: 50;
        display: flex; background: var(--nav-bg);
        -webkit-backdrop-filter: saturate(180%) blur(20px);
        backdrop-filter: saturate(180%) blur(20px);
        border-top: 1px solid var(--line); padding-bottom: var(--safe-b);
      }
      .navitem {
        flex: 1; min-height: calc(var(--tap) + 10px);
        display: flex; flex-direction: column; align-items: center; justify-content: center;
        gap: 3px; border: 0; background: transparent;
        color: var(--text-3); font-size: 11px; font-weight: var(--w-medium);
        cursor: pointer; -webkit-tap-highlight-color: transparent;
      }
      .navitem svg { width: 22px; height: 22px; display: block; }
      .navitem.on { color: var(--accent); }
      .navitem:focus-visible { outline: 2px solid var(--accent); outline-offset: -3px; }

      /* ---------- alert ---------- */
      .alert { display: none; }
      .alert.on {
        display: block; margin-top: var(--gap-md); padding: 12px 14px;
        border-radius: var(--radius-container);
        font-size: var(--t-caption); line-height: var(--t-caption-lh); cursor: pointer;
      }
      .alert.bad { background: var(--danger-soft); border: 1px solid var(--danger); color: var(--text); }
      .alert.good { background: var(--success-soft); border: 1px solid var(--success); color: var(--text); }

      /* ---------- section head ---------- */
      .dayhead { padding: var(--gap-lg) 0 var(--gap-sm); }
      .dayhead .num {
        font-family: var(--font-mono); font-weight: var(--w-medium);
        font-size: var(--t-small); letter-spacing: 0.1em; color: var(--accent);
      }
      .dayhead h2 {
        font-size: var(--t-h2); line-height: var(--t-h2-lh);
        letter-spacing: var(--t-h2-ls); font-weight: var(--w-semibold); margin-top: 4px;
      }
      .dayhead p { font-size: var(--t-footnote); color: var(--text-3); margin-top: 4px; }
      .sechead {
        font-size: var(--t-headline); line-height: var(--t-headline-lh);
        font-weight: var(--w-semibold); letter-spacing: -0.4px;
        margin: var(--gap-lg) 0 var(--gap-sm);
      }

      /* ---------- groups & cards ---------- */
      .grp { margin-top: var(--gap-md); }
      .grp-label {
        font-family: var(--font-mono); font-weight: var(--w-medium);
        font-size: var(--t-small); letter-spacing: 0.08em;
        color: var(--text-3); margin-bottom: var(--gap-sm); padding-left: 2px;
      }
      .card {
        background: var(--surface); border: 1px solid var(--line);
        border-radius: var(--radius-container); margin-bottom: var(--gap-sm); overflow: hidden;
      }
      .grp.circuit .card { border-left: 3px solid var(--purple); }
      .grp.warm .card { border-left: 3px solid var(--text-3); }
      .grp.main .card { border-left: 3px solid var(--accent); }

      .row {
        display: grid; grid-template-columns: 1fr auto; gap: 2px var(--gap-md);
        padding: 14px 16px; cursor: pointer; -webkit-tap-highlight-color: transparent;
      }
      .row:focus-visible { outline: 2px solid var(--accent); outline-offset: -2px; }
      .nm { font-size: var(--t-body); font-weight: var(--w-medium); align-self: center; }
      .nm small { font-weight: var(--w-regular); color: var(--text-3); font-size: var(--t-small); }
      .ld {
        font-family: var(--font-mono); font-weight: var(--w-medium);
        font-size: var(--t-body-lg); text-align: right; align-self: center; white-space: nowrap;
      }
      .ld small { font-size: var(--t-small); color: var(--text-3); }
      .mt { font-family: var(--font-mono); font-size: var(--t-small); color: var(--text-2); }
      .rt { font-family: var(--font-mono); font-size: var(--t-small); color: var(--text-3); text-align: right; }
      .last {
        grid-column: 1/-1; margin-top: var(--gap-sm);
        font-family: var(--font-mono); font-size: var(--t-small);
        color: var(--text-2); background: var(--surface-2);
        padding: 6px 9px; border-radius: var(--radius-button);
      }
      .card.done .nm { text-decoration: line-through; text-decoration-thickness: 2px; }
      .card.done { opacity: 0.5; }

      .plates { grid-column: 1/-1; display: flex; align-items: center; gap: 3px; margin-top: 10px; height: 32px; }
      .bar { width: 18px; height: 4px; background: var(--n70); border-radius: 2px; flex: none; }
      .collar { width: 5px; height: 13px; background: var(--n90); border-radius: 1px; flex: none; }
      .plate { width: 13px; border-radius: 2px; flex: none; display: flex; align-items: center; justify-content: center; }
      .plate b {
        font-family: var(--font-mono); font-size: 9px; font-weight: var(--w-medium);
        color: #fff; transform: rotate(-90deg); white-space: nowrap;
      }
      .plate.lt b { color: #091e42; }
      .plabel { margin-left: 9px; font-family: var(--font-mono); font-size: var(--t-small); color: var(--text-3); }

      /* ---------- panel ---------- */
      .panel { display: none; border-top: 1px solid var(--line); padding: var(--gap-md) 16px; background: var(--surface-2); }
      .card.open .panel { display: block; }
      .setrow { display: grid; grid-template-columns: 38px 1fr 1fr var(--tap); gap: 8px; align-items: center; margin-bottom: 8px; }
      .setno { font-family: var(--font-mono); font-size: var(--t-small); font-weight: var(--w-medium); color: var(--text-3); }
      .fld { position: relative; }
      .fld input {
        width: 100%; padding: 11px 28px 11px 11px;
        border: 1px solid var(--line); border-radius: var(--radius-button);
        background: var(--bg-elevated); font-family: var(--font-mono);
        font-size: var(--t-body); font-weight: var(--w-medium); color: var(--text); text-align: right;
      }
      .fld input:focus { outline: none; border-color: var(--accent); }
      .fld span {
        position: absolute; right: 9px; top: 50%; transform: translateY(-50%);
        font-family: var(--font-mono); font-size: var(--t-small); color: var(--text-3); pointer-events: none;
      }
      .chk {
        width: var(--tap); height: 42px;
        border: 1px solid var(--line); border-radius: var(--radius-button);
        background: var(--bg-elevated); font-size: var(--t-body);
        color: var(--text-3); cursor: pointer; line-height: 1;
      }
      .chk.on { background: var(--success); border-color: var(--success); color: #fff; }
      .ptools { display: flex; gap: var(--gap-sm); margin-top: var(--gap-md); flex-wrap: wrap; }
      .btn {
        min-height: 38px; padding: var(--btn-pad-y) var(--gap-md);
        border: 1px solid var(--line); border-radius: var(--radius-button);
        background: var(--surface); font-size: var(--t-caption);
        font-weight: var(--w-medium); color: var(--text-2); cursor: pointer;
      }
      .btn:hover { border-color: var(--line-strong); color: var(--text); }
      .btn:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
      .btn.primary { background: var(--accent); border-color: var(--accent); color: var(--text-on-accent); }
      .btn.warnbtn { color: var(--danger); }
      .alts { margin-top: var(--gap-md); padding-top: var(--gap-sm); border-top: 1px dashed var(--line); }
      .alts .t { font-family: var(--font-mono); font-size: var(--t-small); font-weight: var(--w-medium); color: var(--text-3); margin-bottom: 6px; }
      .alts li { font-size: var(--t-footnote); color: var(--text-2); list-style: none; padding: 4px 0; }
      .alts li b { font-family: var(--font-mono); color: var(--text); font-weight: var(--w-medium); }
      .hint { font-size: var(--t-caption); line-height: var(--t-caption-lh); color: var(--text-3); margin-top: 10px; }

      /* ---------- boxes ---------- */
      .addbox {
        background: var(--surface); border: 1px solid var(--line);
        border-radius: var(--radius-container); padding: var(--pad-container); margin-top: var(--gap-sm);
      }
      .addbox h4 { font-size: var(--t-caption); font-weight: var(--w-medium); color: var(--text-3); margin-bottom: var(--gap-sm); }
      .addgrid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
      .addgrid input, .searchfld, .hsel, .datefld {
        padding: 11px; border: 1px solid var(--line); border-radius: var(--radius-button);
        background: var(--bg-elevated); font-size: var(--t-footnote); color: var(--text); width: 100%;
      }
      .addgrid input:focus, .searchfld:focus, .hsel:focus, .datefld:focus { outline: none; border-color: var(--accent); }
      .addgrid .full { grid-column: 1/-1; }
      .searchfld { font-size: var(--t-body); }

      /* ---------- history ---------- */
      .hsel { margin: var(--gap-md) 0; font-size: var(--t-body); }
      .chart { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius-container); padding: var(--gap-md) 8px 8px; }
      .hlist { margin-top: var(--gap-md); }
      .hitem {
        background: var(--surface); border: 1px solid var(--line);
        border-radius: var(--radius-container); padding: 12px 14px;
        margin-bottom: var(--gap-sm); display: flex; gap: var(--gap-md); align-items: baseline;
      }
      .hitem .d { font-family: var(--font-mono); font-size: var(--t-small); color: var(--text-3); flex: none; }
      .hitem .s { font-family: var(--font-mono); font-size: var(--t-caption); color: var(--text); font-weight: var(--w-medium); }
      .empty { text-align: center; color: var(--text-3); font-size: var(--t-footnote); padding: var(--pad-container-lg) var(--pad-container); line-height: 1.7; }

      /* ---------- rest timer ---------- */
      .timer {
        position: fixed; left: 0; right: 0;
        bottom: calc(var(--tap) + 10px + var(--safe-b));
        z-index: 55; background: var(--n900); color: #fff;
        padding: 12px var(--gap-md);
        display: none; align-items: center; gap: var(--gap-md);
        box-shadow: var(--shadow-lg);
      }
      .timer.on { display: flex; }
      .timer .tval { font-family: var(--font-mono); font-size: var(--t-h4); font-weight: var(--w-semibold); line-height: 1; min-width: 78px; }
      .timer .tlbl { font-size: var(--t-small); color: rgba(255, 255, 255, 0.7); flex: 1; line-height: 1.35; }
      .timer button {
        min-height: 38px; padding: 9px 13px;
        border: 1px solid rgba(255, 255, 255, 0.25); border-radius: var(--radius-button);
        background: transparent; color: #fff; font-size: var(--t-caption); cursor: pointer;
      }
      .timer button:focus-visible { outline: 2px solid #fff; outline-offset: 2px; }
      .timer.done { background: var(--green-600); }

      /* ---------- footer rules ---------- */
      .foot { margin-top: var(--gap-xl); border-top: 1px solid var(--line-strong); padding-top: var(--gap-lg); }
      .foot h3 { font-size: var(--t-headline); font-weight: var(--w-semibold); letter-spacing: -0.4px; margin-bottom: var(--gap-sm); }
      .foot .rule { display: flex; gap: 12px; padding: 9px 0; font-size: var(--t-footnote); color: var(--text-2); }
      .foot .rule i {
        font-family: var(--font-mono); font-style: normal; font-weight: var(--w-medium);
        font-size: var(--t-small); color: var(--accent); padding-top: 3px; flex: none;
      }
      .foot .rule b { color: var(--text); font-weight: var(--w-medium); }
      .warn {
        background: var(--warning-soft); border: 1px solid var(--warning);
        border-radius: var(--radius-container); padding: 12px 14px;
        font-size: var(--t-caption); color: var(--text); margin-top: var(--gap-md);
      }

      /* ---------- settings ---------- */
      .srow {
        display: flex; justify-content: space-between; align-items: center; gap: 12px;
        padding: 12px 0; border-bottom: 1px solid var(--line);
        font-size: var(--t-footnote); color: var(--text-3);
      }
      .srow:last-child { border-bottom: 0; }
      .srow b {
        font-family: var(--font-mono); font-size: var(--t-caption);
        font-weight: var(--w-medium); color: var(--text); text-align: right; word-break: break-all;
      }
      .seg { display: flex; gap: 4px; padding: 4px; background: var(--surface-2); border-radius: var(--radius-button); }
      .segbtn {
        flex: 1; min-height: 36px; border: 0; border-radius: 6px;
        background: transparent; color: var(--text-3);
        font-size: var(--t-caption); font-weight: var(--w-medium); cursor: pointer;
      }
      .segbtn.on { background: var(--surface); color: var(--text); box-shadow: var(--shadow-sm); }
      .segbtn:focus-visible { outline: 2px solid var(--accent); outline-offset: -2px; }

      /* ---------- date bar ---------- */
      .datebar {
        display: flex; align-items: center; gap: var(--gap-sm);
        margin-top: var(--gap-md); padding: 8px;
        border: 1px solid var(--line); border-radius: var(--radius-container); background: var(--surface);
      }
      .datebar.past { background: var(--warning-soft); border-color: var(--warning); }
      .dnav {
        width: 38px; height: 38px; flex: none;
        border: 1px solid var(--line); border-radius: var(--radius-button);
        background: var(--bg-elevated); font-family: var(--font-mono);
        font-size: var(--t-footnote); color: var(--text-2); cursor: pointer;
      }
      .dnav:disabled { opacity: 0.3; cursor: default; }
      .dnav:not(:disabled):hover { border-color: var(--line-strong); color: var(--text); }
      .dnav:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
      .datefld { flex: 1; min-width: 0; font-family: var(--font-mono); font-weight: var(--w-medium); text-align: center; }
      .datenote {
        display: flex; align-items: center; gap: 9px;
        margin-top: var(--gap-sm); padding: 10px 12px;
        border-radius: var(--radius-container);
        background: var(--warning-soft); border: 1px solid var(--warning);
        font-size: var(--t-caption); color: var(--text);
      }
      .datenote b { flex: 1; font-weight: var(--w-medium); }

      /* ---------- calendar ---------- */
      .calhead { display: flex; align-items: center; gap: 10px; padding: var(--gap-lg) 0 4px; }
      .calhead h2 { font-size: var(--t-h4); line-height: 1.1; letter-spacing: var(--t-h4-ls); font-weight: var(--w-semibold); flex: 1; }
      .calnav {
        width: 40px; height: 40px; flex: none;
        border: 1px solid var(--line); border-radius: var(--radius-button);
        background: var(--surface); font-size: var(--t-body); color: var(--text-2); cursor: pointer;
      }
      .calnav:hover { border-color: var(--line-strong); color: var(--text); }
      .calnav:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
      .calstat { display: flex; gap: var(--gap-md); flex-wrap: wrap; padding: 2px 2px var(--gap-md); font-size: var(--t-small); color: var(--text-3); }
      .calstat b { font-family: var(--font-mono); color: var(--text); font-size: var(--t-footnote); font-weight: var(--w-medium); }
      .calgrid { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius-container); padding: 12px 10px 10px; }
      .caldow, .calweek { display: grid; grid-template-columns: repeat(7, 1fr); gap: 4px; }
      .caldow span { text-align: center; font-family: var(--font-mono); font-size: 10px; font-weight: var(--w-medium); color: var(--text-3); padding-bottom: 8px; }
      .caldow span:first-child { color: var(--danger); }
      .calcell {
        aspect-ratio: 1; max-height: 52px;
        border: 1px solid transparent; border-radius: var(--radius-button);
        background: transparent; display: flex; flex-direction: column;
        align-items: center; justify-content: center; gap: 3px;
        font-family: var(--font-mono); font-size: var(--t-caption);
        color: var(--text-3); cursor: default; padding: 0; -webkit-tap-highlight-color: transparent;
      }
      .calcell.pad { visibility: hidden; }
      .calcell.has { cursor: pointer; color: var(--text); font-weight: var(--w-medium); }
      .calcell.lv1 { background: var(--heat-1); }
      .calcell.lv2 { background: var(--heat-2); }
      .calcell.lv3 { background: var(--heat-3); }
      .calcell.today { border-color: var(--accent); }
      .calcell.sel { background: var(--text); color: var(--bg); }
      .calcell:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
      .calcell i { width: 4px; height: 4px; border-radius: 50%; background: var(--green-600); font-style: normal; }
      .calcell.sel i { background: var(--bg); }
      .calday { margin-top: var(--gap-md); }
      .caldayhead { display: flex; align-items: baseline; gap: 10px; margin-bottom: var(--gap-sm); }
      .caldayhead h3 { font-family: var(--font-mono); font-size: var(--t-body); font-weight: var(--w-semibold); }
      .caldayhead span { font-family: var(--font-mono); font-size: var(--t-small); color: var(--text-3); }
      .calex {
        background: var(--surface); border: 1px solid var(--line);
        border-left: 3px solid var(--accent); border-radius: var(--radius-container);
        padding: 12px 14px; margin-bottom: var(--gap-sm);
      }
      .calex .n { font-size: var(--t-footnote); font-weight: var(--w-medium); margin-bottom: 3px; }
      .calex .s { font-family: var(--font-mono); font-size: var(--t-caption); color: var(--text-2); }
      .calex .v { font-family: var(--font-mono); font-size: var(--t-small); color: var(--text-3); margin-top: 3px; }

      /* ---------- exercise picker ---------- */
      .cats { display: flex; gap: 5px; overflow-x: auto; scrollbar-width: none; padding-bottom: 10px; }
      .cats::-webkit-scrollbar { display: none; }
      .cat {
        flex: none; padding: 7px 13px;
        border: 1px solid var(--line); border-radius: var(--radius-pill);
        background: var(--bg-elevated); font-size: var(--t-caption);

          ok = false;

          ok: ok,
          get: function (k, d) {

      /* ============ log write path ============ */
      /* 읽기는 Gym.entryFor / Gym.viewSets 로. 여기는 실제로 값을 쓸 때만 부른다. */
      function ensureEntry(exId, date, nSets) {
        if (!logs[exId]) logs[exId] = [];
        var e = Gym.entryFor(logs, exId, date);
        if (!e) {
          e = { date: date, sets: [] };
          logs[exId].push(e);
          logs[exId].sort(function (a, b) {
            return a.date < b.date ? -1 : a.date > b.date ? 1 : 0;
          });
        }
        while (e.sets.length < nSets) e.sets.push(Gym.blankSet());
        return e;
      }

      /* ============ rest timer ============ */

        var endAt = 0,
          iv = null,
          hideTo = null,
          lock = null,
          label = "휴식";
        var el = document.getElementById("timer"),
          val = document.getElementById("tval"),
          lbl = document.getElementById("tlbl");
        var actx = null;

        function remainMs() {
          return endAt - Date.now();
        }
        function remain() {
          return Math.max(0, Math.ceil(remainMs() / 1000));
        }
        function fmt(s) {
          var m = Math.floor(s / 60),
            r = s % 60;
          return m + ":" + (r < 10 ? "0" : "") + r;
        }
        function paint() {
          val.textContent = fmt(remain());
        }

        /* AudioContext 는 사용자 제스처 안에서 만들어 둬야 iOS 가 나중 재생을 막지 않는다. */
        function audio() {
          if (actx) {
            if (actx.state === "suspended") actx.resume().catch(function () {});
            return actx;
          }
          try {
            var C = window.AudioContext || window.webkitAudioContext;
            if (!C) return null;
            actx = new C();
          } catch (e) {
            return null;
          }
          return actx;
        }

        function beep() {
          var ctx = audio();
          if (!ctx) return;
          try {
            var o = ctx.createOscillator(),
              g = ctx.createGain();
            o.connect(g);
            g.connect(ctx.destination);
            o.frequency.value = 880;
            o.type = "sine";
            g.gain.setValueAtTime(0.0001, ctx.currentTime);
            g.gain.exponentialRampToValueAtTime(0.25, ctx.currentTime + 0.02);
            g.gain.exponentialRampToValueAtTime(0.0001, ctx.currentTime + 0.6);
            o.start();
            o.stop(ctx.currentTime + 0.62);
          } catch (e) {}
        }

        function releaseWake() {
          if (!lock) return;
          try {
            lock.release().catch(function () {});
          } catch (e) {}
          lock = null;
        }
        function requestWake() {
          if (!navigator.wakeLock || lock || !iv) return;
          try {
            navigator.wakeLock
              .request("screen")
              .then(function (l) {
                if (iv) lock = l;
                else {
                  try {
                    l.release();
                  } catch (e) {}
                }
              })
              .catch(function () {});
          } catch (e) {}
        }

        function clearHide() {
          if (hideTo) {
            clearTimeout(hideTo);
            hideTo = null;
          }
        }

          paint();
          el.classList.add("done");
          lbl.textContent = "다음 세트 준비";
          beep();
          if (navigator.vibrate) {
            try {
              navigator.vibrate([200, 100, 200]);
            } catch (e) {}
          }
          releaseWake();
          clearHide();
          hideTo = setTimeout(function () {
            hideTo = null;
            el.classList.remove("on", "done");
          }, TIMER_HIDE_MS);
        }

        function tick() {
          paint();
          if (remainMs() <= 0) finish();
        }

        function run() {
          if (iv) clearInterval(iv);
          iv = setInterval(tick, TIMER_TICK_MS);
          requestWake();
        }

        /* 남은 초를 빼는 대신 종료 시각을 잡아둔다.
     그래야 화면이 꺼져 틱이 누락돼도 복귀했을 때 값이 맞다. */
        function start(sec, text) {
          if (!sec) return;
          audio();
          clearHide();
          endAt = Date.now() + sec * 1000;
          label = text || "휴식";
          lbl.textContent = label;
          el.classList.add("on");
          el.classList.remove("done");
          paint();
          run();
        }

        function stop() {
          if (iv) {
            clearInterval(iv);
            iv = null;
          }
          clearHide();
          endAt = 0;
          el.classList.remove("on", "done");
          releaseWake();
        }

        function extend() {
          clearHide();
          endAt = (iv ? endAt : Date.now()) + ADD_SECONDS * 1000;
          lbl.textContent = label;
          el.classList.add("on");
          el.classList.remove("done");
          paint();
          if (!iv) run();
        }

        document.getElementById("t30").addEventListener("click", extend);
        document.getElementById("tskip").addEventListener("click", stop);

        /* 화면 잠금 중에는 OS 가 wake lock 을 회수한다. 돌아오면 다시 잡고 값도 맞춘다. */
        document.addEventListener("visibilitychange", function () {
          if (document.visibilityState !== "visible" || !iv) return;
          tick();
          requestWake();
        });

        return { start: start, stop: stop };
      })();

      /* 읽기·쓰기 모두 이걸 쓴다. today() 를 직접 쓰면 날짜 선택이 무시된다. */
      function recordDate() {

      function allExercises() {
        var out = [];
        DAYS.forEach(function (day) {
          WARM.concat(day.main, CIRCUIT).forEach(function (e) {
            out.push(e);
          });
          (custom[day.id] || []).forEach(function (e) {
            out.push(e);
          });
        });
        var seen = {},
          uniq = [];
        out.forEach(function (e) {
          if (!seen[e.id]) {
            seen[e.id] = 1;
            uniq.push(e);
          }
        });
        return uniq;
      }

      function findExercise(id) {
        var all = allExercises();
        for (var i = 0; i < all.length; i++)
          if (all[i].id === id) return all[i];
        return null;
      }

      /* 세트 수는 사용자가 바꿨으면 그 값을, 아니면 루틴 기본값을 쓴다. */
      function setCountFor(ex, date) {
        var e = Gym.entryFor(logs, ex.id, date);
        return e && e.sets.length ? e.sets.length : ex.sets;
      }

      /* 캘린더는 지금 루틴에 없는 종목(예전에 지운 것, 들여온 것)도 보여줘야 한다.
         루틴 → 카탈로그 → 그래도 없으면 id 순으로 이름을 찾는다. */
      function exerciseName(id) {
        var inRoutine = findExercise(id);
        if (inRoutine) return inRoutine.name;
        var inCatalog = GymExercises.BY_ID[id];
        if (inCatalog) return inCatalog.name;
        return id;
      }

      /* 기본 루틴 종목은 카탈로그와 id 가 다르다. 이름이 같으면 같은 부위로 본다. */
      var CATALOG_CAT_BY_NAME = (function () {
        var map = {};
        GymExercises.ALL.forEach(function (e) {
          map[e.name] = e.cat;
        });
        return map;
      })();

      function exerciseCategory(id) {
        var inCatalog = GymExercises.BY_ID[id];
        if (inCatalog) return inCatalog.cat;
        var ex = findExercise(id);
        if (!ex) return null;
        if (ex.cat) return ex.cat;
        return CATALOG_CAT_BY_NAME[ex.name] || null;
      }

      function categoryColor(catId) {
        var cats = GymExercises.CATEGORIES;

      /* ---------- 캘린더 ---------- */
      var DOW = ["일", "월", "화", "수", "목", "금", "토"];
      var VOLUME_LEVELS = [0.34, 0.67]; // 그 달 최대 볼륨 대비 색 농도 구간

      function volumeLevel(volume, max) {
        if (!max || !volume) return 1;
        var ratio = volume / max;
        if (ratio <= VOLUME_LEVELS[0]) return 1;
        if (ratio <= VOLUME_LEVELS[1]) return 2;
        return 3;
      }

        if (key === state.calDay) cls += " sel";
        if (day) cls += " has lv" + volumeLevel(day.volume, monthMax);

        if (!day) {
          return '<div class="' + cls + '">' + num + "</div>";
        }
        return (
          '<button class="' +
          cls +
          '" data-calday="' +
          Gym.esc(key) +
          '" aria-label="' +
          Gym.esc(Gym.shortDate(key)) +
          " " +
          day.count +

      /* ---------- 테마 ---------- */
      /* "system" 이면 속성을 지워 tokens.css 의 prefers-color-scheme 규칙에 맡긴다. */
      function applyTheme(mode) {
        var root = document.documentElement;
        if (mode === "dark" || mode === "light") root.setAttribute("data-theme", mode);
        else root.removeAttribute("data-theme");
      }

      function setTheme(mode) {
        if (["system", "light", "dark"].indexOf(mode) < 0) return;
        state.theme = mode;
        applyTheme(mode);
        try {
          if (mode === "system") localStorage.removeItem(THEME_KEY);
          else localStorage.setItem(THEME_KEY, mode);
        } catch (e) {}
        render();
      }

      (function initTheme() {
        var saved = null;
        try { saved = localStorage.getItem(THEME_KEY); } catch (e) {}
        state.theme = saved === "dark" || saved === "light" ? saved : "system";
        applyTheme(state.theme);
      })();

      /* ---------- 설정 ---------- */
      function logStats() {
        var days = {},
          exercises = 0,
          sets = 0;
        Object.keys(logs).forEach(function (id) {
          exercises += 1;
          (logs[id] || []).forEach(function (e) {
            days[e.date] = 1;
            sets += e.sets.filter(function (s) {
              return s.w != null || s.r != null || s.done;
            }).length;
          });
        });
        return {
          exercises: exercises,
          days: Object.keys(days).length,
          sets: sets,
        };
      }

            JSON.stringify(logs || {}) + JSON.stringify(custom || {});
          return new Blob([raw]).size;
        } catch (e) {

        }
      }

      /* 캐시 이름·할당량은 비동기라 자리만 잡아두고 나중에 채운다. */
      function fillSettingsAsync() {
        var cacheEl = document.getElementById("s-cache");
        var swEl = document.getElementById("s-sw");
        var quotaEl = document.getElementById("s-quota");
        if (!cacheEl) return;

        if (window.caches) {
          caches
            .keys()
            .then(function (keys) {
              cacheEl.textContent = keys.length ? keys.join(", ") : "없음";
            })
            .catch(function () {
              cacheEl.textContent = "확인 불가";
            });
        } else {
          cacheEl.textContent = "미지원";
        }

        if ("serviceWorker" in navigator) {
          navigator.serviceWorker
            .getRegistration()
            .then(function (reg) {
              if (!reg) {
                swEl.textContent = "미등록";
              } else if (reg.waiting) {
                swEl.textContent = "새 버전 대기 중";
              } else if (reg.active) {
                swEl.textContent = "동작 중";
              } else {
                swEl.textContent = "설치 중";
              }
            })
            .catch(function () {
              swEl.textContent = "확인 불가";
            });
        } else {
          swEl.textContent = "미지원";
        }

        if (navigator.storage && navigator.storage.estimate) {
          navigator.storage
            .estimate()
            .then(function (est) {
              quotaEl.textContent =
                Gym.formatBytes(est.usage || 0) +
                " / " +
                Gym.formatBytes(est.quota || 0);
            })
            .catch(function () {
              quotaEl.textContent = "확인 불가";
            });
        } else {
          quotaEl.textContent = "미지원";
        }
      }

      function checkUpdate() {
        if (!("serviceWorker" in navigator)) {
          notify("이 브라우저는 서비스워커를 지원하지 않아.");
          return;
        }
        navigator.serviceWorker
          .getRegistration()
          .then(function (reg) {
            if (!reg) {
              notify("서비스워커가 등록돼 있지 않아. http/https 로 열어야 등록돼.");
              return null;
            }
            return reg.update().then(function () {
              if (reg.installing || reg.waiting) {
                notify("새 버전을 받았어. 새로고침하면 적용돼.", "good");
              } else {
                notify("이미 최신이야.", "good");
              }
            });
          })
          .catch(function () {
            notify("업데이트를 확인하지 못했어. 네트워크를 확인해줘.");
          });
      }

      /* 앱 파일 캐시만 비운다. localStorage 는 건드리지 않는다. */
      function purgeCaches() {
        if (
          !window.confirm(
            "앱 파일 캐시를 비우고 새로고침할까?\n운동 기록은 지워지지 않아.",
          )
        )
          return;

        var jobs = [];
        if ("serviceWorker" in navigator) {
          jobs.push(
            navigator.serviceWorker.getRegistrations().then(function (regs) {
              return Promise.all(
                regs.map(function (r) {
                  return r.unregister();
                }),
              );
            }),
          );
        }
        if (window.caches) {
          jobs.push(
            caches.keys().then(function (keys) {
              return Promise.all(
                keys.map(function (k) {
                  return caches.delete(k);
                }),
              );
            }),
          );
        }
        Promise.all(jobs)
          .catch(function () {})
          .then(function () {
            location.reload();
          });
      }

      function render() {
        renderChips();

        if (state.section === "tips") {
          v.innerHTML = renderTips();

          v.innerHTML = renderSettings();

        } else if (state.section === "records") {
          v.innerHTML = renderCalendar();
        } else if (state.section === "stats") {
          v.innerHTML = renderStats();

            DAYS.filter(function (d) {

            })[0] || DAYS[0];
          v.innerHTML = renderDay(day);
        }
        /* 상단에는 실제로 기록이 들어가는 날짜를 띄운다. 오늘이 아니면 눈에 띄게. */
        var stamp = document.getElementById("today");

      }

      /* ============ backup ============ */
      function exportData() {
        try {
          var payload = {
            v: BACKUP_VERSION,
            exportedAt: new Date().toISOString(),
            logs: logs,
            custom: custom,
          };
          var blob = new Blob([JSON.stringify(payload, null, 2)], {
            type: "application/json",
          });
          var url = URL.createObjectURL(blob);
          var a = document.createElement("a");
          a.href = url;
          a.download = "gym-backup-" + today() + ".json";
          document.body.appendChild(a);
          a.click();
          document.body.removeChild(a);
          setTimeout(function () {
            URL.revokeObjectURL(url);
          }, 1000);
          notify("백업 파일을 내려받았어.", "good");
        } catch (e) {
          notify("내보내기에 실패했어. 브라우저가 파일 저장을 막았을 수 있어.");
        }
      }

      function importFile(input) {
        var f = input.files && input.files[0];
        input.value = "";
        if (!f) return;
        if (f.size > MAX_BACKUP_BYTES) {
          notify("파일이 너무 커 (5MB 초과).");
          return;
        }
        var fr = new FileReader();
        fr.onerror = function () {
          notify("파일을 읽지 못했어.");
        };
        fr.onload = function () {
          var parsed;
          try {
            parsed = JSON.parse(fr.result);
          } catch (e) {
            notify("JSON 형식이 아니야.");
            return;
          }
          if (!parsed || typeof parsed !== "object") {
            notify("백업 파일 형식이 아니야.");
            return;
          }

          var inLogs = Gym.sanitizeLogs(parsed.logs);
          var inCustom = Gym.sanitizeCustom(parsed.custom);
          var nLogs = Object.keys(inLogs).length;
          var nCustom = Object.keys(inCustom).length;
          if (!nLogs && !nCustom) {
            notify("불러올 기록이 없어. 파일을 확인해줘.");
            return;
          }

          logs = Gym.mergeLogs(logs, inLogs);
          custom = Gym.mergeCustom(custom, inCustom);
          var okLogs = saveLogs(),
            okCustom = saveCustom();
          render();
          if (okLogs && okCustom)
            notify("종목 " + nLogs + "개의 기록을 합쳤어.", "good");
        };
        fr.readAsText(f);
      }

        custom = {};
        state.open = {};
        state.chartEx = null;
        saveLogs();
        saveCustom();

      }

        "[data-cal],[data-calday],[data-cat],[data-pick],[data-date],[data-jump]," +
        "#a-go,#a-clear,#date-today,#d-export,#d-import,#d-reset,#nav-tips,[data-grp]," +
        "#s-update,#s-purge,#nav-settings,[data-theme-set],#alert";

      /* 미래 날짜는 막는다 — 아직 하지 않은 운동을 적을 일은 없다. */
      /* 거부하면 false 를 돌려준다 — 호출한 쪽이 입력창을 되돌려야 하기 때문. */
      function setLogDate(key) {
        if (!Gym.isDateKey(key)) return false;
        if (Gym.dayDiff(key, Gym.todayKey()) < 0) {
          notify("앞날에는 기록할 수 없어.");
          return false;
        }
        state.logDate = key;
        clearNotify();
        render();
        return true;
      }

      function toggleCard(rowEl) {
        var id = rowEl.dataset.toggle;
        state.open[id] = !state.open[id];
        rowEl.parentNode.classList.toggle("open", state.open[id]);
        rowEl.setAttribute("aria-expanded", state.open[id] ? "true" : "false");
      }

      function setVal(id, v) {
        var el = document.getElementById(id);
        if (el) el.value = v;
      }

      function updateSuggestions() {
        var sug = document.getElementById("a-sug");
        if (sug) sug.innerHTML = suggestionsHTML();
        var picked = document.getElementById("a-picked");
        if (picked) picked.innerHTML = pickedHTML();
      }

      function selectCategory(catId) {
        state.cat = catId || null;
        state.pick = null;
        var chips = document.getElementById("a-cats");
        if (chips) chips.outerHTML = catChipsHTML();
        updateSuggestions();
      }

      function pickExercise(id) {
        var e = GymExercises.BY_ID[id];
        if (!e) return;
        state.pick = e;
        state.q = e.name;
        setVal("a-name", e.name);
        setVal("a-load", e.load || "");
        setVal("a-sets", e.sets);
        setVal("a-reps", e.reps);
        setVal("a-rest", e.rest);
        updateSuggestions();
      }

      function clearPick() {
        state.pick = null;
        state.q = "";
        ["a-name", "a-load", "a-sets", "a-reps", "a-rest"].forEach(function (id) {
          setVal(id, "");
        });
        updateSuggestions();
        var input = document.getElementById("a-name");
        if (input) input.focus();
      }

      /* 같은 날에 같은 이름이 두 번 뜨면 어느 카드에 적었는지 헷갈린다.
         자유 요일은 워밍업·서킷을 띄우지 않으니 그 이름들은 막지 않는다. */
      function dayHasExercise(dayId, name, id) {
        var day = DAYS.filter(function (d) {
          return d.id === dayId;
        })[0];
        var list = (day ? day.main : []).concat(custom[dayId] || []);
        if (!day || !day.freeform) list = list.concat(WARM, CIRCUIT);
        return list.some(function (e) {
          return e.name === name || e.id === id;
        });
      }

      function addExercise(dayId) {
        var pick = state.pick;
        var name = (pick ? pick.name : document.getElementById("a-name").value)
          .trim()
          .slice(0, MAX_NAME);
        if (!name) {
          notify("종목을 검색해서 고르거나 이름을 직접 적어줘.");
          return;
        }

        /* 카탈로그에서 고른 건 카탈로그 id 를 그대로 쓴다.
           그래야 여러 요일에 넣어도 기록이 한 줄로 이어진다. */
        var id = pick ? pick.id : "x-" + Date.now();
        if (dayHasExercise(dayId, name, id)) {
          notify(name + " 은(는) 이 날에 이미 있어.");
          return;
        }

        var load = parseFloat(document.getElementById("a-load").value);
        var sets = parseInt(document.getElementById("a-sets").value, 10);
        var rest = parseInt(document.getElementById("a-rest").value, 10);
        var reps = document
          .getElementById("a-reps")
          .value.trim()
          .slice(0, MAX_REPS);

        var entry = {
          id: id,
          name: name,
          load:
            isFinite(load) && load >= 0 && load <= MAX_LOAD
              ? load
              : pick
                ? pick.load
                : 0,
          unit: pick ? pick.unit : "kg",
          sets: Math.min(MAX_SETS, Math.max(1, sets || (pick ? pick.sets : 3))),
          reps: reps || (pick ? pick.reps : "10-12회"),
          rest: Math.min(
            MAX_REST,
            Math.max(0, isFinite(rest) ? rest : pick ? pick.rest : 60),
          ),
        };
        entry.grp = state.grp === "warm" ? "warm" : "main";
        if (pick) {
          entry.cat = pick.cat;
          if (pick.plates) entry.plates = true;
        }

        custom[dayId] = (custom[dayId] || []).concat([entry]);
        state.pick = null;
        state.q = "";
        saveCustom();
        render();
        notify(name + " 추가했어.", "good");
      }

      function deleteExercise(dayId, exId) {
        if (!window.confirm("이 종목과 지금까지의 기록을 함께 지울까?")) return;
        custom[dayId] = (custom[dayId] || []).filter(function (e) {
          return e.id !== exId;
        });
        if (!custom[dayId].length) delete custom[dayId];
        delete logs[exId]; // 고아 기록을 남기지 않는다
        delete state.open[exId];
        if (state.chartEx === exId) state.chartEx = null;
        saveCustom();
        saveLogs();
        render();
      }

      function toggleSetDone(btn) {
        var exId = btn.dataset.done,
          i = +btn.dataset.i;
        var ex = findExercise(exId);
        if (!ex) return;
        var e = ensureEntry(exId, recordDate(), setCountFor(ex, recordDate()));
        var next = !e.sets[i].done;
        e.sets[i].done = next;
        saveLogs();
        btn.classList.toggle("on", next);
        btn.setAttribute("aria-pressed", next ? "true" : "false");
        var card = btn.closest(".card");
        if (card)
          card.classList.toggle(
            "done",
            e.sets.every(function (s) {
              return s.done;
            }),
          );
        if (next && ex.rest)
          Timer.start(ex.rest, ex.name + " · " + (i + 1) + "세트 완료");
      }

      /* 세트를 늘리면 직전 세트의 중량·반복수를 복사한다 — 보통 같은 무게로 이어가니까. */
      function addSet(exId) {
        var ex = findExercise(exId);
        if (!ex) return;
        var date = recordDate();
        var count = setCountFor(ex, date);
        if (count >= MAX_SETS) {
          notify("세트는 " + MAX_SETS + "개까지야.");
          return;
        }
        var e = ensureEntry(exId, date, count);
        var last = e.sets[e.sets.length - 1];
        e.sets.push({
          w: last ? last.w : null,
          r: last ? last.r : null,
          done: false,
        });
        e.n = e.sets.length;
        saveLogs();
        render();
      }

      function removeSet(exId) {
        var ex = findExercise(exId);
        if (!ex) return;
        var date = recordDate();
        var count = setCountFor(ex, date);
        if (count <= 1) return;
        var e = ensureEntry(exId, date, count);
        e.sets.pop();
        e.n = e.sets.length;
        saveLogs();
        render();
      }

      function fillFromPrev(exId) {
        var prev = Gym.prevEntry(logs, exId, recordDate());
        if (!prev) {
          notify("불러올 지난 기록이 없어.");
          return;
        }
        var ex = findExercise(exId);
        if (!ex) return;
        var cur = ensureEntry(exId, recordDate(), setCountFor(ex, recordDate()));
        prev.sets.forEach(function (s, i) {
          if (cur.sets[i]) {
            cur.sets[i].w = s.w;
            cur.sets[i].r = s.r;
          }
        });
        saveLogs();
        render();
      }

      document.addEventListener("click", function (ev) {
        var t = ev.target.closest ? ev.target.closest(CLICK_SELECTOR) : null;
        if (!t) return;

        if (t.id === "alert") {
          clearNotify();
          return;
        }

        if (t.dataset.section) {
          state.section = t.dataset.section;
          window.scrollTo(0, 0);
          render();
          return;
        }
        if (t.dataset.daytab) {
          state.day = t.dataset.daytab;
          state.section = "workout";
          window.scrollTo(0, 0);
          render();
          return;
        }
        if (t.id === "nav-settings") {
          state.section = state.section === "settings" ? "workout" : "settings";
          window.scrollTo(0, 0);
          render();
          return;
        }
        if (t.id === "nav-tips") {
          state.section = state.section === "tips" ? "workout" : "tips";
          window.scrollTo(0, 0);
          render();
          return;
        }
        if (t.hasAttribute("data-theme-set")) {
          setTheme(t.dataset.themeSet);
          return;
        }
        if (t.dataset.toggle) {
          toggleCard(t);
          return;
        }
        if (t.dataset.done) {
          toggleSetDone(t);
          return;
        }
        if (t.dataset.rest) {
          Timer.start(+t.dataset.rest, "휴식");
          return;
        }
        if (t.dataset.addset) {
          addSet(t.dataset.addset);
          return;
        }
        if (t.dataset.delset) {
          removeSet(t.dataset.delset);
          return;
        }
        if (t.hasAttribute("data-grp")) {
          state.grp = t.dataset.grp;
          var seg = document.querySelector("[data-grp]");
          if (seg && seg.parentNode) seg.parentNode.outerHTML = grpSegHTML();
          return;
        }
        if (t.dataset.fill) {
          fillFromPrev(t.dataset.fill);
          return;
        }
        if (t.dataset.del) {
          deleteExercise(t.dataset.day, t.dataset.del);
          return;
        }

        if (t.dataset.date) {
          setLogDate(Gym.shiftDate(recordDate(), +t.dataset.date));
          return;
        }
        if (t.id === "date-today") {
          setLogDate(Gym.todayKey());
          return;
        }
        if (t.dataset.jump) {
          setLogDate(t.dataset.jump);
          state.section = "workout";
          window.scrollTo(0, 0);
          render();
          return;
        }

        if (t.dataset.cal) {
          var m = Gym.shiftMonth(state.calYear, state.calMonth, +t.dataset.cal);
          state.calYear = m.year;
          state.calMonth = m.month;
          state.calDay = null;
          render();
          return;
        }
        if (t.dataset.calday) {
          state.calDay =
            state.calDay === t.dataset.calday ? null : t.dataset.calday;
          render();
          return;
        }
        if (t.hasAttribute("data-cat")) {
          selectCategory(t.dataset.cat);
          return;
        }
        if (t.dataset.pick) {
          pickExercise(t.dataset.pick);
          return;
        }
        if (t.id === "a-clear") {
          clearPick();
          return;
        }

        if (t.dataset.form) {
          window.open(
            "https://www.youtube.com/results?search_query=" +
              encodeURIComponent(t.dataset.form + " 자세"),
            "_blank",
            "noopener,noreferrer",
          );
          return;
        }

        if (t.id === "a-go") {
          addExercise(t.dataset.day);
          return;
        }
        if (t.id === "d-export") {
          exportData();
          return;
        }
        if (t.id === "d-import") {
          document.getElementById("d-file").click();
          return;
        }
        if (t.id === "d-reset") {
          resetAll();
          return;
        }
        if (t.id === "s-update") {
          checkUpdate();
          return;
        }
        if (t.id === "s-purge") {
          purgeCaches();
          return;
        }
      });

      /* 검색창에서 Enter 는 첫 번째 후보를 고른다. */
      document.addEventListener("keydown", function (ev) {
        if (ev.target.id === "a-name" && ev.key === "Enter") {
          ev.preventDefault();
          var first = document.querySelector("#a-sug [data-pick]");
          if (first) pickExercise(first.dataset.pick);
          return;
        }

        /* 종목 카드는 role="button" 이니 Enter/Space 로도 열려야 한다. */
        if (ev.key !== "Enter" && ev.key !== " " && ev.key !== "Spacebar")
          return;
        var row = ev.target.closest ? ev.target.closest("[data-toggle]") : null;
        if (!row) return;
        ev.preventDefault();
        toggleCard(row);
      });

      document.addEventListener("input", function (ev) {
        if (ev.target.id !== "a-name") return;
        state.q = ev.target.value;
        state.pick = null;
        updateSuggestions();
      });

      document.addEventListener("change", function (ev) {
        var el = ev.target;

        if (el.id === "logdate") {
          /* 거부되면 화면과 실제 기록 날짜가 어긋나니 입력창을 되돌린다. */
          if (!setLogDate(el.value)) el.value = recordDate();
          return;
        }
        if (el.id === "d-file") {
          importFile(el);
          return;
        }
        if (el.id === "hsel") {
          state.chartEx = el.value;
          render();
          return;
        }

        var exId = el.dataset.w || el.dataset.r;
        if (!exId) return;
        var ex = findExercise(exId);
        if (!ex) return;

        var raw = el.value.trim();
        var v = null;
        if (raw !== "") {
          var parsed = parseFloat(raw);
          if (!isFinite(parsed) || parsed < 0) el.value = "";
          else v = parsed;
        }
        var e = ensureEntry(exId, recordDate(), setCountFor(ex, recordDate())),
          i = +el.dataset.i;
        if (el.dataset.w) {
          e.sets[i].w = v;
        } else {
          e.sets[i].r = v;
          /* 중량 칸의 회색 숫자는 placeholder 라 값이 아니다. 횟수만 적고 넘어가면
             중량이 비어 볼륨이 0 이 된다. 카드에 적힌 계획 중량을 실제 값으로
             채워 넣고, 입력창에도 보여줘서 다르면 바로 고칠 수 있게 한다. */
          if (v != null && e.sets[i].w == null && ex.load > 0) {
            e.sets[i].w = ex.load;
            var wInput = document.querySelector(
              '.panel input[data-w="' + ex.id + '"][data-i="' + i + '"]',
            );
            if (wInput) wInput.value = ex.load;
          }
        }
        saveLogs();
      });

      render();

      /* ============ service worker ============ */
      if ("serviceWorker" in navigator && location.protocol !== "blob:") {
        window.addEventListener("load", function () {
          navigator.serviceWorker.register("./sw.js").catch(function () {});
        });
      }
    </script>
  </body>
</html>
