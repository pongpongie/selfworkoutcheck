<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <meta name="color-scheme" content="light" />
    <meta name="theme-color" content="#f5f6f7" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#060715" media="(prefers-color-scheme: dark)" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="심트" />
    <link rel="manifest" href="./manifest.json" />
    <link rel="icon" href="./icon-192.png" />
    <link rel="apple-touch-icon" href="./icon-192.png" />
    <title>심트 · Simple Training</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Roboto+Mono:wght@400;500&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="./tokens.css" />
    <script>
      /* 첫 페인트 전에 테마를 적용해야 화면이 번쩍이지 않습니다. */
      (function () {
        var t = null;
        try {
          t = localStorage.getItem("gym.theme.v1");
        } catch (e) {}
        if (t === "dark" || t === "light")
          document.documentElement.setAttribute("data-theme", t);

        /* iOS 홈 화면 앱의 상태바는 이 메타로만 정해지고 값이 셋뿐입니다.
           theme-color 는 iOS 에 안 먹습니다. 다크면 투명으로 두어 앱바 색이
           상태바까지 이어지게 하고, 라이트면 기본(흰 배경 + 검은 글씨)으로 둡니다.
           런타임에 바꿔도 iOS 는 실행 시점 값만 보므로 여기서 정합니다. */
        var dark =
          t === "dark" ||
          (t !== "light" &&
            window.matchMedia &&
            window.matchMedia("(prefers-color-scheme: dark)").matches);
        var meta = document.querySelector(
          'meta[name="apple-mobile-web-app-status-bar-style"]',
        );
        if (meta)
          meta.setAttribute("content", dark ? "black-translucent" : "default");
      })();
    </script>
    <style>
      * { box-sizing: border-box; margin: 0; padding: 0; }
      html {
        -webkit-text-size-adjust: 100%;
        background: var(--bg);
        /* iOS 에서 짧은 화면을 당기면 러버밴드로 고정된 하단바가 딸려 올라간다. */
        overscroll-behavior-y: none;
      }
      body {
        /* 배경은 html 이 진다. 여기서 칠하면 body::before 앰비언트가 가려진다. */
        background: transparent; color: var(--text);
        font-family: var(--font-ui);
        font-size: var(--t-body); line-height: var(--t-body-lh);
        padding-bottom: calc(var(--tap) + 34px + var(--safe-b));
        min-height: 100dvh;
        overscroll-behavior-y: none;
        -webkit-font-smoothing: antialiased;
      }
      input, button, select, textarea { font-family: inherit; color: inherit; }
      .wrap { max-width: 720px; margin: 0 auto; padding: 0 var(--gap-md); }

      /* ---------- 리퀴드 글라스 ----------
         유리는 뒤에 뭔가 있어야 보인다. 앰비언트 블롭을 깔고 그 위에 올린다. */
      body::before {
        content: "";
        position: fixed; inset: -25%; z-index: -1; pointer-events: none;
        background:
          radial-gradient(36% 30% at 16% 10%, var(--amb-1), transparent 70%),
          radial-gradient(32% 28% at 86% 24%, var(--amb-2), transparent 70%),
          radial-gradient(40% 34% at 46% 88%, var(--amb-3), transparent 72%);
        filter: blur(40px);
      }
      /* 테두리 그라디언트는 배경 두 겹 + background-clip 으로 만든다.
         border-image 는 border-radius 를 못 따라간다. */
      .glass {
        position: relative;
        border: 1px solid transparent;
        border-radius: var(--radius-glass, 18px);
        background-image:
          linear-gradient(var(--glass-bg), var(--glass-bg)),
          linear-gradient(140deg, var(--glass-edge-1), var(--glass-edge-2) 42%, transparent 72%);
        background-origin: border-box;
        background-clip: padding-box, border-box;
        -webkit-backdrop-filter: blur(var(--glass-blur)) saturate(180%);
        backdrop-filter: blur(var(--glass-blur)) saturate(180%);
        /* 스펙큘러는 모서리 한 줄이어야 유리로 읽힌다.
           면으로 깔면 카드 위쪽에 흰 띠가 생겨 어색해진다. */
        box-shadow: var(--shadow-md), inset 0 1px 0 var(--glass-inner);
      }

      .installtitle { font-size: var(--t-footnote); font-weight: var(--w-medium); }
      .steps { margin-top: 12px; display: flex; flex-direction: column; gap: 10px; }
      .step { display: flex; gap: 11px; font-size: var(--t-caption); line-height: 1.5; color: var(--text-2); }
      .step i {
        flex: none; width: 20px; height: 20px; border-radius: 50%;
        background: var(--accent-soft); color: var(--accent);
        font-family: var(--font-mono); font-style: normal; font-size: 11px;
        font-weight: var(--w-medium); display: grid; place-items: center;
      }
      .step b { color: var(--text); font-weight: var(--w-medium); }
      .step .sub { color: var(--text-3); font-size: var(--t-small); }
      .step .ico { font-family: -apple-system, system-ui; }
      /* ---------- home ---------- */
      .greet { padding: var(--gap-lg) 0 var(--gap-md); display: flex; align-items: flex-end; gap: 12px; }
      .greet h2 {
        flex: 1; font-size: var(--t-h2); line-height: var(--t-h2-lh);
        letter-spacing: var(--t-h2-ls); font-weight: var(--w-semibold);
      }
      .greet .dow { font-family: var(--font-mono); font-size: var(--t-caption); color: var(--text-3); }
      .streak {
        flex: none; padding: 6px 12px; border-radius: var(--radius-pill);
        background: var(--accent-soft); color: var(--accent);
        font-family: var(--font-mono); font-size: var(--t-caption); font-weight: var(--w-medium);
      }
      .hero { --radius-glass: 20px; padding: var(--pad-container); margin-bottom: var(--gap-md); }
      .hero .kicker {
        font-family: var(--font-mono); font-size: var(--t-small);
        letter-spacing: 0.1em; font-weight: var(--w-medium);
        color: var(--accent); filter: brightness(1.35);
      }
      .hero h3 {
        font-size: var(--t-h3); line-height: 1.15; letter-spacing: var(--t-h3-ls);
        font-weight: var(--w-semibold); margin: 6px 0 4px;
      }
      .hero .meta { font-size: var(--t-footnote); color: var(--text-2); }
      .hero .go {
        display: block; width: 100%; margin-top: var(--gap-md);
        min-height: var(--tap); border: 0; border-radius: var(--radius-button);
        background: var(--accent); color: var(--text-on-accent);
        font-size: var(--t-body); font-weight: var(--w-semibold); cursor: pointer;
        box-shadow: 0 6px 18px var(--accent-soft);
      }
      .hero .go:hover { background: var(--accent-hover); }
      .hero .go:focus-visible { outline: 2px solid var(--text); outline-offset: 2px; }

      .sec-tools { margin-top: var(--gap-lg); }
      .empty-session { text-align: center; padding: var(--gap-xl) var(--pad-container); margin-top: var(--gap-lg); }
      .empty-session h3 {
        font-size: var(--t-headline); font-weight: var(--w-semibold);
        letter-spacing: -0.4px; margin-bottom: 6px;
      }
      .empty-session p { font-size: var(--t-footnote); color: var(--text-3); }
      .empty-session .ptools { justify-content: center; margin-top: var(--gap-md); }
      .rlist.plain { padding: 0; border: 0; background: none; box-shadow: none; backdrop-filter: none; }
      .ritem-row { display: flex; align-items: center; border-bottom: 1px solid var(--line); }
      .ritem-row:last-child { border-bottom: 0; }
      .ritem-row .ritem { border-bottom: 0; }
      .redit {
        flex: none; width: 40px; height: 40px; margin-left: 4px;
        border: 0; border-radius: var(--radius-button);
        background: transparent; color: var(--text-3);
        font-size: var(--t-footnote); cursor: pointer;
      }
      .redit:hover { color: var(--accent); background: var(--accent-soft); }
      .redit:focus-visible { outline: 2px solid var(--accent); outline-offset: -2px; }
      .homesec { font-size: var(--t-footnote); font-weight: var(--w-medium); color: var(--text-3); margin: var(--gap-lg) 2px var(--gap-sm); }
      .gcard { --radius-glass: 18px; padding: var(--gap-md); }

      .todaystat { display: flex; gap: var(--gap-lg); flex-wrap: wrap; }
      .todaystat div { display: flex; flex-direction: column; gap: 2px; }
      .todaystat span { font-size: var(--t-small); color: var(--text-3); }
      .todaystat b {
        font-family: var(--font-mono); font-size: var(--t-headline);
        font-weight: var(--w-semibold); letter-spacing: -0.5px;
      }
      .todaystat b i { font-style: normal; font-size: var(--t-caption); color: var(--text-3); }

      .weekstrip { display: grid; grid-template-columns: repeat(7, 1fr); gap: 6px; }
      .wcell { display: flex; flex-direction: column; align-items: center; gap: 7px; }
      .wcell span { font-family: var(--font-mono); font-size: 10px; color: var(--text-3); }
      .wcell i {
        width: 100%; aspect-ratio: 1; max-height: 34px; border-radius: 9px;
        background: var(--surface-2); border: 1px solid transparent; font-style: normal;
      }
      .wcell.has i { background: var(--heat-2); }
      .wcell.lv1 i { background: var(--heat-1); }
      .wcell.lv3 i { background: var(--heat-3); }
      .wcell.today i { border-color: var(--accent); }
      .wsum {
        margin-top: var(--gap-md); padding-top: 12px; border-top: 1px solid var(--line);
        font-family: var(--font-mono); font-size: var(--t-caption); color: var(--text-3);
      }
      .wsum b { color: var(--text); font-weight: var(--w-medium); }

      .rlist { --radius-glass: 18px; padding: 4px var(--gap-md); }
      .ritem {
        display: flex; align-items: center; gap: 12px; width: 100%;
        padding: 14px 0; border: 0; border-bottom: 1px solid var(--line);
        background: transparent; text-align: left; cursor: pointer; color: var(--text);
      }
      .ritem:last-child { border-bottom: 0; }
      .ritem:focus-visible { outline: 2px solid var(--accent); outline-offset: -2px; }
      .ritem .rn { flex: 1; font-size: var(--t-footnote); font-weight: var(--w-medium); }
      .ritem .rd { font-family: var(--font-mono); font-size: var(--t-small); color: var(--text-3); }
      .ritem .rc { color: var(--text-3); font-size: var(--t-body); }
      .ritem.add { color: var(--accent); font-weight: var(--w-medium); font-size: var(--t-footnote); }

      /* ---------- app bar ---------- */
      .appbar {
        position: sticky; top: 0; z-index: 40;
        background: var(--nav-bg);
        border-bottom: 1px solid var(--line);
        -webkit-backdrop-filter: saturate(180%) blur(20px);
        backdrop-filter: saturate(180%) blur(20px);
      }
      .appbar-in {
        display: flex; align-items: center; gap: var(--gap-sm);
        max-width: 720px; margin: 0 auto;
        padding: calc(10px + var(--safe-t)) var(--gap-md) 10px;
      }
      .brandicon {
        width: 30px; height: 30px; flex: none;
        border-radius: 8px; display: block;
        box-shadow: 0 2px 6px rgba(0, 0, 0, 0.18);
      }
      .brandmark {
        font-size: var(--t-headline); line-height: 1;
        font-weight: var(--w-semibold); letter-spacing: -0.6px; margin-right: auto;
      }
      .brandmark small {
        display: block; margin-top: 3px;
        font-family: var(--font-mono); font-size: 10px;
        font-weight: var(--w-regular); letter-spacing: 0.08em;
        color: var(--text-3); text-transform: uppercase;
      }
      /* .wcell.today 와 클래스가 겹쳐 주간 스트립 칸이 10px 좁아졌었다.
         상단바 날짜는 id 로 좁혀 쓴다. */
      #today {
        font-family: var(--font-mono); font-size: var(--t-small);
        color: var(--text-3); margin-right: 10px; white-space: nowrap;
      }
      .iconbtn {
        width: var(--tap); height: var(--tap); flex: none;
        display: grid; place-items: center;
        border: 1px solid var(--line); border-radius: var(--radius-button);
        background: var(--surface); color: var(--text-2); cursor: pointer;
      }
      .iconbtn:hover { color: var(--text); border-color: var(--line-strong); }
      .iconbtn.on { background: var(--accent); border-color: var(--accent); color: var(--text-on-accent); }
      .iconbtn svg { width: 20px; height: 20px; display: block; }

      /* ---------- day chips ---------- */
      .chips {
        display: flex; gap: var(--gap-sm);
        max-width: 720px; margin: 0 auto; padding: 0 var(--gap-md) 10px;
        overflow-x: auto; scrollbar-width: none;
      }
      .chips:empty { display: none; }
      .chips::-webkit-scrollbar { display: none; }
      .chip {
        flex: none; padding: 8px 14px;
        border: 1px solid var(--line); border-radius: var(--radius-pill);
        background: var(--surface); font-size: var(--t-caption);
        font-weight: var(--w-medium); color: var(--text-2);
        cursor: pointer; white-space: nowrap;
      }
      .chip.on { background: var(--text); border-color: var(--text); color: var(--bg); }
      .chip-add { border-style: dashed; color: var(--accent); }
      .chip:focus-visible, .iconbtn:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

      /* ---------- bottom nav ---------- */
      .bottomnav {
        position: fixed; left: 0; right: 0; bottom: 0; z-index: 50;
        display: flex; background: var(--nav-bg);
        -webkit-backdrop-filter: saturate(180%) blur(20px);
        backdrop-filter: saturate(180%) blur(20px);
        border-top: 1px solid var(--line); padding-bottom: var(--safe-b);
      }
      .navitem {
        flex: 1; min-height: calc(var(--tap) + 10px);
        display: flex; flex-direction: column; align-items: center; justify-content: center;
        gap: 3px; border: 0; background: transparent;
        color: var(--text-3); font-size: 11px; font-weight: var(--w-medium);
        cursor: pointer; -webkit-tap-highlight-color: transparent;
      }
      .navitem svg { width: 22px; height: 22px; display: block; }
      .navitem.on { color: var(--accent); }
      .navitem:focus-visible { outline: 2px solid var(--accent); outline-offset: -3px; }

      /* ---------- alert ---------- */
      .alert { display: none; }
      .alert.on {
        display: block; margin-top: var(--gap-md); padding: 12px 14px;
        border-radius: var(--radius-container);
        font-size: var(--t-caption); line-height: var(--t-caption-lh); cursor: pointer;
      }
      .alert.bad { background: var(--danger-soft); border: 1px solid var(--danger); color: var(--text); }
      .alert.good { background: var(--success-soft); border: 1px solid var(--success); color: var(--text); }

      /* ---------- section head ---------- */
      .dayhead { padding: var(--gap-lg) 0 var(--gap-sm); }
      .dayhead .num {
        font-family: var(--font-mono); font-weight: var(--w-medium);
        font-size: var(--t-small); letter-spacing: 0.1em; color: var(--accent);
      }
      .dayhead h2 {
        font-size: var(--t-h2); line-height: var(--t-h2-lh);
        letter-spacing: var(--t-h2-ls); font-weight: var(--w-semibold); margin-top: 4px;
      }
      .dayhead p { font-size: var(--t-footnote); color: var(--text-3); margin-top: 4px; }
      .sechead {
        font-size: var(--t-headline); line-height: var(--t-headline-lh);
        font-weight: var(--w-semibold); letter-spacing: -0.4px;
        margin: var(--gap-xl) 0 var(--gap-sm);
      }

      /* ---------- groups & cards ---------- */
      .grp { margin-top: var(--gap-lg); }
      .grp-label {
        font-family: var(--font-mono); font-weight: var(--w-medium);
        font-size: var(--t-small); letter-spacing: 0.08em;
        color: var(--text-3); margin-bottom: var(--gap-sm); padding-left: 2px;
      }
      .card {
        background: var(--surface); border: 1px solid var(--line);
        border-radius: var(--radius-container); margin-bottom: var(--gap-sm); overflow: hidden;
      }
      .grp.circuit .card { border-left: 3px solid var(--purple); }
      .grp.warm .card { border-left: 3px solid var(--text-3); }
      .grp.main .card { border-left: 3px solid var(--accent); }

      .row {
        display: grid; grid-template-columns: 1fr auto; gap: 2px var(--gap-md);
        padding: 14px 16px; cursor: pointer; -webkit-tap-highlight-color: transparent;
      }
      .row:focus-visible { outline: 2px solid var(--accent); outline-offset: -2px; }
      .nm { font-size: var(--t-body); font-weight: var(--w-medium); align-self: center; }
      .nm small { font-weight: var(--w-regular); color: var(--text-3); font-size: var(--t-small); }
      .ld {
        font-family: var(--font-mono); font-weight: var(--w-medium);
        font-size: var(--t-body-lg); text-align: right; align-self: center; white-space: nowrap;
      }
      .ld small { font-size: var(--t-small); color: var(--text-3); }
      .mt { font-family: var(--font-mono); font-size: var(--t-small); color: var(--text-2); }
      .rt { font-family: var(--font-mono); font-size: var(--t-small); color: var(--text-3); text-align: right; }
      .last {
        grid-column: 1/-1; margin-top: var(--gap-sm);
        font-family: var(--font-mono); font-size: var(--t-small);
        color: var(--text-2); background: var(--surface-2);
        padding: 6px 9px; border-radius: var(--radius-button);
      }
      .prbadge {
        grid-column: 1/-1; margin-top: var(--gap-sm);
        display: inline-flex; align-items: baseline; gap: 4px; align-self: start;
        width: fit-content; padding: 3px 9px; border-radius: var(--radius-pill);
        background: var(--accent-soft); color: var(--accent);
        font-family: var(--font-mono); font-size: var(--t-small); font-weight: var(--w-medium);
      }
      .prbadge span { color: var(--text-3); font-weight: var(--w-regular); }
      .last b { font-weight: var(--w-medium); color: var(--text); margin-left: 6px; }
      .card.done .nm { text-decoration: line-through; text-decoration-thickness: 2px; }
      .card.done { opacity: 0.5; }

      .plates { grid-column: 1/-1; display: flex; align-items: center; gap: 3px; margin-top: 10px; height: 32px; }
      .bar { width: 18px; height: 4px; background: var(--n70); border-radius: 2px; flex: none; }
      .collar { width: 5px; height: 13px; background: var(--n90); border-radius: 1px; flex: none; }
      .plate { width: 13px; border-radius: 2px; flex: none; display: flex; align-items: center; justify-content: center; }
      .plate b {
        font-family: var(--font-mono); font-size: 9px; font-weight: var(--w-medium);
        color: #fff; transform: rotate(-90deg); white-space: nowrap;
      }
      .plate.lt b { color: #091e42; }
      .plabel { margin-left: 9px; font-family: var(--font-mono); font-size: var(--t-small); color: var(--text-3); }

      .cardtop { display: flex; align-items: stretch; }
      .cardtop .row { flex: 1; min-width: 0; }
      /* 세로 구분선 없이 카드에 얹는다. 안 끝난 종목은 옅은 링만 두고,
         끝나면 초록 원반 대신 체크 자국만 남긴다. */
      .cardcheck {
        flex: none; width: 48px;
        border: 0; background: transparent;
        cursor: pointer; display: grid; place-items: center;
        -webkit-tap-highlight-color: transparent;
      }
      .cardcheck i {
        width: 22px; height: 22px; border-radius: 50%;
        border: 1.5px solid var(--line-strong);
        font-style: normal; display: grid; place-items: center;
        transition: border-color 0.15s ease, background 0.15s ease;
      }
      .cardcheck:hover i { border-color: var(--text-3); }
      .cardcheck:focus-visible { outline: 2px solid var(--accent); outline-offset: -3px; border-radius: var(--radius-container); }

      /* 폰트에 딸린 ✓ 글리프는 굵기가 제각각이라 직접 그린다. */
      .card.done .cardcheck i {
        border-color: transparent; background: var(--check-fill);
      }
      .card.done .cardcheck i::after {
        content: ""; width: 5px; height: 9px;
        border: solid var(--success); border-width: 0 1.5px 1.5px 0;
        transform: rotate(45deg) translate(-1px, -1px);
      }
      /* 완료해도 카드를 흐리게 하지 않는다 — 아직 고칠 수 있어야 하니까 */
      .card.done { opacity: 1; }
      .card.done .nm { text-decoration-color: var(--text-3); }

      .dayprog {
        display: flex; align-items: center; gap: 10px;
        margin-top: var(--gap-lg); padding: 4px 2px;
      }
      .pinfo { display: flex; align-items: baseline; gap: 5px; white-space: nowrap; }
      .pinfo b {
        font-family: var(--font-mono); font-size: var(--t-footnote);
        font-weight: var(--w-semibold); line-height: 1;
      }
      .pinfo span { font-size: var(--t-small); color: var(--text-3); }
      .pinfo em {
        font-style: normal; font-size: var(--t-small);
        color: var(--success); font-weight: var(--w-medium); margin-left: 4px;
      }
      .pbtn {
        flex: none; margin-left: auto; padding: 7px 12px;
        border: 1px solid var(--line); border-radius: var(--radius-pill);
        background: transparent; color: var(--text-2);
        font-size: var(--t-small); font-weight: var(--w-medium);
        cursor: pointer; white-space: nowrap;
      }
      .pbtn:hover { border-color: var(--line-strong); color: var(--text); }
      .pbtn:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
      .dayprog.done .pbtn { border-color: var(--success); color: var(--success); }

      .swapbar {
        display: flex; align-items: center; gap: 10px; flex-wrap: wrap;
        margin-top: var(--gap-lg); padding: 12px 14px;
        border: 1px solid var(--accent); border-radius: var(--radius-container);
        background: var(--accent-soft);
        font-size: var(--t-caption); color: var(--text);
      }
      .swapbar b { font-weight: var(--w-medium); }
      .swapbar .btn { margin-left: auto; }
      /* ---------- panel ---------- */
      .panel { display: none; border-top: 1px solid var(--line); padding: var(--gap-md) 16px; background: var(--surface-2); }
      .card.open .panel { display: block; }
      .setrow { display: grid; grid-template-columns: 38px 1fr 1fr var(--tap); gap: 8px; align-items: center; margin-bottom: 8px; }
      .setno { font-family: var(--font-mono); font-size: var(--t-small); font-weight: var(--w-medium); color: var(--text-3); }
      .fld { position: relative; }
      .fld input {
        width: 100%; padding: 11px 28px 11px 11px;
        border: 1px solid var(--line); border-radius: var(--radius-button);
        background: var(--bg-elevated); font-family: var(--font-mono);
        font-size: var(--t-body); font-weight: var(--w-medium); color: var(--text); text-align: right;
      }
      .fld input:focus { outline: none; border-color: var(--accent); }
      .fld span {
        position: absolute; right: 9px; top: 50%; transform: translateY(-50%);
        font-family: var(--font-mono); font-size: var(--t-small); color: var(--text-3); pointer-events: none;
      }
      .chk {
        width: var(--tap); height: 42px;
        border: 1px solid var(--line); border-radius: var(--radius-button);
        background: var(--bg-elevated); font-size: var(--t-body);
        color: var(--text-3); cursor: pointer; line-height: 1;
      }
      .chk.on { background: var(--success); border-color: var(--success); color: #fff; }
      .ptools { display: flex; gap: var(--gap-sm); margin-top: var(--gap-md); flex-wrap: wrap; }
      .btn {
        min-height: 38px; padding: var(--btn-pad-y) var(--gap-md);
        border: 1px solid var(--line); border-radius: var(--radius-button);
        background: var(--surface); font-size: var(--t-caption);
        font-weight: var(--w-medium); color: var(--text-2); cursor: pointer;
      }
      .btn:hover { border-color: var(--line-strong); color: var(--text); }
      .btn:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
      .btn.primary { background: var(--accent); border-color: var(--accent); color: var(--text-on-accent); }
      .btn.warnbtn { color: var(--danger); }
      .alts { margin-top: var(--gap-md); padding-top: var(--gap-sm); border-top: 1px dashed var(--line); }
      .alts .t { font-family: var(--font-mono); font-size: var(--t-small); font-weight: var(--w-medium); color: var(--text-3); margin-bottom: 6px; }
      .alts li { font-size: var(--t-footnote); color: var(--text-2); list-style: none; padding: 4px 0; }
      .alts li b { font-family: var(--font-mono); color: var(--text); font-weight: var(--w-medium); }
      .hint { font-size: var(--t-caption); line-height: var(--t-caption-lh); color: var(--text-3); margin-top: 10px; }

      /* ---------- boxes ---------- */
      .addbox {
        background: var(--surface); border: 1px solid var(--line);
        border-radius: var(--radius-container); padding: var(--pad-container); margin-top: var(--gap-lg);
      }
      .addbox h4 { font-size: var(--t-caption); font-weight: var(--w-medium); color: var(--text-3); margin-bottom: var(--gap-sm); }
      .addgrid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
      .addgrid input, .searchfld, .hsel, .datefld {
        padding: 11px; border: 1px solid var(--line); border-radius: var(--radius-button);
        background: var(--bg-elevated); font-size: var(--t-footnote); color: var(--text); width: 100%;
      }
      .addgrid input:focus, .searchfld:focus, .hsel:focus, .datefld:focus { outline: none; border-color: var(--accent); }
      .addgrid .full { grid-column: 1/-1; }
      .searchfld { font-size: var(--t-body); }

      /* ---------- history ---------- */
      .hsel { margin: var(--gap-md) 0; font-size: var(--t-body); }
      .chart {
        background: var(--surface); border: 1px solid var(--line);
        border-radius: var(--radius-container); padding: var(--gap-md) 8px 8px;
      }
      .chart .grid { stroke: currentColor; stroke-opacity: 0.14; }
      .chart .lbl { fill: currentColor; fill-opacity: 0.5; }
      .chart .line { stroke: var(--accent); }
      .chart .pt { fill: var(--bg-elevated); stroke: var(--accent); }
      /* 하단바 바로 아래 붙지 않게 */
      .seg.metrics { margin-top: var(--gap-lg); }
      .metricnote {
        margin-top: var(--gap-sm); font-size: var(--t-caption);
        line-height: var(--t-caption-lh); color: var(--text-3);
      }
      .metricnote code {
        font-family: var(--font-mono); font-size: var(--t-small);
        color: var(--text-2); background: var(--surface-2);
        padding: 2px 6px; border-radius: 4px;
      }
      .hlist { margin-top: var(--gap-md); }
      .hitem {
        background: var(--surface); border: 1px solid var(--line);
        border-radius: var(--radius-container); padding: 12px 14px;
        margin-bottom: var(--gap-sm); display: flex; gap: var(--gap-md); align-items: baseline;
      }
      .hitem .d { font-family: var(--font-mono); font-size: var(--t-small); color: var(--text-3); flex: none; }
      .hitem .s { font-family: var(--font-mono); font-size: var(--t-caption); color: var(--text); font-weight: var(--w-medium); }
      .empty { text-align: center; color: var(--text-3); font-size: var(--t-footnote); padding: var(--pad-container-lg) var(--pad-container); line-height: 1.7; }

      /* ---------- rest timer ---------- */
      .timer {
        position: fixed; left: 0; right: 0;
        bottom: calc(var(--tap) + 10px + var(--safe-b));
        z-index: 55; background: var(--n900); color: #fff;
        padding: 12px var(--gap-md);
        display: none; align-items: center; gap: var(--gap-md);
        box-shadow: var(--shadow-lg);
      }
      .timer.on { display: flex; }
      .timer .tval { font-family: var(--font-mono); font-size: var(--t-h4); font-weight: var(--w-semibold); line-height: 1; min-width: 78px; }
      .timer .tlbl { font-size: var(--t-small); color: rgba(255, 255, 255, 0.7); flex: 1; line-height: 1.35; }
      .timer button {
        min-height: 38px; padding: 9px 13px;
        border: 1px solid rgba(255, 255, 255, 0.25); border-radius: var(--radius-button);
        background: transparent; color: #fff; font-size: var(--t-caption); cursor: pointer;
      }
      .timer button:focus-visible { outline: 2px solid #fff; outline-offset: 2px; }
      .timer.done { background: var(--green-600); }

      /* ---------- footer rules ---------- */
      .foot { margin-top: var(--gap-xl); border-top: 1px solid var(--line-strong); padding-top: var(--gap-lg); }
      .foot h3 { font-size: var(--t-headline); font-weight: var(--w-semibold); letter-spacing: -0.4px; margin-bottom: var(--gap-sm); }
      .foot .rule { display: flex; gap: 12px; padding: 9px 0; font-size: var(--t-footnote); color: var(--text-2); }
      .foot .rule i {
        font-family: var(--font-mono); font-style: normal; font-weight: var(--w-medium);
        font-size: var(--t-small); color: var(--accent); padding-top: 3px; flex: none;
      }
      .foot .rule b { color: var(--text); font-weight: var(--w-medium); }
      .warn {
        background: var(--warning-soft); border: 1px solid var(--warning);
        border-radius: var(--radius-container); padding: 12px 14px;
        font-size: var(--t-caption); color: var(--text); margin-top: var(--gap-md);
      }

      /* ---------- settings ---------- */
      .srow {
        display: flex; justify-content: space-between; align-items: center; gap: 12px;
        padding: 12px 0; border-bottom: 1px solid var(--line);
        font-size: var(--t-footnote); color: var(--text-3);
      }
      .srow:last-child { border-bottom: 0; }
      .srow b {
        font-family: var(--font-mono); font-size: var(--t-caption);
        font-weight: var(--w-medium); color: var(--text); text-align: right; word-break: break-all;
      }
      .seg { display: flex; gap: 4px; padding: 4px; background: var(--surface-2); border-radius: var(--radius-button); }
      .segbtn {
        flex: 1; min-height: 36px; border: 0; border-radius: 6px;
        background: transparent; color: var(--text-3);
        font-size: var(--t-caption); font-weight: var(--w-medium); cursor: pointer;
      }
      .segbtn.on { background: var(--surface); color: var(--text); box-shadow: var(--shadow-sm); }
      .segbtn:focus-visible { outline: 2px solid var(--accent); outline-offset: -2px; }

      /* ---------- date bar ---------- */
      .datebar {
        display: flex; align-items: center; gap: var(--gap-sm);
        margin-top: var(--gap-lg); padding: 8px;
        border: 1px solid var(--line); border-radius: var(--radius-container); background: var(--surface);
      }
      .datebar.past { background: var(--warning-soft); border-color: var(--warning); }
      .dnav {
        width: 38px; height: 38px; flex: none;
        border: 1px solid var(--line); border-radius: var(--radius-button);
        background: var(--bg-elevated); font-family: var(--font-mono);
        font-size: var(--t-footnote); color: var(--text-2); cursor: pointer;
      }
      .dnav:disabled { opacity: 0.3; cursor: default; }
      .dnav:not(:disabled):hover { border-color: var(--line-strong); color: var(--text); }
      .dnav:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
      .datefld { flex: 1; min-width: 0; font-family: var(--font-mono); font-weight: var(--w-medium); text-align: center; }
      .datenote {
        display: flex; align-items: center; gap: 9px;
        margin-top: var(--gap-sm); padding: 10px 12px;
        border-radius: var(--radius-container);
        background: var(--warning-soft); border: 1px solid var(--warning);
        font-size: var(--t-caption); color: var(--text);
      }
      .datenote b { flex: 1; font-weight: var(--w-medium); }

      .summary { padding: var(--gap-md); }
      .sumgrid {
        display: grid; grid-template-columns: 1fr 1fr; gap: 1px;
        background: var(--line); border: 1px solid var(--line);
        border-radius: var(--radius-button); overflow: hidden; margin-bottom: var(--gap-md);
      }
      .sumcell {
        background: var(--surface); padding: 12px 14px;
        display: flex; flex-direction: column; gap: 4px;
      }
      .sumcell span { font-size: var(--t-small); color: var(--text-3); }
      .sumcell b {
        font-family: var(--font-mono); font-size: var(--t-headline);
        font-weight: var(--w-semibold); letter-spacing: -0.5px;
      }
      .sumcell b i { font-style: normal; font-size: var(--t-caption); color: var(--text-3); margin-left: 1px; }
      .sumrow { display: flex; align-items: center; gap: var(--gap-md); margin-bottom: 10px; }
      .sumrow label { font-size: var(--t-footnote); color: var(--text-3); flex: none; }
      .sumrow .fld { flex: 1; }
      .memofld {
        width: 100%; padding: 12px; resize: vertical; min-height: 76px;
        border: 1px solid var(--line); border-radius: var(--radius-button);
        background: var(--bg-elevated); color: var(--text);
        font-size: var(--t-footnote); line-height: 1.6;
      }
      .memofld:focus { outline: none; border-color: var(--accent); }
      .mealrow { display: flex; align-items: center; gap: 8px; padding: 8px 0; border-bottom: 1px solid var(--line); }
      .mealrow:last-of-type { border-bottom: none; }
      .mealtext { flex: 1; font-size: var(--t-footnote); line-height: 1.4; }
      .mealtext small { color: var(--text-3); margin-left: 4px; }
      .mealrm { min-width: 28px; min-height: 28px; padding: 2px 6px; font-size: var(--t-small); }
      .mealform { display: flex; gap: 6px; align-items: center; margin-top: 8px; }
      .mealform .searchfld { flex: 1; margin: 0; }
      .mealform input[type="number"] { margin: 0; }
      .calcell.future { opacity: 0.3; }
      button.calcell { cursor: pointer; }

      /* ---------- calendar ---------- */
      .calhead { display: flex; align-items: center; gap: 10px; padding: var(--gap-lg) 0 4px; }
      .calhead h2 { font-size: var(--t-h4); line-height: 1.1; letter-spacing: var(--t-h4-ls); font-weight: var(--w-semibold); flex: 1; }
      .calnav {
        width: 40px; height: 40px; flex: none;
        border: 1px solid var(--line); border-radius: var(--radius-button);
        background: var(--surface); font-size: var(--t-body); color: var(--text-2); cursor: pointer;
      }
      .calnav:hover { border-color: var(--line-strong); color: var(--text); }
      .calnav:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
      .calstat { display: flex; gap: var(--gap-md); flex-wrap: wrap; padding: 2px 2px var(--gap-md); font-size: var(--t-small); color: var(--text-3); }
      .calstat b { font-family: var(--font-mono); color: var(--text); font-size: var(--t-footnote); font-weight: var(--w-medium); }
      .calgrid { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius-container); padding: 12px 10px 10px; }
      .caldow, .calweek { display: grid; grid-template-columns: repeat(7, 1fr); gap: 4px; }
      .caldow span { text-align: center; font-family: var(--font-mono); font-size: 10px; font-weight: var(--w-medium); color: var(--text-3); padding-bottom: 8px; }
      .caldow span:first-child { color: var(--danger); }
      .calcell {
        aspect-ratio: 1; max-height: 52px;
        border: 1px solid transparent; border-radius: var(--radius-button);
        background: transparent; display: flex; flex-direction: column;
        align-items: center; justify-content: center; gap: 3px;
        font-family: var(--font-mono); font-size: var(--t-caption);
        color: var(--text-3); cursor: default; padding: 0; -webkit-tap-highlight-color: transparent;
      }
      .calcell.pad { visibility: hidden; }
      .calcell.has { cursor: pointer; color: var(--text); font-weight: var(--w-medium); }
      .calcell.lv1 { background: var(--heat-1); }
      .calcell.lv2 { background: var(--heat-2); }
      .calcell.lv3 { background: var(--heat-3); }
      .calcell.today { border-color: var(--accent); }
      .calcell.sel { background: var(--text); color: var(--bg); }
      .calcell:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
      .calcell i { width: 4px; height: 4px; border-radius: 50%; background: var(--green-600); font-style: normal; }
      .calcell.sel i { background: var(--bg); }
      .calday { margin-top: var(--gap-md); }
      .caldayhead { display: flex; align-items: baseline; gap: 10px; margin-bottom: var(--gap-sm); }
      .caldayhead h3 { font-family: var(--font-mono); font-size: var(--t-body); font-weight: var(--w-semibold); }
      .caldayhead span { font-family: var(--font-mono); font-size: var(--t-small); color: var(--text-3); }
      .calex {
        background: var(--surface); border: 1px solid var(--line);
        border-left: 3px solid var(--accent); border-radius: var(--radius-container);
        padding: 12px 14px; margin-bottom: var(--gap-sm);
      }
      .calex .n { font-size: var(--t-footnote); font-weight: var(--w-medium); margin-bottom: 3px; }
      .calex .s { font-family: var(--font-mono); font-size: var(--t-caption); color: var(--text-2); }
      .calex .v { font-family: var(--font-mono); font-size: var(--t-small); color: var(--text-3); margin-top: 3px; }

      /* ---------- exercise picker ---------- */
      .cats { display: flex; gap: 5px; overflow-x: auto; scrollbar-width: none; padding-bottom: 10px; }
      .cats::-webkit-scrollbar { display: none; }
      .cat {
        flex: none; padding: 7px 13px;
        border: 1px solid var(--line); border-radius: var(--radius-pill);
        background: var(--bg-elevated); font-size: var(--t-caption);
        font-weight: var(--w-medium); color: var(--text-2); cursor: pointer; white-space: nowrap;
      }
      .cat.on { color: #fff; border-color: transparent; }
      .cat:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
      .suglist {
        list-style: none; margin: 8px 0 0; max-height: 240px; overflow-y: auto;
        border: 1px solid var(--line); border-radius: var(--radius-button); background: var(--bg-elevated);
      }
      .suglist:empty { display: none; }
      .sug {
        display: flex; align-items: center; gap: 10px; width: 100%;
        padding: 11px 12px; border: 0; border-bottom: 1px solid var(--line);
        background: transparent; text-align: left; cursor: pointer;
        font-size: var(--t-footnote); color: var(--text);
      }
      .sug:last-child { border-bottom: 0; }
      .sug:hover, .sug:focus-visible { background: var(--surface-2); outline: none; }
      .sug .tag {
        flex: none; font-family: var(--font-mono); font-size: 10px;
        font-weight: var(--w-medium); color: #fff; padding: 3px 7px; border-radius: 4px;
      }
      .sug .nm2 { flex: 1; font-weight: var(--w-medium); }
      .sug .meta { flex: none; font-family: var(--font-mono); font-size: 10px; color: var(--text-3); }
      .sugnone { padding: 12px; font-size: var(--t-caption); color: var(--text-3); text-align: center; }
      .picked {
        display: flex; align-items: center; gap: 8px; margin-top: 8px;
        padding: 10px 12px; border-radius: var(--radius-button);
        background: var(--success-soft); border: 1px solid var(--success);
        font-size: var(--t-caption); color: var(--text);
      }
      .picked b { flex: 1; font-weight: var(--w-medium); }

      @media (prefers-reduced-motion: reduce) { * { transition: none !important; animation: none !important; } }
    </style>
  </head>
  <body>
    <header class="appbar">
      <div class="appbar-in">
        <img class="brandicon" src="./icon-192.png" alt="" width="30" height="30" />
        <div class="brandmark">심트<small>Simple Training</small></div>
        <span class="today" id="today"></span>
        <button class="iconbtn" id="nav-tips" aria-label="훈련 팁" title="훈련 팁">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M9 18h6M10 21h4M12 3a6 6 0 0 0-3.6 10.8c.5.4.8.9.9 1.5l.1.7h5.2l.1-.7c.1-.6.4-1.1.9-1.5A6 6 0 0 0 12 3z"></path>
          </svg>
        </button>
        <button class="iconbtn" id="nav-settings" aria-label="설정" title="설정">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <circle cx="12" cy="12" r="3"></circle>
            <path d="M19.4 15a1.7 1.7 0 0 0 .3 1.9l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.9-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.9.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.9 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1A1.7 1.7 0 0 0 4.6 9a1.7 1.7 0 0 0-.3-1.9l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.9.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.9-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.9V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"></path>
          </svg>
        </button>
      </div>
      <div class="chips" id="chips"></div>
    </header>

    <div class="wrap"><div class="alert" id="alert" role="alert"></div></div>
    <div class="wrap" id="view"></div>

    <input
      type="file"
      id="d-file"
      accept="application/json,.json"
      style="display: none"
    />

    <div class="timer" id="timer" role="timer">
      <div class="tval" id="tval">0:00</div>
      <div class="tlbl" id="tlbl">휴식</div>
      <button id="t30">+30초</button>
      <button id="tskip">건너뛰기</button>
    </div>

    <nav class="bottomnav" aria-label="주 메뉴">
      <button class="navitem" data-section="home" aria-label="홈">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M3 10.5 12 3l9 7.5V20a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"></path>
        </svg>
        홈
      </button>
      <button class="navitem" data-section="workout" aria-label="운동">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M6.5 6.5v11M17.5 6.5v11M3.5 9.5v5M20.5 9.5v5M6.5 12h11"></path>
        </svg>
        운동
      </button>
      <button class="navitem" data-section="records" aria-label="기록">

      /* ============ log write path ============ */
      /* 읽기는 Gym.entryFor / Gym.viewSets 로. 여기는 실제로 값을 쓸 때만 부른다. */
      function ensureEntry(exId, date, nSets) {
        if (!logs[exId]) logs[exId] = [];
        var e = Gym.entryFor(logs, exId, date);
        if (!e) {
          e = { date: date, sets: [] };
          logs[exId].push(e);
          logs[exId].sort(function (a, b) {
            return a.date < b.date ? -1 : a.date > b.date ? 1 : 0;
          });
        }
        while (e.sets.length < nSets) e.sets.push(Gym.blankSet());
        return e;
      }

      /* ============ rest timer ============ */
      var Timer = (function () {
        var endAt = 0,
          iv = null,
          hideTo = null,
          lock = null,
          label = "휴식";
        var el = document.getElementById("timer"),
          val = document.getElementById("tval"),
          lbl = document.getElementById("tlbl");
        var actx = null;
        var lastSec = -1;

        function remainMs() {
          return endAt - Date.now();
        }
        function remain() {
          return Math.max(0, Math.ceil(remainMs() / 1000));
        }
        function fmt(s) {
          var m = Math.floor(s / 60),
            r = s % 60;
          return m + ":" + (r < 10 ? "0" : "") + r;
        }
        function paint() {
          val.textContent = fmt(remain());
        }

        /* AudioContext 는 사용자 제스처 안에서 만들어 둬야 iOS 가 나중 재생을 막지 않는다. */
        function audio() {
          if (actx) {
            if (actx.state === "suspended") actx.resume().catch(function () {});
            return actx;
          }
          try {
            var C = window.AudioContext || window.webkitAudioContext;
            if (!C) return null;
            actx = new C();
          } catch (e) {
            return null;
          }
          return actx;
        }

        /* at 초 뒤에 한 음을 예약한다. 삼각파는 사인파보다 배음이 있어
           같은 게인에서도 헬스장 소음 속에서 더 잘 들린다. */
        function tone(freq, at, dur, vol) {
          var ctx = audio();
          if (!ctx) return;
          try {
            var t0 = ctx.currentTime + at;
            var o = ctx.createOscillator(),
              g = ctx.createGain();
            o.connect(g);
            g.connect(ctx.destination);
            o.type = "triangle";
            o.frequency.setValueAtTime(freq, t0);
            g.gain.setValueAtTime(0.0001, t0);
            g.gain.exponentialRampToValueAtTime(vol, t0 + 0.012);
            g.gain.setValueAtTime(vol, t0 + dur * 0.6);
            g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
            o.start(t0);
            o.stop(t0 + dur + 0.02);
          } catch (e) {}
        }

        /* 카운트다운 한 음 — 뚜. */
        function cue() {
          tone(TONE_CUE_HZ, 0, 0.16, 0.55);
          if (navigator.vibrate) {
            try {
              navigator.vibrate(60);
            } catch (e) {}
          }
        }

        /* 종료음 — 띠. 카운트다운의 뚜보다 한 옥타브 위로 올려 끝을 알린다. */
        function endTone() {
          tone(TONE_END_HZ, 0, 0.5, 0.8);
        }

        function releaseWake() {
          if (!lock) return;
          try {
            lock.release().catch(function () {});
          } catch (e) {}
          lock = null;
        }
        function requestWake() {
          if (!navigator.wakeLock || lock || !iv) return;
          try {
            navigator.wakeLock
              .request("screen")
              .then(function (l) {
                if (iv) lock = l;
                else {
                  try {
                    l.release();
                  } catch (e) {}
                }
              })
              .catch(function () {});
          } catch (e) {}
        }

        function clearHide() {
          if (hideTo) {
            clearTimeout(hideTo);
            hideTo = null;
          }
        }

        function finish() {
          if (iv) {
            clearInterval(iv);
            iv = null;
          }
          paint();
          el.classList.add("done");
          lbl.textContent = "다음 세트 준비";
          endTone();
          if (navigator.vibrate) {
            try {
              navigator.vibrate([320]);
            } catch (e) {}
          }
          releaseWake();
          clearHide();
          hideTo = setTimeout(function () {
            hideTo = null;
            el.classList.remove("on", "done");
          }, TIMER_HIDE_MS);
        }

        function tick() {
          paint();
          var left = remainMs();
          /* 초가 넘어가는 순간에만 울린다. 틱은 초보다 잦다. */
          var sec = Math.ceil(left / 1000);
          if (sec !== lastSec) {
            lastSec = sec;
            if (TONE_CUE_SECS.indexOf(sec) >= 0) cue();
          }
          if (left <= 0) finish();
        }

        function run() {
          if (iv) clearInterval(iv);
          iv = setInterval(tick, TIMER_TICK_MS);
          requestWake();
        }

        /* 남은 초를 빼는 대신 종료 시각을 잡아둔다.
     그래야 화면이 꺼져 틱이 누락돼도 복귀했을 때 값이 맞다. */
        function start(sec, text) {
          if (!sec) return;
          audio();
          clearHide();
          endAt = Date.now() + sec * 1000;
          lastSec = sec;
          label = text || "휴식";
          lbl.textContent = label;
          el.classList.add("on");
          el.classList.remove("done");
          paint();
          run();
        }

        function stop() {
          if (iv) {
            clearInterval(iv);
            iv = null;
          }
          clearHide();
          endAt = 0;
          el.classList.remove("on", "done");
          releaseWake();
        }

        function extend() {
          clearHide();
          endAt = (iv ? endAt : Date.now()) + ADD_SECONDS * 1000;
          lbl.textContent = label;
          el.classList.add("on");
          el.classList.remove("done");
          paint();
          if (!iv) run();
        }

        document.getElementById("t30").addEventListener("click", extend);
        document.getElementById("tskip").addEventListener("click", stop);

        /* 화면 잠금 중에는 OS 가 wake lock 을 회수한다. 돌아오면 다시 잡고 값도 맞춘다.
           다른 앱(영상 등)에서 돌아오면 AudioContext 가 interrupted 상태이므로 resume 해 준다. */
        document.addEventListener("visibilitychange", function () {
          if (document.visibilityState !== "visible") return;
          if (actx && actx.state === "suspended") {
            actx.resume().catch(function () {});
          }
          if (!iv) return;
          tick();
          requestWake();
        });

        return { start: start, stop: stop };
      })();

      function allExercises() {
        var out = [];
        /* custom 을 먼저 넣어서, 같은 ID 가 있으면 수정된 버전이 우선한다. */
        allDays().forEach(function (day) {
          (custom[day.id] || []).forEach(function (e) {
            out.push(e);
          });
          WARM.concat(day.main, CIRCUIT).forEach(function (e) {
            out.push(e);
          });
        });
        var seen = {},
          uniq = [];
        out.forEach(function (e) {
          if (!seen[e.id]) {
            seen[e.id] = 1;
            uniq.push(e);
          }
        });
        return uniq;
      }

      function findExercise(id) {
        var all = allExercises();
        for (var i = 0; i < all.length; i++)
          if (all[i].id === id) return all[i];
        return null;
      }

      /* 종목 정보를 어디서든 찾는다 — 루틴 · 내가 넣은 것 · 카탈로그 · 내 종목. */
      function resolveExercise(id) {
        var inRoutine = findExercise(id);
        if (inRoutine) return inRoutine;
        var lib = GymExercises.BY_ID[id] || libById(id);
        if (lib) return lib;
        /* 어디에도 없는 id (지운 종목의 옛 기록 등) 도 카드로는 보여준다. */
        return {
          id: id, name: id, load: 0, unit: "kg",
          sets: 3, reps: "", rest: 60,
        };
      }

      /* 그날 화면에 띄울 종목 목록. 저장된 게 없으면 기록에서 역산한다. */
      function sessionIds(date) {
        if (sessions[date] && sessions[date].length) return sessions[date].slice();
        return Gym.sessionFromLogs(logs, date);
      }

      function setSession(date, ids) {
        if (ids && ids.length) sessions[date] = ids;
        else delete sessions[date];
        saveSessions();

      /* 세트 수는 사용자가 바꿨으면 그 값을, 아니면 루틴 기본값을 쓴다. */
      function setCountFor(ex, date) {
        var e = Gym.entryFor(logs, ex.id, date);
        return e && e.sets.length ? e.sets.length : ex.sets;

      /* 캘린더는 지금 루틴에 없는 종목(예전에 지운 것, 들여온 것)도 보여줘야 한다.
         루틴 → 카탈로그 → 그래도 없으면 id 순으로 이름을 찾는다. */
      function exerciseName(id) {
        var inRoutine = findExercise(id);
        if (inRoutine) return inRoutine.name;
        var inCatalog = GymExercises.BY_ID[id] || libById(id);
        if (inCatalog) return inCatalog.name;
        return id;
      }

      var CATALOG_CAT_BY_NAME = (function () {

      /* 루틴의 종목을 그날 세션에 붙인다. 이미 있는 건 건너뛴다. */
      function loadRoutine(routineId, date) {
        var day = allDays().filter(function (d) {
          return d.id === routineId;
        })[0];
        if (!day) return;
        var added2 = custom[routineId] || [];
        var hiddenIds = {};
        added2.forEach(function (e) { if (e._hidden) hiddenIds[e.id] = 1; });
        var warm = day.freeform
          ? added2.filter(function (e) { return e.grp === "warm" && !e._hidden && !e.override; })
          : WARM.filter(function (e) { return !hiddenIds[e.id]; })
              .concat(added2.filter(function (e) { return e.grp === "warm" && !e._hidden && !e.override; }));
        var mainBase = day.main.filter(function (e) { return !hiddenIds[e.id]; });
        var main = applyOrder(
          routineId,
          mainBase.concat(added2.filter(function (e) { return e.grp !== "warm" && !e._hidden && !e.override; })),
        );
        var circuit = day.freeform ? [] : CIRCUIT.filter(function (e) { return !hiddenIds[e.id]; });
        /* 웜업 → 메인 → 서킷. 루틴 화면에서 보이는 순서 그대로 담는다. */
        var incoming = warm
          .concat(main, circuit)
          .map(function (e) { return e.id; });

        var cur = sessionIds(date);
        var seen = {};
        cur.forEach(function (id) { seen[id] = 1; });
        var added = 0;
        incoming.forEach(function (id) {
          if (seen[id]) return;
          seen[id] = 1;
          cur.push(id);
          added += 1;
        });
        setSession(date, cur);
        state.panel = null;
        render();
        notify(
          added
            ? day.name + " 에서 " + added + "종목을 불러왔어요."
            : day.name + " 의 종목은 이미 다 있어요.",
          added ? "good" : "bad",
        );
      }

      function newRoutine() {
        var name = (window.prompt("루틴 이름을 지어주세요 (예: 팔 집중, 홈트)") || "").trim();
        if (!name) return;
        var r = { id: "r-" + Date.now(), name: name.slice(0, MAX_NAME) };
        routines = routines.concat([r]);
        if (!saveRoutines()) return;
        state.day = r.id;
        state.section = "workout";
        render();
        notify(r.name + " 루틴을 만들었어요.", "good");

      function renameRoutine(id) {
        var cur = routines.filter(function (r) { return r.id === id; })[0];
        if (!cur) return;
        var name = (window.prompt("새 이름", cur.name) || "").trim();
        if (!name) return;
        routines = routines.map(function (r) {
          return r.id === id ? { id: r.id, name: name.slice(0, MAX_NAME) } : r;
        });
        saveRoutines();
        render();
      }

      function deleteRoutine(id) {
        var cur = routines.filter(function (r) { return r.id === id; })[0];
        if (!cur) return;
        if (
          !window.confirm(
            cur.name + " 루틴을 지울까요?\n담긴 종목 구성만 사라지고 운동 기록은 남아요.",
          )
        )
          return;
        routines = routines.filter(function (r) { return r.id !== id; });
        delete custom[id];
        saveRoutines();
        saveCustom();
        state.day = DAYS[0].id;
        render();
        notify(cur.name + " 루틴을 지웠어요.", "good");
      }

      /* 루틴 안의 종목 속성(세트·반복·중량·휴식)을 수정한다.
         기본 루틴의 종목은 custom 에 override 로 넣는다. */
      function editExerciseInRoutine(exId, dayId) {
        var ex = resolveExercise(exId);
        if (!ex) return;
        var newLoad = window.prompt("중량 (kg)", ex.load);
        if (newLoad === null) return;
        var newSets = window.prompt("세트 수", ex.sets);
        if (newSets === null) return;
        var newReps = window.prompt("반복 (예: 12회)", ex.reps);
        if (newReps === null) return;
        var newRest = window.prompt("휴식 (초)", ex.rest);
        if (newRest === null) return;

        var load = parseFloat(newLoad);
        var sets = parseInt(newSets, 10);
        var rest = parseInt(newRest, 10);
        var reps = newReps.trim().slice(0, MAX_REPS);

        /* custom 배열에서 같은 id 를 찾는다 */
        if (!custom[dayId]) custom[dayId] = [];
        var found = false;
        custom[dayId] = custom[dayId].map(function (e) {
          if (e.id === exId) {
            found = true;
            var copy = {};
            for (var k in e) { if (e.hasOwnProperty(k)) copy[k] = e[k]; }
            copy.load = isFinite(load) && load >= 0 ? load : e.load;
            copy.sets = Math.min(MAX_SETS, Math.max(1, sets || e.sets));
            copy.reps = reps || e.reps;
            copy.rest = Math.min(MAX_REST, Math.max(0, isFinite(rest) ? rest : e.rest));
            return copy;
          }
          return e;
        });
        /* 기본 종목(custom 에 없던 것)이면 override 항목을 추가 */
        if (!found) {
          custom[dayId].push({
            id: ex.id,
            name: ex.name,
            load: isFinite(load) && load >= 0 ? load : ex.load,
            unit: ex.unit,
            sets: Math.min(MAX_SETS, Math.max(1, sets || ex.sets)),
            reps: reps || ex.reps,
            rest: Math.min(MAX_REST, Math.max(0, isFinite(rest) ? rest : ex.rest)),
            grp: ex.grp || "main",
            override: true,
          });
          if (ex.cat) custom[dayId][custom[dayId].length - 1].cat = ex.cat;
          if (ex.plates) custom[dayId][custom[dayId].length - 1].plates = true;
        }
        saveCustom();
        render();
        notify(ex.name + " 을(를) 수정했어요.", "good");
      }

      /* 기본 루틴의 종목도 삭제할 수 있도록 한다.
         기본 종목을 삭제하면 custom 에 _hidden 플래그로 기록한다. */
      function deleteFromRoutine(exId, dayId) {
        var ex = resolveExercise(exId);
        var name = ex ? ex.name : exId;
        if (!window.confirm(name + " 을(를) 루틴에서 뺄까요?")) return;

        /* custom 에 있는 종목인지 확인 */
        if (!custom[dayId]) custom[dayId] = [];
        var inCustom = custom[dayId].some(function (e) { return e.id === exId && !e.override; });

        if (inCustom) {
          /* 사용자가 추가한 종목 — 그냥 지운다 */
          custom[dayId] = custom[dayId].filter(function (e) { return e.id !== exId; });
        } else {
          /* 기본 종목 — hidden 마크를 넣는다 */
          var alreadyHidden = custom[dayId].some(function (e) { return e.id === exId && e._hidden; });
          if (!alreadyHidden) {
            /* override 가 있으면 hidden 으로 바꾼다 */
            var hadOverride = false;
            custom[dayId] = custom[dayId].filter(function (e) {
              if (e.id === exId && e.override) { hadOverride = true; return false; }
              return true;
            });
            custom[dayId].push({ id: exId, _hidden: true });
          }
        }
        delete state.open[exId];
        state.chartEx = null;
        saveCustom();
        render();
        notify(name + " 을(를) 삭제했어요.", "good");
      }

      /* 세션은 sessions[date] 배열 순서를 그대로 쓴다. */
      function applySessionOrder(date, ids) {
        return ids;
      }

      /* 저장된 순서가 있으면 그대로, 없으면 원래 순서. 새로 추가된 종목은 뒤로. */
      function applyOrder(dayId, list) {
        var ord = order[dayId];
        if (!ord || !ord.length) return list;
        var idx = {};
        ord.forEach(function (id, i) {
          idx[id] = i;
        });
        return list.slice().sort(function (a, b) {
          var ia = idx[a.id] == null ? 9999 : idx[a.id];
          var ib = idx[b.id] == null ? 9999 : idx[b.id];
          return ia - ib;
        });
      }

      function moveExercise(dayId, exId, delta) {
        var day = allDays().filter(function (d) {
          return d.id === dayId;
        })[0];
        if (!day) return;
        var list = applyOrder(
          dayId,
          day.main.concat(
            (custom[dayId] || []).filter(function (e) {
              return e.grp !== "warm";
            }),
          ),
        );
        var ids = list.map(function (e) {
          return e.id;
        });
        var i = ids.indexOf(exId);
        var j = i + delta;
        if (i < 0 || j < 0 || j >= ids.length) return;
        ids[i] = ids[j];
        ids[j] = exId;
        order[dayId] = ids;
        saveOrder();
        render();
      }

      /* ---------- 설치 안내 ---------- */
      var installPrompt = null;

      function isStandalone() {
        return (
          window.matchMedia("(display-mode: standalone)").matches ||
          navigator.standalone === true
        );
      }

      function isIOS() {
        return (
          /iP(hone|od|ad)/.test(navigator.userAgent) ||
          (navigator.platform === "MacIntel" && navigator.maxTouchPoints > 1)
        );
      }

      /* Chrome·Edge 계열은 브라우저가 설치 시점을 정해 이 이벤트를 준다.
         이걸 잡아두면 우리가 원할 때 설치창을 띄울 수 있다. */
      window.addEventListener("beforeinstallprompt", function (e) {
        e.preventDefault();
        installPrompt = e;
        if (state.section === "home" || state.section === "settings") render();
      });

      window.addEventListener("appinstalled", function () {
        installPrompt = null;
        notify("설치했어요. 이제 홈 화면에서 바로 열 수 있어요.", "good");
        render();
      });

      function installGuideHTML(compact) {

        }
        var h = "";
        if (installPrompt) {
          h +=
            '<div class="hint">브라우저가 설치를 지원해요. 한 번 누르시면 끝나요.</div>' +
            '<div class="ptools"><button class="btn primary" id="do-install">앱 설치하기</button></div>';
          return h;
        }
        if (isIOS()) {
          h +=
            '<div class="steps"><div class="step"><i>1</i><div><b>공유 버튼</b>을 눌러주세요 <span class="ico">􀈂</span><br><span class="sub">사파리는 아래쪽, 크롬은 오른쪽 위에 있어요</span></div></div>' +
            '<div class="step"><i>2</i><div>목록을 내려 <b>“홈 화면에 추가”</b>를 눌러주세요</div></div>' +
            '<div class="step"><i>3</i><div>오른쪽 위 <b>추가</b>를 누르시면 끝이에요</div></div></div>' +
            '<div class="hint">사파리·크롬 모두 됩니다. 카카오톡이나 인스타 안에서 열었다면 이 메뉴가 없을 수 있어요 — 그때는 사파리나 크롬으로 열어주세요.</div>';
          return h;
        }
        h +=
          '<div class="steps"><div class="step"><i>1</i><div>주소창 오른쪽 <b>⋮ 메뉴</b>를 눌러주세요</div></div>' +
          '<div class="step"><i>2</i><div><b>“앱 설치”</b> 또는 <b>“홈 화면에 추가”</b>를 골라주세요</div></div>' +
          '<div class="step"><i>3</i><div><b>설치</b>를 누르시면 끝이에요</div></div></div>' +
          '<div class="hint">메뉴가 안 보이면 페이지를 한 번 새로고침해보세요.</div>';
        return h;

      /* ---------- 운동: 그날의 기록 ---------- */
      /* 탭은 "루틴" 인데 내용은 "그날 기록" 이라 두 개념이 섞여 있었다.
         이제 화면의 주인공은 날짜다. 루틴은 종목을 채워 넣는 도구로 물러난다. */

      /* ---------- 루틴 편집 ---------- */
      function renderRoutineEdit() {
        var day = allDays().filter(function (d) {
          return d.id === state.editRoutine;
        })[0];
        if (!day) {
          state.section = "home";
          return renderHome();
        }
        var h =
          '<div class="dayhead"><div class="num">ROUTINE</div><h2>' +
          Gym.esc(day.name) +
          "</h2><p>" +
          (day.tag ? Gym.esc(day.tag) + " · " : "") +
          "여기서 고친 구성은 다음에 불러올 때 반영돼요</p>" +
          routineToolsHTML(day) +
          "</div>";

        var added = custom[day.id] || [];
        /* hidden·override 항목은 별도 표시하지 않는다 */
        var hiddenIds = {};
        var overrideIds = {};
        added.forEach(function (e) {
          if (e._hidden) hiddenIds[e.id] = 1;
          if (e.override) overrideIds[e.id] = 1;
        });
        var addedWarm = added.filter(function (e) { return e.grp === "warm" && !e._hidden && !e.override; });
        var addedMain = added.filter(function (e) { return e.grp !== "warm" && !e._hidden && !e.override; });
        var warmBase = day.freeform ? [] : WARM.filter(function (e) { return !hiddenIds[e.id]; });

        if (warmBase.length || addedWarm.length) {
          h += '<div class="grp warm"><div class="grp-label">WARM-UP</div>';
          warmBase.forEach(function (ex) { h += exRoutineRow(ex, day, false); });
          addedWarm.forEach(function (ex) { h += exRoutineRow(ex, day, true); });
          h += "</div>";
        }

        var customIds = {};
        addedMain.forEach(function (e) { customIds[e.id] = 1; });
        var mainBase = day.main.filter(function (e) { return !hiddenIds[e.id]; });
        h +=
          '<div class="grp main"><div class="grp-label">' +
          (day.freeform ? "종목" : "MAIN") +
          "</div>";
        var mainList = applyOrder(day.id, mainBase.concat(addedMain));
        mainList.forEach(function (ex) {
          h += exRoutineRow(ex, day, !!customIds[ex.id]);
        });
        if (!mainList.length) {
          h += '<div class="empty">아직 넣은 종목이 없어요.<br>아래에서 검색해서 추가해주세요.</div>';

          h += '<div class="grp circuit"><div class="grp-label">어깨 슈퍼세트</div>';
          circuitBase.forEach(function (ex) { h += exRoutineRow(ex, day, false); });
          h += "</div>";
        }

        h += addBoxHTML(day);
        return h;
