<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <meta name="color-scheme" content="light" />
    <meta name="theme-color" content="#EFEEEB" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="트레이닝" />
    <link rel="manifest" href="./manifest.json" />
    <link rel="icon" href="./icon-192.png" />
    <link rel="apple-touch-icon" href="./icon-192.png" />
    <title>트레이닝</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Black+Han+Sans&family=IBM+Plex+Sans+KR:wght@400;500;600;700&family=JetBrains+Mono:wght@400;700&display=swap"
      rel="stylesheet"
    />
    <style>
      :root {
        --paper: #efeeeb;
        --card: #ffffff;
        --ink: #16191e;
        --ink-2: #3d444e;
        --ink-3: #616973;
        --line: #d6d4cf;
        --accent: #b72b27;
        --purple: #7b3fa0;
        --safe-b: env(safe-area-inset-bottom, 0px);
      }
      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }
      html {
        -webkit-text-size-adjust: 100%;
        background: var(--paper);
      }
      body {
        background: var(--paper);
        color: var(--ink);
        font-family: "IBM Plex Sans KR", system-ui, sans-serif;
        line-height: 1.5;
        padding: 0 0 calc(150px + var(--safe-b));
      }
      input,
      button,
      select {
        font-family: inherit;
      }
      .wrap {
        max-width: 720px;
        margin: 0 auto;
        padding: 0 16px;
      }

      /* ---------- top bar ---------- */
      .top {
        position: sticky;
        top: 0;
        z-index: 40;
        background: var(--paper);
        border-bottom: 1px solid var(--line);
        padding-top: env(safe-area-inset-top, 0px);
      }
      .brand {
        display: flex;
        align-items: baseline;
        gap: 10px;
        padding: 14px 16px 8px;
        max-width: 720px;
        margin: 0 auto;
      }
      .brand h1 {
        font-family: "Black Han Sans", sans-serif;
        font-size: 20px;
        line-height: 1;
      }
      .brand .today {
        margin-left: auto;
        font-family: "JetBrains Mono", monospace;
        font-size: 12px;
        color: var(--ink-3);
      }
      .tabs {
        display: flex;
        gap: 6px;
        padding: 0 16px 10px;
        max-width: 720px;
        margin: 0 auto;
        overflow-x: auto;
        -webkit-overflow-scrolling: touch;
      }
      .tab {
        flex: none;
        padding: 8px 13px;
        border: 1px solid var(--line);
        background: var(--card);
        border-radius: 20px;
        font-family: "JetBrains Mono", monospace;
        font-size: 12px;
        font-weight: 700;
        color: var(--ink-3);
        cursor: pointer;
        white-space: nowrap;
      }
      .tab.on {
        background: var(--ink);
        color: #fff;
        border-color: var(--ink);
      }

      /* ---------- alert ---------- */
      .alert {
        display: none;
      }
      .alert.on {
        display: block;
        margin-top: 14px;
        padding: 11px 13px;
        border-radius: 6px;
        font-size: 13px;
        line-height: 1.55;
        cursor: pointer;
      }
      .alert.bad {
        background: #fbeae9;
        border: 1px solid #e0a9a6;
        color: #7a211e;
      }
      .alert.good {
        background: #e9f3ec;
        border: 1px solid #a6cdb4;
        color: #1c5537;
      }

      /* ---------- day ---------- */
      .dayhead {
        padding: 22px 0 6px;
      }
      .dayhead .num {
        font-family: "JetBrains Mono", monospace;
        font-weight: 700;
        font-size: 12px;
        letter-spacing: 0.1em;
        color: var(--accent);
      }
      .dayhead h2 {
        font-family: "Black Han Sans", sans-serif;
        font-size: 30px;
        line-height: 1.05;
        margin-top: 4px;
      }
      .dayhead p {
        font-size: 13px;
        color: var(--ink-3);
        margin-top: 4px;
      }

      .grp {
        margin-top: 14px;
      }
      .grp-label {
        font-family: "JetBrains Mono", monospace;
        font-weight: 700;
        font-size: 11px;
        letter-spacing: 0.12em;
        color: var(--ink-3);
        margin-bottom: 6px;
        padding-left: 2px;
      }
      .grp.warm .grp-label {
        color: var(--ink-3);
      }
      .grp.circuit .grp-label {
        color: var(--purple);
      }

      .card {
        background: var(--card);
        border: 1px solid var(--line);
        border-radius: 6px;
        margin-bottom: 8px;
        overflow: hidden;
      }
      .grp.circuit .card {
        border-left: 3px solid var(--purple);
      }
      .grp.warm .card {
        border-left: 3px solid var(--ink-3);
      }
      .grp.main .card {
        border-left: 3px solid var(--accent);
      }

      .row {
        display: grid;
        grid-template-columns: 1fr auto;
        gap: 2px 12px;
        padding: 13px 14px;
        cursor: pointer;
        -webkit-tap-highlight-color: transparent;
      }
      .row:focus-visible {
        outline: 2px solid var(--accent);
        outline-offset: -2px;
      }
      .nm {
        font-size: 16px;
        font-weight: 600;
        align-self: center;
      }
      .nm small {
        font-weight: 400;
        color: var(--ink-3);
        font-size: 12px;
      }
      .ld {
        font-family: "JetBrains Mono", monospace;
        font-weight: 700;
        font-size: 17px;
        text-align: right;
        align-self: center;
        white-space: nowrap;
      }
      .ld small {
        font-size: 11px;
        color: var(--ink-3);
        font-weight: 400;
      }
      .mt {
        font-family: "JetBrains Mono", monospace;
        font-size: 12px;
        color: var(--ink-2);
      }
      .rt {
        font-family: "JetBrains Mono", monospace;
        font-size: 11px;
        color: var(--ink-3);
        text-align: right;
      }
      .last {
        grid-column: 1/-1;
        margin-top: 6px;
        font-family: "JetBrains Mono", monospace;
        font-size: 11px;
        color: var(--ink-3);
        background: rgba(22, 25, 30, 0.04);
        padding: 4px 7px;
        border-radius: 3px;
      }
      .card.done .nm {
        text-decoration: line-through;
        text-decoration-thickness: 2px;
      }
      .card.done {
        opacity: 0.55;
      }

      /* plates */
      .plates {
        grid-column: 1/-1;
        display: flex;
        align-items: center;
        gap: 3px;
        margin-top: 8px;
        height: 32px;
      }
      .bar {
        width: 18px;
        height: 4px;
        background: #8d949c;
        border-radius: 2px;
        flex: none;
      }
      .collar {
        width: 5px;
        height: 13px;
        background: #6f767e;
        border-radius: 1px;
        flex: none;
      }
      .plate {
        width: 13px;
        border-radius: 2px;
        flex: none;
        display: flex;
        align-items: center;
        justify-content: center;
      }
      .plate b {
        font-family: "JetBrains Mono", monospace;
        font-size: 9px;
        font-weight: 700;
        color: #fff;
        transform: rotate(-90deg);
        white-space: nowrap;
      }
      .plate.lt b {
        color: #16191e;
      }
      .plabel {
        margin-left: 9px;
        font-family: "JetBrains Mono", monospace;
        font-size: 11px;
        color: var(--ink-3);
      }

      /* ---------- expanded panel ---------- */
      .panel {
        display: none;
        border-top: 1px solid var(--line);
        padding: 12px 14px 14px;
        background: rgba(22, 25, 30, 0.02);
      }
      .card.open .panel {
        display: block;
      }
      .setrow {
        display: grid;
        grid-template-columns: 34px 1fr 1fr 44px;
        gap: 8px;
        align-items: center;
        margin-bottom: 7px;
      }
      .setno {
        font-family: "JetBrains Mono", monospace;
        font-size: 12px;
        font-weight: 700;
        color: var(--ink-3);
      }
      .fld {
        position: relative;
      }
      .fld input {
        width: 100%;
        padding: 9px 26px 9px 9px;
        border: 1px solid var(--line);
        border-radius: 5px;
        background: var(--card);
        font-family: "JetBrains Mono", monospace;
        font-size: 15px;
        font-weight: 700;
        color: var(--ink);
        text-align: right;
      }
      .fld input:focus {
        outline: none;
        border-color: var(--accent);
      }
      .fld span {
        position: absolute;
        right: 8px;
        top: 50%;
        transform: translateY(-50%);
        font-family: "JetBrains Mono", monospace;
        font-size: 11px;
        color: var(--ink-3);
        pointer-events: none;
      }
      .chk {
        width: 44px;
        height: 38px;
        border: 1px solid var(--line);
        border-radius: 5px;
        background: var(--card);
        font-size: 16px;
        color: var(--ink-3);
        cursor: pointer;
        line-height: 1;
      }
      .chk.on {
        background: var(--accent);
        border-color: var(--accent);
        color: #fff;
      }
      .ptools {
        display: flex;
        gap: 7px;
        margin-top: 11px;
        flex-wrap: wrap;
      }
      .btn {
        padding: 8px 12px;
        border: 1px solid var(--line);
        border-radius: 5px;
        background: var(--card);
        font-family: "JetBrains Mono", monospace;
        font-size: 12px;
        color: var(--ink-2);
        cursor: pointer;
      }
      .btn:hover {
        border-color: var(--ink-3);
        color: var(--ink);
      }
      .btn:focus-visible {
        outline: 2px solid var(--accent);
        outline-offset: 2px;
      }
      .btn.warnbtn {
        color: #b72b27;
      }
      .alts {
        margin-top: 11px;
        padding-top: 10px;
        border-top: 1px dashed var(--line);
      }
      .alts .t {
        font-family: "JetBrains Mono", monospace;
        font-size: 11px;
        font-weight: 700;
        color: var(--ink-3);
        margin-bottom: 5px;
      }
      .alts li {
        font-size: 13px;
        color: var(--ink-2);
        list-style: none;
        padding: 3px 0;
      }
      .alts li b {
        font-family: "JetBrains Mono", monospace;
        color: var(--ink);
        font-weight: 700;
      }
      .hint {
        font-size: 12px;
        color: var(--ink-3);
        margin-top: 9px;
      }

      /* ---------- add exercise / data box ---------- */
      .addbox {
        background: var(--card);
        border: 1px dashed var(--line);
        border-radius: 6px;
        padding: 14px;
        margin-top: 10px;
      }
      .addbox h4 {
        font-family: "JetBrains Mono", monospace;
        font-size: 12px;
        font-weight: 700;
        color: var(--ink-3);
        margin-bottom: 9px;
      }
      .addgrid {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 8px;
      }
      .addgrid input {
        padding: 9px;
        border: 1px solid var(--line);
        border-radius: 5px;
        background: var(--paper);
        font-size: 14px;
        color: var(--ink);
        width: 100%;
      }
      .addgrid input:focus {
        outline: none;
        border-color: var(--accent);
      }
      .addgrid .full {
        grid-column: 1/-1;
      }

      /* ---------- history ---------- */
      .hsel {
        width: 100%;
        padding: 11px;
        border: 1px solid var(--line);
        border-radius: 6px;
        background: var(--card);
        font-size: 15px;
        color: var(--ink);
        margin: 14px 0;
      }
      .chart {
        background: var(--card);
        border: 1px solid var(--line);
        border-radius: 6px;
        padding: 14px 8px 8px;
      }
      .hlist {
        margin-top: 14px;
      }
      .hitem {
        background: var(--card);
        border: 1px solid var(--line);
        border-radius: 6px;
        padding: 11px 13px;
        margin-bottom: 7px;
        display: flex;
        gap: 12px;
        align-items: baseline;
      }
      .hitem .d {
        font-family: "JetBrains Mono", monospace;
        font-size: 12px;
        color: var(--ink-3);
        flex: none;
      }
      .hitem .s {
        font-family: "JetBrains Mono", monospace;
        font-size: 13px;
        color: var(--ink);
        font-weight: 700;
      }
      .empty {
        text-align: center;
        color: var(--ink-3);
        font-size: 14px;
        padding: 40px 20px;
        line-height: 1.7;
      }

      /* ---------- date bar ---------- */
      .datebar {
        display: flex;
        align-items: center;
        gap: 6px;
        margin-top: 14px;
        padding: 8px;
        border: 1px solid var(--line);
        border-radius: 6px;
        background: var(--card);
      }
      .datebar.past {
        background: #fdf3e7;
        border-color: #e8c89a;
      }
      .dnav {
        width: 34px;
        height: 34px;
        flex: none;
        border: 1px solid var(--line);
        border-radius: 5px;
        background: var(--paper);
        font-family: "JetBrains Mono", monospace;
        font-size: 14px;
        color: var(--ink-2);
        cursor: pointer;
      }
      .dnav:disabled {
        opacity: 0.3;
        cursor: default;
      }
      .dnav:not(:disabled):hover {
        border-color: var(--ink-3);
        color: var(--ink);
      }
      .dnav:focus-visible,
      .datefld:focus-visible {
        outline: 2px solid var(--accent);
        outline-offset: 1px;
      }
      .datefld {
        flex: 1;
        min-width: 0;
        padding: 8px;
        border: 1px solid var(--line);
        border-radius: 5px;
        background: var(--paper);
        font-family: "JetBrains Mono", monospace;
        font-size: 14px;
        font-weight: 700;
        color: var(--ink);
        text-align: center;
      }
      .datenote {
        display: flex;
        align-items: center;
        gap: 9px;
        margin-top: 7px;
        padding: 8px 11px;
        border-radius: 5px;
        background: #fdf3e7;
        border: 1px solid #e8c89a;
        font-size: 13px;
        color: #6b4a16;
      }
      .datenote b {
        flex: 1;
      }

      /* ---------- calendar ---------- */
      .calhead {
        display: flex;
        align-items: center;
        gap: 10px;
        padding: 20px 0 4px;
      }
      .calhead h2 {
        font-family: "Black Han Sans", sans-serif;
        font-size: 24px;
        line-height: 1;
        flex: 1;
      }
      .calnav {
        width: 38px;
        height: 38px;
        border: 1px solid var(--line);
        border-radius: 5px;
        background: var(--card);
        font-family: "JetBrains Mono", monospace;
        font-size: 15px;
        color: var(--ink-2);
        cursor: pointer;
        flex: none;
      }
      .calnav:hover {
        border-color: var(--ink-3);
        color: var(--ink);
      }
      .calnav:focus-visible {
        outline: 2px solid var(--accent);
        outline-offset: 2px;
      }
      .calstat {
        display: flex;
        gap: 18px;
        padding: 2px 2px 12px;
        font-family: "JetBrains Mono", monospace;
        font-size: 11px;
        color: var(--ink-3);
      }
      .calstat b {
        color: var(--ink);
        font-size: 14px;
        font-weight: 700;
      }
      .calgrid {
        background: var(--card);
        border: 1px solid var(--line);
        border-radius: 6px;
        padding: 10px 8px 8px;
      }
      .caldow,
      .calweek {
        display: grid;
        grid-template-columns: repeat(7, 1fr);
        gap: 3px;
      }
      .caldow span {
        text-align: center;
        font-family: "JetBrains Mono", monospace;
        font-size: 10px;
        font-weight: 700;
        color: var(--ink-3);
        padding-bottom: 6px;
      }
      .caldow span:first-child {
        color: var(--accent);
      }
      .calcell {
        aspect-ratio: 1;
        /* 폰에서는 정사각형, 넓은 화면에서는 지나치게 커지지 않게 */
        max-height: 54px;
        border: 1px solid transparent;
        border-radius: 5px;
        background: transparent;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 3px;
        font-family: "JetBrains Mono", monospace;
        font-size: 13px;
        color: var(--ink-2);
        cursor: default;
        padding: 0;
        -webkit-tap-highlight-color: transparent;
      }
      .calcell.pad {
        visibility: hidden;
      }
      .calcell.has {
        cursor: pointer;
        color: var(--ink);
        font-weight: 700;
      }
      .calcell.lv1 {
        background: rgba(34, 117, 74, 0.13);
      }
      .calcell.lv2 {
        background: rgba(34, 117, 74, 0.28);
      }
      .calcell.lv3 {
        background: rgba(34, 117, 74, 0.45);
      }
      .calcell.today {
        border-color: var(--accent);
      }
      .calcell.sel {
        background: var(--ink);
        color: #fff;
      }
      .calcell:focus-visible {
        outline: 2px solid var(--accent);
        outline-offset: 1px;
      }
      .calcell i {
        width: 4px;
        height: 4px;
        border-radius: 50%;
        background: #22754a;
        font-style: normal;
      }
      .calcell.sel i {
        background: #fff;
      }
      .calday {
        margin-top: 14px;
      }
      .caldayhead {
        display: flex;
        align-items: baseline;
        gap: 10px;
        margin-bottom: 8px;
      }
      .caldayhead h3 {
        font-family: "JetBrains Mono", monospace;
        font-size: 15px;
        font-weight: 700;
      }
      .caldayhead span {
        font-family: "JetBrains Mono", monospace;
        font-size: 11px;
        color: var(--ink-3);
      }
      .calex {
        background: var(--card);
        border: 1px solid var(--line);
        border-left: 3px solid var(--accent);
        border-radius: 6px;
        padding: 10px 13px;
        margin-bottom: 6px;
      }
      .calex .n {
        font-size: 14px;
        font-weight: 600;
        margin-bottom: 3px;
      }
      .calex .s {
        font-family: "JetBrains Mono", monospace;
        font-size: 12px;
        color: var(--ink-2);
      }
      .calex .v {
        font-family: "JetBrains Mono", monospace;
        font-size: 10px;
        color: var(--ink-3);
        margin-top: 3px;
      }

      /* ---------- exercise picker ---------- */
      .cats {
        display: flex;
        gap: 5px;
        overflow-x: auto;
        -webkit-overflow-scrolling: touch;
        padding-bottom: 9px;
        margin-bottom: 2px;
      }
      .cat {
        flex: none;
        padding: 6px 11px;
        border: 1px solid var(--line);
        border-radius: 16px;
        background: var(--paper);
        font-size: 12px;
        font-weight: 600;
        color: var(--ink-3);
        cursor: pointer;
        white-space: nowrap;
      }
      .cat.on {
        color: #fff;
        border-color: transparent;
      }
      .cat:focus-visible {
        outline: 2px solid var(--accent);
        outline-offset: 2px;
      }
      .cats::-webkit-scrollbar {
        display: none;
      }
      .cats {
        scrollbar-width: none;
      }
      .searchfld {
        width: 100%;
        padding: 10px 11px;
        border: 1px solid var(--line);
        border-radius: 5px;
        background: var(--paper);
        font-size: 15px;
        color: var(--ink);
      }
      .searchfld:focus {
        outline: none;
        border-color: var(--accent);
      }
      .suglist {
        list-style: none;
        margin: 7px 0 0;
        max-height: 232px;
        overflow-y: auto;
        border: 1px solid var(--line);
        border-radius: 6px;
        background: var(--paper);
      }
      .suglist:empty {
        display: none;
      }
      .sug {
        display: flex;
        align-items: center;
        gap: 9px;
        width: 100%;
        padding: 9px 11px;
        border: 0;
        border-bottom: 1px solid var(--line);
        background: transparent;
        text-align: left;
        cursor: pointer;
        font-size: 14px;
        color: var(--ink);
      }
      .sug:last-child {
        border-bottom: 0;
      }
      .sug:hover,
      .sug:focus-visible {
        background: rgba(22, 25, 30, 0.05);
        outline: none;
      }
      .sug .tag {
        flex: none;
        font-family: "JetBrains Mono", monospace;
        font-size: 10px;
        font-weight: 700;
        color: #fff;
        padding: 2px 6px;
        border-radius: 3px;
      }
      .sug .nm2 {
        flex: 1;
        font-weight: 600;
      }
      .sug .meta {
        flex: none;
        font-family: "JetBrains Mono", monospace;
        font-size: 10px;
        color: var(--ink-3);
      }
      .sugnone {
        padding: 11px;
        font-size: 13px;
        color: var(--ink-3);
        text-align: center;
      }
      .picked {
        display: flex;
        align-items: center;
        gap: 8px;
        margin-top: 8px;
        padding: 8px 11px;
        border-radius: 5px;
        background: rgba(34, 117, 74, 0.1);
        border: 1px solid rgba(34, 117, 74, 0.3);
        font-size: 13px;
        color: #1c5537;
      }
      .picked b {
        flex: 1;
      }

      /* ---------- rest timer ---------- */
      .timer {
        position: fixed;
        left: 0;
        right: 0;
        bottom: 0;
        z-index: 60;
        background: var(--ink);

          localStorage.removeItem("__t");

          ok = false;

        return {
          ok: ok,
          get: function (k, d) {
            try {

            } catch (e) {

      /* ============ log write path ============ */
      /* 읽기는 Gym.entryFor / Gym.viewSets 로. 여기는 실제로 값을 쓸 때만 부른다. */
      function ensureEntry(exId, date, nSets) {
        if (!logs[exId]) logs[exId] = [];
        var e = Gym.entryFor(logs, exId, date);
        if (!e) {
          e = { date: date, sets: [] };
          logs[exId].push(e);
          logs[exId].sort(function (a, b) {
            return a.date < b.date ? -1 : a.date > b.date ? 1 : 0;
          });
        }
        while (e.sets.length < nSets) e.sets.push(Gym.blankSet());
        return e;
      }

      /* ============ rest timer ============ */
      var Timer = (function () {
        var endAt = 0,
          iv = null,
          hideTo = null,
          lock = null,
          label = "휴식";
        var el = document.getElementById("timer"),
          val = document.getElementById("tval"),
          lbl = document.getElementById("tlbl");
        var actx = null;

        function remainMs() {
          return endAt - Date.now();
        }
        function remain() {
          return Math.max(0, Math.ceil(remainMs() / 1000));
        }
        function fmt(s) {
          var m = Math.floor(s / 60),
            r = s % 60;
          return m + ":" + (r < 10 ? "0" : "") + r;
        }
        function paint() {
          val.textContent = fmt(remain());
        }

        /* AudioContext 는 사용자 제스처 안에서 만들어 둬야 iOS 가 나중 재생을 막지 않는다. */
        function audio() {
          if (actx) {
            if (actx.state === "suspended") actx.resume().catch(function () {});
            return actx;
          }
          try {
            var C = window.AudioContext || window.webkitAudioContext;
            if (!C) return null;
            actx = new C();
          } catch (e) {
            return null;
          }
          return actx;
        }

        function beep() {
          var ctx = audio();
          if (!ctx) return;
          try {
            var o = ctx.createOscillator(),
              g = ctx.createGain();
            o.connect(g);
            g.connect(ctx.destination);
            o.frequency.value = 880;
            o.type = "sine";
            g.gain.setValueAtTime(0.0001, ctx.currentTime);
            g.gain.exponentialRampToValueAtTime(0.25, ctx.currentTime + 0.02);
            g.gain.exponentialRampToValueAtTime(0.0001, ctx.currentTime + 0.6);
            o.start();
            o.stop(ctx.currentTime + 0.62);
          } catch (e) {}
        }

        function releaseWake() {
          if (!lock) return;
          try {
            lock.release().catch(function () {});
          } catch (e) {}
          lock = null;
        }
        function requestWake() {
          if (!navigator.wakeLock || lock || !iv) return;
          try {
            navigator.wakeLock
              .request("screen")
              .then(function (l) {
                if (iv) lock = l;
                else {
                  try {
                    l.release();
                  } catch (e) {}
                }
              })
              .catch(function () {});
          } catch (e) {}
        }

        function clearHide() {
          if (hideTo) {
            clearTimeout(hideTo);
            hideTo = null;
          }
        }

        function finish() {
          if (iv) {
            clearInterval(iv);
            iv = null;
          }
          paint();
          el.classList.add("done");
          lbl.textContent = "다음 세트 준비";
          beep();
          if (navigator.vibrate) {
            try {
              navigator.vibrate([200, 100, 200]);
            } catch (e) {}
          }
          releaseWake();
          clearHide();
          hideTo = setTimeout(function () {
            hideTo = null;
            el.classList.remove("on", "done");
          }, TIMER_HIDE_MS);
        }

        function tick() {
          paint();
          if (remainMs() <= 0) finish();
        }

        function run() {
          if (iv) clearInterval(iv);
          iv = setInterval(tick, TIMER_TICK_MS);
          requestWake();
        }

        /* 남은 초를 빼는 대신 종료 시각을 잡아둔다.
     그래야 화면이 꺼져 틱이 누락돼도 복귀했을 때 값이 맞다. */
        function start(sec, text) {
          if (!sec) return;
          audio();
          clearHide();
          endAt = Date.now() + sec * 1000;
          label = text || "휴식";
          lbl.textContent = label;
          el.classList.add("on");
          el.classList.remove("done");
          paint();
          run();
        }

        function stop() {
          if (iv) {
            clearInterval(iv);
            iv = null;
          }
          clearHide();
          endAt = 0;
          el.classList.remove("on", "done");
          releaseWake();
        }

        function extend() {
          clearHide();
          endAt = (iv ? endAt : Date.now()) + ADD_SECONDS * 1000;
          lbl.textContent = label;
          el.classList.add("on");
          el.classList.remove("done");
          paint();
          if (!iv) run();
        }

        document.getElementById("t30").addEventListener("click", extend);
        document.getElementById("tskip").addEventListener("click", stop);

        /* 화면 잠금 중에는 OS 가 wake lock 을 회수한다. 돌아오면 다시 잡고 값도 맞춘다. */
        document.addEventListener("visibilitychange", function () {
          if (document.visibilityState !== "visible" || !iv) return;
          tick();
          requestWake();
        });

        return { start: start, stop: stop };

          });
        });
        var seen = {},
          uniq = [];
        out.forEach(function (e) {
          if (!seen[e.id]) {
            seen[e.id] = 1;
            uniq.push(e);
          }
        });
        return uniq;
      }

      function findExercise(id) {
        var all = allExercises();
        for (var i = 0; i < all.length; i++)
          if (all[i].id === id) return all[i];
        return null;
      }

      /* 캘린더는 지금 루틴에 없는 종목(예전에 지운 것, 들여온 것)도 보여줘야 한다.
         루틴 → 카탈로그 → 그래도 없으면 id 순으로 이름을 찾는다. */
      function exerciseName(id) {
        var inRoutine = findExercise(id);
        if (inRoutine) return inRoutine.name;
        var inCatalog = GymExercises.BY_ID[id];
        if (inCatalog) return inCatalog.name;
        return id;
      }

      /* 기본 루틴 종목은 카탈로그와 id 가 다르다. 이름이 같으면 같은 부위로 본다. */
      var CATALOG_CAT_BY_NAME = (function () {
        var map = {};
        GymExercises.ALL.forEach(function (e) {
          map[e.name] = e.cat;
        });
        return map;
      })();

      function exerciseCategory(id) {
        var inCatalog = GymExercises.BY_ID[id];
        if (inCatalog) return inCatalog.cat;
        var ex = findExercise(id);
        if (!ex) return null;
        if (ex.cat) return ex.cat;
        return CATALOG_CAT_BY_NAME[ex.name] || null;
      }

      function categoryColor(catId) {
        var cats = GymExercises.CATEGORIES;
        for (var i = 0; i < cats.length; i++)
          if (cats[i].id === catId) return cats[i].color;
        return "#616973";
      }

      function renderTabs() {
        var h = "";
        DAYS.forEach(function (d) {
          h +=
            '<button class="tab' +
            (state.tab === d.id ? " on" : "") +
            '" data-tab="' +
            Gym.esc(d.id) +
            '">' +
            Gym.esc(
              d.num.indexOf("DAY ") === 0
                ? d.num.replace("DAY ", "D") + " " + d.name
                : d.name,
            ) +
            "</button>";
        });
        h +=
          '<button class="tab' +
          (state.tab === "cal" ? " on" : "") +
          '" data-tab="cal">캘린더</button>';
        h +=
          '<button class="tab' +
          (state.tab === "hist" ? " on" : "") +
          '" data-tab="hist">기록 · 그래프</button>';
        document.getElementById("tabs").innerHTML = h;
      }

      function exCard(ex, day, isCustom) {
        var date = recordDate();
        var stored = Gym.entryFor(logs, ex.id, date);
        var sets = Gym.viewSets(stored, ex.sets);
        var allDone =
          sets.length > 0 &&
          sets.every(function (s) {
            return s.done;
          });
        var open = !!state.open[ex.id];
        var prev = Gym.formatPrev(Gym.prevEntry(logs, ex.id, date));

        var h =
          '<div class="card' +
          (allDone ? " done" : "") +
          (open ? " open" : "") +
          '" data-ex="' +
          Gym.esc(ex.id) +
          '">';
        h +=
          '<div class="row" data-toggle="' +
          Gym.esc(ex.id) +
          '" role="button" tabindex="0" aria-expanded="' +
          (open ? "true" : "false") +
          '">';
        h +=
          '<div class="nm">' +
          Gym.esc(ex.name) +
          (ex.sub ? " <small>(" + Gym.esc(ex.sub) + ")</small>" : "") +
          "</div>";
        h +=
          '<div class="ld">' +
          (ex.load
            ? ex.load + "<small>" + Gym.esc(ex.unit) + "</small>"
            : Gym.esc(ex.unit)) +
          "</div>";
        h +=
          '<div class="mt">' +
          ex.sets +
          "세트 × " +
          Gym.esc(ex.reps) +
          "</div>";
        h +=
          '<div class="rt">' +
          (ex.rest
            ? "휴식 " + (ex.rest >= 60 ? ex.rest / 60 + "분" : ex.rest + "초")
            : "연속") +
          "</div>";
        if (ex.plates && ex.load) h += Gym.platesHTML(ex.load);
        if (prev)
          h += '<div class="last">지난 기록 · ' + Gym.esc(prev) + "</div>";
        h += "</div>";

        h += '<div class="panel">';
        for (var i = 0; i < ex.sets; i++) {
          var s = sets[i];
          var no = i + 1;
          h +=
            '<div class="setrow">' +
            '<div class="setno">' +
            no +
            "세트</div>" +
            '<div class="fld"><input type="number" inputmode="decimal" step="0.5" min="0" max="' +
            MAX_LOAD +
            '" ' +
            'aria-label="' +
            no +
            '세트 중량 kg" placeholder="' +
            (ex.load || "") +
            '" ' +
            'value="' +
            (s.w == null ? "" : s.w) +
            '" data-w="' +
            Gym.esc(ex.id) +
            '" data-i="' +
            i +
            '"><span>kg</span></div>' +
            '<div class="fld"><input type="number" inputmode="numeric" min="0" max="9999" ' +
            'aria-label="' +
            no +
            '세트 반복수" placeholder="회" ' +
            'value="' +
            (s.r == null ? "" : s.r) +
            '" data-r="' +
            Gym.esc(ex.id) +
            '" data-i="' +
            i +
            '"><span>회</span></div>' +
            '<button class="chk' +
            (s.done ? " on" : "") +
            '" aria-label="' +
            no +
            '세트 완료" aria-pressed="' +
            (s.done ? "true" : "false") +
            '" ' +
            'data-done="' +
            Gym.esc(ex.id) +
            '" data-i="' +
            i +
            '">✓</button>' +
            "</div>";
        }
        h += '<div class="ptools">';
        h +=
          '<button class="btn" data-fill="' +
          Gym.esc(ex.id) +
          '">지난 기록 불러오기</button>';
        h +=
          '<button class="btn" data-form="' +
          Gym.esc(ex.name) +
          '">폼 영상 보기</button>';
        if (ex.rest)
          h +=
            '<button class="btn" data-rest="' +
            ex.rest +
            '">휴식 ' +
            ex.rest +
            "초 시작</button>";
        if (isCustom)
          h +=
            '<button class="btn warnbtn" data-del="' +
            Gym.esc(ex.id) +
            '" data-day="' +
            Gym.esc(day.id) +
            '">삭제</button>';
        h += "</div>";
        if (ex.note) h += '<div class="hint">' + Gym.esc(ex.note) + "</div>";
        if (ex.alts) {
          h +=
            '<div class="alts"><div class="t">자리 없을 때 대체 · 하나만 선택</div><ul>';
          ex.alts.forEach(function (a) {
            h += "<li>" + a + "</li>";
          });
          h += "</ul></div>";
        }
        h += "</div></div>";
        return h;
      }

      function dataBoxHTML() {
        return (
          '<div class="addbox"><h4>데이터 백업</h4>' +
          '<div class="ptools">' +
          '<button class="btn" id="d-export">내보내기 (JSON)</button>' +
          '<button class="btn" id="d-import">불러오기</button>' +
          '<button class="btn warnbtn" id="d-reset">전체 삭제</button>' +
          "</div>" +
          '<div class="hint">기록은 이 브라우저에만 있어. 가끔 내보내서 따로 보관해줘.<br>' +
          "불러오기는 덮어쓰지 않고 <b>합친다</b> — 같은 날짜·같은 종목만 파일 쪽 값으로 바뀐다.</div>" +
          "</div>"
        );
      }

      /* ---------- 종목 추가 (부위 필터 + 자동완성) ---------- */
      var SUGGEST_LIMIT = 12;

      function catChipsHTML() {
        var h = '<div class="cats" id="a-cats" role="group" aria-label="부위 선택">';
        h +=
          '<button class="cat' +
          (state.cat === null ? " on" : "") +
          '" data-cat="" style="' +
          (state.cat === null ? "background:#16191E" : "") +
          '">전체</button>';
        GymExercises.CATEGORIES.forEach(function (c) {
          var on = state.cat === c.id;
          h +=
            '<button class="cat' +
            (on ? " on" : "") +
            '" data-cat="' +
            Gym.esc(c.id) +
            '" style="' +
            (on ? "background:" + c.color : "") +
            '">' +
            Gym.esc(c.name) +
            "</button>";
        });
        h += "</div>";
        return h;
      }

      function suggestionsHTML() {
        if (state.pick) return "";
        var hits = Gym.searchExercises(
          GymExercises.ALL,
          state.q,
          state.cat,
          SUGGEST_LIMIT,
        );
        if (!hits.length) {
          return (
            '<li class="sugnone">찾는 종목이 없어.<br>' +
            "그대로 <b>추가하기</b>를 누르면 직접 입력한 이름으로 등록돼.</li>"
          );
        }
        return hits
          .map(function (e) {
            return (
              '<li><button type="button" class="sug" data-pick="' +
              Gym.esc(e.id) +
              '">' +
              '<span class="tag" style="background:' +
              categoryColor(e.cat) +
              '">' +
              Gym.esc(GymExercises.categoryName(e.cat)) +
              "</span>" +
              '<span class="nm2">' +
              Gym.esc(e.name) +
              "</span>" +
              '<span class="meta">' +
              e.sets +
              "×" +
              Gym.esc(e.reps) +
              "</span>" +
              "</button></li>"
            );
          })
          .join("");
      }

      function pickedHTML() {
        if (!state.pick) return "";
        return (
          '<div class="picked"><b>' +
          Gym.esc(state.pick.name) +
          " · " +
          Gym.esc(GymExercises.categoryName(state.pick.cat)) +
          "</b>" +
          '<button class="btn" id="a-clear" type="button">다시 고르기</button></div>'
        );
      }

      function addBoxHTML(day) {
        var p = state.pick;
        return (
          '<div class="addbox"><h4>이 날에 종목 추가</h4>' +
          catChipsHTML() +
          '<input class="searchfld" id="a-name" maxlength="' +
          MAX_NAME +
          '" autocomplete="off" placeholder="종목 검색 (예: 벤치, ㅂㅊ, bench)" ' +
          'aria-label="종목 검색" value="' +
          Gym.esc(state.q) +
          '">' +
          '<ul class="suglist" id="a-sug">' +
          suggestionsHTML() +
          "</ul>" +
          '<div id="a-picked">' +
          pickedHTML() +
          "</div>" +
          '<div class="addgrid" style="margin-top:9px">' +
          '<input id="a-load" type="number" step="0.5" min="0" max="' +
          MAX_LOAD +
          '" aria-label="중량 kg" placeholder="중량 kg" value="' +
          (p && p.load ? p.load : "") +
          '">' +
          '<input id="a-sets" type="number" min="1" max="' +
          MAX_SETS +
          '" aria-label="세트 수" placeholder="세트 수" value="' +
          (p ? p.sets : "") +
          '">' +
          '<input id="a-reps" maxlength="' +
          MAX_REPS +
          '" aria-label="반복" placeholder="반복 (예: 10-12회)" value="' +
          (p ? Gym.esc(p.reps) : "") +
          '">' +
          '<input id="a-rest" type="number" min="0" max="' +
          MAX_REST +
          '" aria-label="휴식 초" placeholder="휴식 초" value="' +
          (p ? p.rest : "") +
          '">' +
          '</div><div class="ptools"><button class="btn" id="a-go" data-day="' +
          Gym.esc(day.id) +
          '">추가하기</button></div></div>'
        );
      }

      /* ---------- 기록 날짜 선택 ---------- */
      function dateBarHTML() {
        var d = recordDate();
        var today = Gym.todayKey();
        var offset = Gym.dayDiff(d, today); // 0 = 오늘, 양수 = 며칠 전
        var isToday = offset === 0;

        var h =
          '<div class="datebar' +
          (isToday ? "" : " past") +
          '">' +
          '<button class="dnav" data-date="-1" aria-label="하루 전">‹</button>' +
          '<input type="date" class="datefld" id="logdate" aria-label="기록할 날짜" value="' +
          Gym.esc(d) +
          '" max="' +
          Gym.esc(today) +
          '">' +
          '<button class="dnav" data-date="1" aria-label="하루 뒤"' +
          (isToday ? " disabled" : "") +
          ">›</button>" +
          "</div>";

        if (!isToday) {
          h +=
            '<div class="datenote"><b>' +
            Gym.esc(Gym.shortDate(d)) +
            "(" +
            Gym.esc(Gym.weekday(d)) +
            ") · " +
            offset +
            "일 전에 기록 중</b>" +
            '<button class="btn" id="date-today">오늘로</button></div>';
        }
        return h;
      }

      function renderDay(day) {
        document.documentElement.style.setProperty("--accent", day.accent);
        var h =
          '<div class="dayhead"><div class="num">' +
          Gym.esc(day.num) +
          "</div><h2>" +
          Gym.esc(day.name) +
          "</h2><p>" +
          Gym.esc(day.tag) +
          "</p></div>";

        h += dateBarHTML();

        if (!day.freeform) {
          h += '<div class="grp warm"><div class="grp-label">WARM-UP</div>';
          WARM.forEach(function (ex) {
            h += exCard(ex, day, false);
          });
          h += "</div>";
        }

        var added = custom[day.id] || [];
        h +=
          '<div class="grp main"><div class="grp-label">' +
          (day.freeform ? "오늘 한 것" : "MAIN") +
          "</div>";
        day.main.forEach(function (ex) {
          h += exCard(ex, day, false);
        });
        added.forEach(function (ex) {
          h += exCard(ex, day, true);
        });
        if (!day.main.length && !added.length) {
          h +=
            '<div class="empty">아직 넣은 종목이 없어.<br>아래에서 검색해서 추가해.</div>';
        }
        h += "</div>";

        if (!day.freeform) {
          h +=
            '<div class="grp circuit"><div class="grp-label">어깨 슈퍼세트 · 3-4라운드 · 라운드 사이 60초</div>';
          CIRCUIT.forEach(function (ex) {
            h += exCard(ex, day, false);
          });
          h += "</div>";
        }

        h += addBoxHTML(day);

        h +=
          '<div class="foot"><h3>중량 올리는 기준</h3>' +
          '<div class="rule"><i>01</i><div><b>목표 반복수 상단을 전 세트에서 채우면 올린다.</b> 벤치·스쿼트·데드는 2.5kg, 덤벨은 한 단계 위로.</div></div>' +
          '<div class="rule"><i>02</i><div><b>어깨 서킷은 15회가 쉬워지면 20회 → 6kg 15회</b> 순으로 굴려.</div></div>' +
          '<div class="rule"><i>03</i><div><b>단백질 하루 135-165g.</b> 감량은 주당 0.5kg 내외로 완만하게.</div></div>' +
          '<div class="rule"><i>04</i><div><b>큰 종목의 2-3분 휴식은 줄이지 마.</b> 회복 덜 되면 반복수가 떨어져 총볼륨이 줄어.</div></div>' +
          '<div class="rule"><i>05</i><div><b>기계 종목은 표시 중량을 믿지 마.</b> 12회에 2개 남는 지점을 직접 찾아.</div></div>' +
          '<div class="rule"><i>06</i><div><b>어깨 앞·위쪽이 시큰하면 그날 서킷은 건너뛰어.</b> 근육통과 관절 통증은 달라.</div></div>' +
          "</div>";

        if (!Store.ok) {
          h +=
            '<div class="warn">지금은 미리보기 환경이라 기록이 저장되지 않아. 직접 호스팅하면 정상 저장돼.</div>';
        }
        return h;
      }

      /* ---------- 캘린더 ---------- */
      var DOW = ["일", "월", "화", "수", "목", "금", "토"];
      var VOLUME_LEVELS = [0.34, 0.67]; // 그 달 최대 볼륨 대비 색 농도 구간

      function volumeLevel(volume, max) {
        if (!max || !volume) return 1;
        var ratio = volume / max;
        if (ratio <= VOLUME_LEVELS[0]) return 1;
        if (ratio <= VOLUME_LEVELS[1]) return 2;
        return 3;
      }

      function calCellHTML(key, cal, monthMax) {
        if (!key) return '<div class="calcell pad"></div>';
        var day = cal[key];
        var num = +key.slice(8);
        var cls = "calcell";
        if (key === today()) cls += " today";
        if (key === state.calDay) cls += " sel";
        if (day) cls += " has lv" + volumeLevel(day.volume, monthMax);

        if (!day) {
          return '<div class="' + cls + '">' + num + "</div>";
        }
        return (
          '<button class="' +
          cls +
          '" data-calday="' +
          Gym.esc(key) +
          '" aria-label="' +
          Gym.esc(Gym.shortDate(key)) +
          " " +
          day.count +
          '종목">' +
          num +
          "<i></i></button>"
        );
      }

      function calDayDetailHTML(cal) {
        if (!state.calDay) {
          return '<div class="empty">날짜를 누르면 그날 한 운동이 나와.</div>';
        }
        var day = cal[state.calDay];
        if (!day) {
          return (
            '<div class="empty">' +
            Gym.esc(Gym.shortDate(state.calDay)) +
            " 에는 기록이 없어.</div>"
          );
        }

        var h = '<div class="calday">' +
          '<div class="ptools" style="margin:0 0 10px">' +
          '<button class="btn" data-jump="' +
          Gym.esc(state.calDay) +
          '">이 날짜에 기록하기</button></div>' +
          '<div class="caldayhead"><h3>' +
          Gym.esc(Gym.shortDate(state.calDay)) +
          "</h3><span>" +
          day.count +
          "종목 · " +
          day.sets +
          "세트" +
          (day.volume ? " · 볼륨 " + Gym.formatNumber(day.volume) + "kg" : "") +
          "</span></div>";

        var ordered = day.exercises.slice().sort(function (a, b) {
          return b.volume - a.volume;
        });
        ordered.forEach(function (item) {
          var color = categoryColor(exerciseCategory(item.id));
          h +=
            '<div class="calex" style="border-left-color:' +
            color +
            '">' +
            '<div class="n">' +
            Gym.esc(exerciseName(item.id)) +
            "</div>" +
            '<div class="s">' +
            Gym.esc(Gym.formatSetLine(item.sets)) +
            "</div>" +
            (item.volume
              ? '<div class="v">볼륨 ' +
                Gym.formatNumber(item.volume) +
                "kg" +
                (item.top != null ? " · 최고 " + item.top + "kg" : "") +
                "</div>"
              : "") +
            "</div>";
        });
        h += "</div>";
        return h;
      }

      function renderCalendar() {
        document.documentElement.style.setProperty("--accent", "#22754A");
        var cal = Gym.buildCalendar(logs);
        var stats = Gym.monthStats(cal, state.calYear, state.calMonth);
        var weeks = Gym.monthMatrix(state.calYear, state.calMonth);

        var monthMax = 0;
        var prefix =
          state.calYear + "-" + (state.calMonth + 1 < 10 ? "0" : "") + (state.calMonth + 1) + "-";
        Object.keys(cal).forEach(function (k) {
          if (k.indexOf(prefix) === 0 && cal[k].volume > monthMax)
            monthMax = cal[k].volume;
        });

        var h =
          '<div class="calhead">' +
          "<h2>" +
          Gym.esc(Gym.monthLabel(state.calYear, state.calMonth)) +
          "</h2>" +
          '<button class="calnav" data-cal="-1" aria-label="이전 달">‹</button>' +
          '<button class="calnav" data-cal="1" aria-label="다음 달">›</button>' +
          "</div>";

        h +=
          '<div class="calstat">' +
          "<span>운동한 날 <b>" +
          stats.days +
          "</b>일</span>" +
          "<span>총 <b>" +
          stats.sets +
          "</b>세트</span>" +
          "<span>총 볼륨 <b>" +
          Gym.formatNumber(stats.volume) +
          "</b>kg</span>" +
          "</div>";

        h += '<div class="calgrid"><div class="caldow">';
        DOW.forEach(function (d) {
          h += "<span>" + d + "</span>";
        });
        h += "</div>";
        weeks.forEach(function (week) {
          h += '<div class="calweek">';
          week.forEach(function (key) {
            h += calCellHTML(key, cal, monthMax);
          });
          h += "</div>";
        });
        h += "</div>";

        h += calDayDetailHTML(cal);
        return h;
      }

      function renderHist() {
        var list = allExercises().filter(function (ex) {
          var a = logs[ex.id] || [];
          return a.some(function (e) {
            return Gym.topSet(e) != null;
          });
        });
        if (!list.length) {
          return '<div class="empty">아직 기록이 없어.<br>종목을 눌러서 중량과 반복수를 입력하면<br>여기에 그래프가 쌓여.</div>';
        }
        if (
          !state.chartEx ||
          !list.some(function (e) {
            return e.id === state.chartEx;
          })
        )
          state.chartEx = list[0].id;

        var h =
          '<select class="hsel" id="hsel" aria-label="그래프에 표시할 종목">';
        list.forEach(function (ex) {
          h +=
            '<option value="' +
            Gym.esc(ex.id) +
            '"' +
            (ex.id === state.chartEx ? " selected" : "") +
            ">" +
            Gym.esc(ex.name) +
            "</option>";
        });
        h += "</select>";

        var arr = (logs[state.chartEx] || []).filter(function (e) {
          return Gym.topSet(e) != null;
        });
        var series = arr.map(function (e) {
          return { d: e.date, v: Gym.topSet(e) };
        });
        h += '<div class="chart">' + Gym.chartSVG(series) + "</div>";

        h += '<div class="hlist">';
        arr
          .slice()
          .reverse()
          .forEach(function (e) {
            var used = e.sets.filter(function (s) {
              return s.w != null || s.r != null;
            });
            var txt = used
              .map(function (s) {
                return (
                  (s.w == null ? "-" : s.w) + "×" + (s.r == null ? "-" : s.r)
                );
              })
              .join("  ");
            h +=
              '<div class="hitem"><span class="d">' +
              Gym.esc(Gym.shortDate(e.date)) +
              '</span><span class="s">' +
              Gym.esc(txt) +
              "</span></div>";
          });
        h += "</div>";
        return h;
      }

      function render() {
        renderTabs();
        var v = document.getElementById("view");
        if (state.tab === "cal") {
          v.innerHTML = renderCalendar() + dataBoxHTML();
        } else if (state.tab === "hist") {
          document.documentElement.style.setProperty("--accent", "#B72B27");
          v.innerHTML = renderHist() + dataBoxHTML();
        } else {
          var day =
            DAYS.filter(function (d) {
              return d.id === state.tab;
            })[0] || DAYS[0];
          v.innerHTML = renderDay(day) + dataBoxHTML();
        }
        /* 상단에는 실제로 기록이 들어가는 날짜를 띄운다. 오늘이 아니면 눈에 띄게. */
        var stamp = document.getElementById("today");
        var isToday = recordDate() === today();
        stamp.textContent =
          recordDate() + (isToday ? "" : " ← 기록 중");
        stamp.style.color = isToday ? "" : "var(--accent)";
        stamp.style.fontWeight = isToday ? "" : "700";
      }

      /* ============ backup ============ */
      function exportData() {
        try {
          var payload = {
            v: BACKUP_VERSION,
            exportedAt: new Date().toISOString(),
            logs: logs,
            custom: custom,
          };
          var blob = new Blob([JSON.stringify(payload, null, 2)], {
            type: "application/json",
          });
          var url = URL.createObjectURL(blob);
          var a = document.createElement("a");
          a.href = url;
          a.download = "gym-backup-" + today() + ".json";
          document.body.appendChild(a);
          a.click();
          document.body.removeChild(a);
          setTimeout(function () {
            URL.revokeObjectURL(url);
          }, 1000);
          notify("백업 파일을 내려받았어.", "good");
        } catch (e) {
          notify("내보내기에 실패했어. 브라우저가 파일 저장을 막았을 수 있어.");
        }
      }

      function importFile(input) {
        var f = input.files && input.files[0];
        input.value = "";
        if (!f) return;
        if (f.size > MAX_BACKUP_BYTES) {
          notify("파일이 너무 커 (5MB 초과).");
          return;
        }
        var fr = new FileReader();
        fr.onerror = function () {
          notify("파일을 읽지 못했어.");
        };
        fr.onload = function () {
          var parsed;
          try {
            parsed = JSON.parse(fr.result);
          } catch (e) {
            notify("JSON 형식이 아니야.");
            return;
          }
          if (!parsed || typeof parsed !== "object") {
            notify("백업 파일 형식이 아니야.");
            return;
          }

          var inLogs = Gym.sanitizeLogs(parsed.logs);
          var inCustom = Gym.sanitizeCustom(parsed.custom);
          var nLogs = Object.keys(inLogs).length;
          var nCustom = Object.keys(inCustom).length;
          if (!nLogs && !nCustom) {
            notify("불러올 기록이 없어. 파일을 확인해줘.");
            return;
          }

          logs = Gym.mergeLogs(logs, inLogs);
          custom = Gym.mergeCustom(custom, inCustom);
          var okLogs = saveLogs(),
            okCustom = saveCustom();
          render();
          if (okLogs && okCustom)
            notify("종목 " + nLogs + "개의 기록을 합쳤어.", "good");
        };
        fr.readAsText(f);
      }

      function resetAll() {
        if (
          !window.confirm("모든 기록과 추가한 종목을 지울까? 되돌릴 수 없어.")
        )
          return;
        logs = {};
        custom = {};
        state.open = {};
        state.chartEx = null;
        saveLogs();
        saveCustom();
        render();
        notify("전체 삭제했어.", "good");
      }

      /* ============ events ============ */
      var CLICK_SELECTOR =
        "[data-tab],[data-toggle],[data-done],[data-rest],[data-form],[data-fill],[data-del]," +
        "[data-cal],[data-calday],[data-cat],[data-pick],[data-date],[data-jump]," +
        "#a-go,#a-clear,#date-today,#d-export,#d-import,#d-reset,#alert";

      /* 미래 날짜는 막는다 — 아직 하지 않은 운동을 적을 일은 없다. */
      /* 거부하면 false 를 돌려준다 — 호출한 쪽이 입력창을 되돌려야 하기 때문. */
      function setLogDate(key) {
        if (!Gym.isDateKey(key)) return false;
        if (Gym.dayDiff(key, Gym.todayKey()) < 0) {
          notify("앞날에는 기록할 수 없어.");
          return false;
        }
        state.logDate = key;
        clearNotify();
        render();
        return true;
      }

      function toggleCard(rowEl) {
        var id = rowEl.dataset.toggle;
        state.open[id] = !state.open[id];
        rowEl.parentNode.classList.toggle("open", state.open[id]);
        rowEl.setAttribute("aria-expanded", state.open[id] ? "true" : "false");
      }

      function setVal(id, v) {
        var el = document.getElementById(id);
        if (el) el.value = v;
      }

      function updateSuggestions() {
        var sug = document.getElementById("a-sug");
        if (sug) sug.innerHTML = suggestionsHTML();
        var picked = document.getElementById("a-picked");
        if (picked) picked.innerHTML = pickedHTML();
      }

      function selectCategory(catId) {
        state.cat = catId || null;
        state.pick = null;
        var chips = document.getElementById("a-cats");
        if (chips) chips.outerHTML = catChipsHTML();
        updateSuggestions();
      }

      function pickExercise(id) {
        var e = GymExercises.BY_ID[id];
        if (!e) return;
        state.pick = e;
        state.q = e.name;
        setVal("a-name", e.name);
        setVal("a-load", e.load || "");
        setVal("a-sets", e.sets);
        setVal("a-reps", e.reps);
        setVal("a-rest", e.rest);
        updateSuggestions();
      }

      function clearPick() {
        state.pick = null;
        state.q = "";
        ["a-name", "a-load", "a-sets", "a-reps", "a-rest"].forEach(function (id) {
          setVal(id, "");
        });
        updateSuggestions();
        var input = document.getElementById("a-name");
        if (input) input.focus();
      }

      /* 같은 날에 같은 이름이 두 번 뜨면 어느 카드에 적었는지 헷갈린다.
         자유 요일은 워밍업·서킷을 띄우지 않으니 그 이름들은 막지 않는다. */
      function dayHasExercise(dayId, name, id) {
        var day = DAYS.filter(function (d) {
          return d.id === dayId;
        })[0];
        var list = (day ? day.main : []).concat(custom[dayId] || []);
        if (!day || !day.freeform) list = list.concat(WARM, CIRCUIT);
        return list.some(function (e) {
          return e.name === name || e.id === id;
        });
      }

      function addExercise(dayId) {
        var pick = state.pick;
        var name = (pick ? pick.name : document.getElementById("a-name").value)
          .trim()
          .slice(0, MAX_NAME);
        if (!name) {
          notify("종목을 검색해서 고르거나 이름을 직접 적어줘.");
          return;
        }

        /* 카탈로그에서 고른 건 카탈로그 id 를 그대로 쓴다.
           그래야 여러 요일에 넣어도 기록이 한 줄로 이어진다. */
        var id = pick ? pick.id : "x-" + Date.now();
        if (dayHasExercise(dayId, name, id)) {
          notify(name + " 은(는) 이 날에 이미 있어.");
          return;
        }

        var load = parseFloat(document.getElementById("a-load").value);
        var sets = parseInt(document.getElementById("a-sets").value, 10);
        var rest = parseInt(document.getElementById("a-rest").value, 10);
        var reps = document
          .getElementById("a-reps")
          .value.trim()
          .slice(0, MAX_REPS);

        var entry = {
          id: id,
          name: name,
          load:
            isFinite(load) && load >= 0 && load <= MAX_LOAD
              ? load
              : pick
                ? pick.load
                : 0,
          unit: pick ? pick.unit : "kg",
          sets: Math.min(MAX_SETS, Math.max(1, sets || (pick ? pick.sets : 3))),
          reps: reps || (pick ? pick.reps : "10-12회"),
          rest: Math.min(
            MAX_REST,
            Math.max(0, isFinite(rest) ? rest : pick ? pick.rest : 60),
          ),
        };
        if (pick) {
          entry.cat = pick.cat;
          if (pick.plates) entry.plates = true;
        }

        custom[dayId] = (custom[dayId] || []).concat([entry]);
        state.pick = null;
        state.q = "";
        saveCustom();
        render();
        notify(name + " 추가했어.", "good");
      }

      function deleteExercise(dayId, exId) {
        if (!window.confirm("이 종목과 지금까지의 기록을 함께 지울까?")) return;
        custom[dayId] = (custom[dayId] || []).filter(function (e) {
          return e.id !== exId;
        });
        if (!custom[dayId].length) delete custom[dayId];
        delete logs[exId]; // 고아 기록을 남기지 않는다
        delete state.open[exId];
        if (state.chartEx === exId) state.chartEx = null;
        saveCustom();
        saveLogs();
        render();
      }

      function toggleSetDone(btn) {
        var exId = btn.dataset.done,
          i = +btn.dataset.i;
        var ex = findExercise(exId);
        if (!ex) return;
        var e = ensureEntry(exId, recordDate(), ex.sets);
        var next = !e.sets[i].done;
        e.sets[i].done = next;
        saveLogs();
        btn.classList.toggle("on", next);
        btn.setAttribute("aria-pressed", next ? "true" : "false");
        var card = btn.closest(".card");
        if (card)
          card.classList.toggle(
            "done",
            e.sets.every(function (s) {
              return s.done;
            }),
          );
        if (next && ex.rest)
          Timer.start(ex.rest, ex.name + " · " + (i + 1) + "세트 완료");
      }

      function fillFromPrev(exId) {
        var prev = Gym.prevEntry(logs, exId, recordDate());
        if (!prev) {
          notify("불러올 지난 기록이 없어.");
          return;
        }
        var ex = findExercise(exId);
        if (!ex) return;
        var cur = ensureEntry(exId, recordDate(), ex.sets);
        prev.sets.forEach(function (s, i) {
          if (cur.sets[i]) {
            cur.sets[i].w = s.w;
            cur.sets[i].r = s.r;
          }
        });
        saveLogs();
        render();
      }

      document.addEventListener("click", function (ev) {
        var t = ev.target.closest ? ev.target.closest(CLICK_SELECTOR) : null;
        if (!t) return;

        if (t.id === "alert") {
          clearNotify();
          return;
        }

        if (t.dataset.tab) {
          state.tab = t.dataset.tab;
          window.scrollTo(0, 0);
          render();
          return;
        }
        if (t.dataset.toggle) {
          toggleCard(t);
          return;
        }
        if (t.dataset.done) {
          toggleSetDone(t);
          return;
        }
        if (t.dataset.rest) {
          Timer.start(+t.dataset.rest, "휴식");
          return;
        }
        if (t.dataset.fill) {
          fillFromPrev(t.dataset.fill);
          return;
        }
        if (t.dataset.del) {
          deleteExercise(t.dataset.day, t.dataset.del);
          return;
        }

        if (t.dataset.date) {
          setLogDate(Gym.shiftDate(recordDate(), +t.dataset.date));
          return;
        }
        if (t.id === "date-today") {
          setLogDate(Gym.todayKey());
          return;
        }
        if (t.dataset.jump) {
          setLogDate(t.dataset.jump);
          state.tab = DAYS[0].id;
          window.scrollTo(0, 0);
          render();
          return;
        }

        if (t.dataset.cal) {
          var m = Gym.shiftMonth(state.calYear, state.calMonth, +t.dataset.cal);
          state.calYear = m.year;
          state.calMonth = m.month;
          state.calDay = null;
          render();
          return;
        }
        if (t.dataset.calday) {
          state.calDay =
            state.calDay === t.dataset.calday ? null : t.dataset.calday;
          render();
          return;
        }
        if (t.hasAttribute("data-cat")) {
          selectCategory(t.dataset.cat);
          return;
        }
        if (t.dataset.pick) {
          pickExercise(t.dataset.pick);
          return;
        }
        if (t.id === "a-clear") {
          clearPick();
          return;
        }

        if (t.dataset.form) {
          window.open(
            "https://www.youtube.com/results?search_query=" +
              encodeURIComponent(t.dataset.form + " 자세"),
            "_blank",
            "noopener,noreferrer",
          );
          return;
        }

        if (t.id === "a-go") {
          addExercise(t.dataset.day);
          return;
        }
        if (t.id === "d-export") {
          exportData();
          return;
        }
        if (t.id === "d-import") {
          document.getElementById("d-file").click();
          return;
        }
        if (t.id === "d-reset") {
          resetAll();
          return;
        }
      });

      /* 검색창에서 Enter 는 첫 번째 후보를 고른다. */
      document.addEventListener("keydown", function (ev) {
        if (ev.target.id === "a-name" && ev.key === "Enter") {
          ev.preventDefault();
          var first = document.querySelector("#a-sug [data-pick]");
          if (first) pickExercise(first.dataset.pick);
          return;
        }

        /* 종목 카드는 role="button" 이니 Enter/Space 로도 열려야 한다. */
        if (ev.key !== "Enter" && ev.key !== " " && ev.key !== "Spacebar")
          return;
        var row = ev.target.closest ? ev.target.closest("[data-toggle]") : null;
        if (!row) return;
        ev.preventDefault();
        toggleCard(row);
      });

      document.addEventListener("input", function (ev) {
        if (ev.target.id !== "a-name") return;
        state.q = ev.target.value;
        state.pick = null;
        updateSuggestions();
      });

      document.addEventListener("change", function (ev) {
        var el = ev.target;

        if (el.id === "logdate") {
          /* 거부되면 화면과 실제 기록 날짜가 어긋나니 입력창을 되돌린다. */
          if (!setLogDate(el.value)) el.value = recordDate();
          return;
        }
        if (el.id === "d-file") {
          importFile(el);
          return;
        }
        if (el.id === "hsel") {
          state.chartEx = el.value;
          render();
          return;
        }

        var exId = el.dataset.w || el.dataset.r;
        if (!exId) return;
        var ex = findExercise(exId);
        if (!ex) return;

        var raw = el.value.trim();
        var v = null;
        if (raw !== "") {
          var parsed = parseFloat(raw);
          if (!isFinite(parsed) || parsed < 0) el.value = "";
          else v = parsed;
        }
        var e = ensureEntry(exId, recordDate(), ex.sets),
          i = +el.dataset.i;
        if (el.dataset.w) e.sets[i].w = v;
        else e.sets[i].r = v;
        saveLogs();
      });

      render();

      /* ============ service worker ============ */
      if ("serviceWorker" in navigator && location.protocol !== "blob:") {
        window.addEventListener("load", function () {
          navigator.serviceWorker.register("./sw.js").catch(function () {});
        });
      }
    </script>
  </body>
</html>
