      function exRoutineRow(ex, day, isCustom) {
        /* custom 에 같은 ID 가 있으면 수정된 값을 반영한다 */
        var resolved = resolveExercise(ex.id);
        var h =
          '<div class="card"><div class="row" style="cursor:default">' +
          '<div class="nm">' +
          Gym.esc(resolved.name) +
          "</div>" +
          '<div class="ld">' +
          (resolved.load ? resolved.load + "<small>" + Gym.esc(resolved.unit) + "</small>" : Gym.esc(resolved.unit)) +
          "</div>" +
          '<div class="mt">' + resolved.sets + "세트 × " + Gym.esc(resolved.reps) + "</div>" +
          '<div class="rt">' +
          (resolved.rest ? "휴식 " + resolved.rest + "초" : "연속") +
          "</div></div>";
        h += '<div class="panel" style="display:block"><div class="ptools" style="margin:0">';
        h +=
          '<button class="btn" data-up="' + Gym.esc(ex.id) + '" data-day="' + Gym.esc(day.id) + '">↑</button>' +
          '<button class="btn" data-down="' + Gym.esc(ex.id) + '" data-day="' + Gym.esc(day.id) + '">↓</button>';
        h +=
          '<button class="btn" data-editex="' + Gym.esc(ex.id) + '" data-day="' + Gym.esc(day.id) + '">수정</button>';
        h += '<button class="btn warnbtn" data-del="' + Gym.esc(ex.id) + '" data-day="' + Gym.esc(day.id) + '">삭제</button>';
        h += "</div></div>";
        return h + "</div>";
      }

      /* ---------- 홈 ---------- */
      /* 루틴을 식별하는 종목만 본다. 워밍업·서킷은 모든 요일에 공유돼서
         마지막 수행일을 재는 데 쓰면 요일 구분이 안 된다. */
      function routineIds(day) {
        var added = custom[day.id] || [];
        var hiddenIds = {};
        added.forEach(function (e) { if (e._hidden) hiddenIds[e.id] = 1; });
        return day.main
          .filter(function (e) { return !hiddenIds[e.id]; })
          .concat(added.filter(function (e) { return !e._hidden && !e.override; }))
          .map(function (e) { return e.id; });
      }

      function routineLastDate(day) {
        return Gym.lastDateForIds(logs, routineIds(day));
      }

      /* 가장 오래 안 한 기본 요일을 제안한다. 한 번도 안 한 게 있으면 그게 먼저. */
      function suggestedDay() {
        var best = null;
        DAYS.forEach(function (d) {
          if (d.freeform) return;
          var last = routineLastDate(d);
          if (best === null) { best = { day: d, last: last }; return; }
          if (last === null && best.last !== null) { best = { day: d, last: last }; return; }
          if (last !== null && best.last !== null && last < best.last)
            best = { day: d, last: last };
        });
        return best || { day: DAYS[0], last: null };
      }

      function weekStripHTML(cal) {
        var today = Gym.todayKey();
        var week = Gym.weekDates(today);
        var max = 0;
        week.forEach(function (k) {
          if (cal[k] && cal[k].volume > max) max = cal[k].volume;
        });
        var days = 0, vol = 0, sets = 0;
        var h = '<div class="weekstrip">';
        week.forEach(function (k) {
          var day = cal[k];
          var cls = "wcell";
          if (day) {
            days += 1; vol += day.volume; sets += day.sets;
            cls += " has lv" + volumeLevel(day.volume, max);
          }
          if (k === today) cls += " today";
          h +=
            '<div class="' + cls + '"><span>' + Gym.weekday(k) + "</span><i></i></div>";
        });
        h += "</div>";
        h +=
          '<div class="wsum"><b>' + days + "</b>일 · <b>" + sets +
          "</b>세트 · <b>" + Gym.formatNumber(vol) + "</b>kg</div>";
        return h;
      }

      function renderHome() {
        var cal = Gym.buildCalendar(logs);
        var today = Gym.todayKey();
        var todayRec = cal[today];
        var streak = Gym.streakDays(cal, today);

        var h =
          '<div class="greet"><h2>' +
          +today.slice(5, 7) +
          "월 " +
          +today.slice(8, 10) +
          '일<br><span class="dow">' +
          Gym.esc(Gym.weekday(today)) +
          "요일</span></h2>" +
          (streak
            ? '<span class="streak">연속 ' + streak + "일</span>"
            : "") +
          "</div>";

        var sug = suggestedDay();
        var rel = Gym.relativeDay(sug.last, today);
        h +=
          '<div class="glass hero">' +
          '<div class="kicker">오늘 추천</div>' +
          "<h3>" +
          Gym.esc(sug.day.name) +
          "</h3>" +
          '<div class="meta">' +
          sug.day.main.length +
          "종목 · " +
          (rel ? "마지막 " + Gym.esc(rel) : "아직 기록 없음") +
          "</div>" +
          '<button class="go" data-start="' +
          Gym.esc(sug.day.id) +
          '">시작하기</button>' +
          "</div>";

        if (todayRec) {
          var note = days[today] || {};
          var dur = Gym.formatDuration(note.min);
          h +=
            '<div class="homesec">오늘</div>' +
            '<div class="glass gcard"><div class="todaystat">' +
            (dur ? "<div><span>운동 시간</span><b>" + Gym.esc(dur) + "</b></div>" : "") +
            "<div><span>종목</span><b>" + todayRec.count + "<i>개</i></b></div>" +
            "<div><span>세트</span><b>" + todayRec.sets + "<i>세트</i></b></div>" +
            "<div><span>볼륨</span><b>" + Gym.formatNumber(todayRec.volume) + "<i>kg</i></b></div>" +
            "</div></div>";
        }

        h += '<div class="homesec">이번 주</div>';
        h += '<div class="glass gcard">' + weekStripHTML(cal) + "</div>";

        if (!isStandalone()) {
          h +=
            '<div class="homesec">앱으로 설치</div>' +
            '<div class="glass gcard"><div class="installtitle">홈 화면에 두면 더 빨라요</div>' +
            '<div class="hint" style="margin-top:2px">주소창 없이 전체 화면으로 열리고, 오프라인에서도 돌아가요.</div>' +
            installGuideHTML(true) +
            "</div>";
        }

        h += '<div class="homesec">루틴</div><div class="glass rlist">';
        allDays().forEach(function (d) {
          var last = routineLastDate(d);
          var r = Gym.relativeDay(last, today);
          h +=
            '<div class="ritem-row">' +
            '<button class="ritem" data-start="' +
            Gym.esc(d.id) +
            '"><span class="rn">' +
            Gym.esc(
              d.num.indexOf("DAY ") === 0
                ? d.num.replace("DAY ", "D") + " " + d.name
                : d.name,
            ) +
            '</span><span class="rd">' +
            (r ? Gym.esc(r) : "기록 없음") +
            '</span><span class="rc">›</span></button>' +
            '<button class="redit" data-editroutine="' +
            Gym.esc(d.id) +
            '" aria-label="' +
            Gym.esc(d.name) +
            ' 루틴 편집">✎</button></div>';
        });
        h += '<button class="ritem add" id="chip-new">＋ 내 루틴 만들기</button></div>';
        return h;
      }

      /* ---------- 하루 요약 (시간 · 개수 · 볼륨 · 메모) ---------- */
      /* 기록 탭에서는 고른 날짜, 운동 탭에서는 기록 날짜를 편집한다. */
      function summaryDate() {
        return state.section === "records" && state.calDay
          ? state.calDay
          : recordDate();
      }

      /* 세트를 입력해도 화면을 다시 그리지 않으니(포커스 유지), 이 숫자만 따로 갱신한다. */
      function sumStatsHTML(date, cal) {
        var day = (cal || Gym.buildCalendar(logs))[date];
        var note = days[date] || {};
        var dur = Gym.formatDuration(note.min);
        var mealKcal = 0;
        (note.meals || []).forEach(function (m) { if (m.kcal) mealKcal += m.kcal; });
        var totalKcal = (note.kcal || 0) + mealKcal;
        return (
          '<div class="sumcell"><span>운동 시간</span><b>' +
          (dur ? Gym.esc(dur) : "—") +
          "</b></div>" +
          '<div class="sumcell"><span>운동 개수</span><b>' +
          (day ? day.count : 0) +
          "<i>개</i></b></div>" +
          '<div class="sumcell"><span>전체 볼륨</span><b>' +
          Gym.formatNumber(day ? day.volume : 0) +
          "<i>kg</i></b></div>" +
          '<div class="sumcell"><span>소모 칼로리</span><b>' +
          (totalKcal ? Gym.formatNumber(totalKcal) : "—") +
          (totalKcal ? "<i>kcal</i>" : "") +
          "</b></div>"
        );
      }

      function refreshSummary() {
        var box = document.getElementById("s-stats");
        if (box) box.innerHTML = sumStatsHTML(summaryDate(), null);
      }

      function daySummaryHTML(date, cal) {
        var note = days[date] || {};

        var h =
          '<div class="addbox summary"><div class="sumgrid" id="s-stats">' +
          sumStatsHTML(date, cal) +
          "</div>";

        h +=
          '<div class="sumrow"><label for="s-min">운동 시간</label>' +
          '<div class="fld"><input type="number" id="s-min" inputmode="numeric" min="0" max="1440" ' +
          'placeholder="0" value="' +
          (note.min || "") +
          '"><span>분</span></div></div>';

        h +=
          '<div class="sumrow"><label for="s-kcal">소모 칼로리</label>' +
          '<div class="fld"><input type="number" id="s-kcal" inputmode="numeric" min="0" max="99999" ' +
          'placeholder="0" value="' +
          (note.kcal || "") +
          '"><span>kcal</span></div></div>';

        h += '<div class="sechead" style="margin-top:var(--gap-md)">식단 기록</div>';
        h += '<div class="addbox summary" id="meal-box">';
        var meals = note.meals || [];
        meals.forEach(function (m, i) {
          h +=
            '<div class="mealrow">' +
            '<span class="mealtext">' + Gym.esc(m.text) +
            (m.kcal ? ' <small>' + m.kcal + 'kcal</small>' : '') +
            '</span>' +
            '<button class="btn mealrm" data-mealdel="' + i + '">✕</button></div>';
        });
        h +=
          '<div class="mealform">' +
          '<input id="m-text" class="searchfld" maxlength="200" placeholder="음식 (예: 닭가슴살 200g)" aria-label="음식">' +
          '<input id="m-kcal" type="number" inputmode="numeric" min="0" max="99999" placeholder="kcal" aria-label="칼로리" style="width:80px">' +
          '<button class="btn primary" id="m-add">추가</button>' +
          '</div></div>';

        h +=
          '<div class="addbox summary">' +
          '<textarea id="s-memo" class="memofld" maxlength="500" rows="3" ' +
          'aria-label="오늘 메모" placeholder="오늘 운동은 어땠나요? 간단히 적어두시면 다음에 도움이 돼요.">' +
          Gym.esc(note.memo || "") +
          "</textarea>" +
          '<div class="ptools" style="margin-top:8px">' +
          '<button class="btn" data-sharedate="' + Gym.esc(date) + '">이미지로 공유</button>' +
          '<button class="btn" data-sharetxt="' + Gym.esc(date) + '">텍스트로 공유</button>' +
          "</div></div>";
        return h;
      }

      /* ---- 텍스트 공유 ---- */
      function buildShareText(date) {
        var cal = Gym.buildCalendar(logs);
        var day = cal[date];
        var note = days[date] || {};
        var ids = sessionIds(date);
        var meals = note.meals || [];
        if (!day && !ids.length && !meals.length) return null;

        var lines = [];
        lines.push(Gym.shortDate(date) + " 운동 기록");
        lines.push("");

        if (note.min) lines.push("⏱ " + Gym.formatDuration(note.min));
        if (day) {
          lines.push(day.count + "종목 · " + day.sets + "세트 · " + Gym.formatNumber(day.volume) + "kg");
        }
        var mealKcal = 0;
        meals.forEach(function (m) { if (m.kcal) mealKcal += m.kcal; });
        var totalKcal = (note.kcal || 0) + mealKcal;
        if (totalKcal) lines.push("🔥 " + Gym.formatNumber(totalKcal) + "kcal 소모");
        lines.push("");

        ids.forEach(function (id) {
          var ex = resolveExercise(id);
          var entry = Gym.entryFor(logs, id, date);
          if (!entry) return;
          var used = entry.sets.filter(function (s) {
            return s.w != null || s.r != null || s.done;
          });
          if (!used.length) return;
          lines.push("• " + ex.name + "  " + Gym.formatSetLine(used));
        });

        if (meals.length) {
          lines.push("");
          lines.push("🍽 식단");
          meals.forEach(function (m) {
            lines.push("• " + m.text + (m.kcal ? " (" + m.kcal + "kcal)" : ""));
          });
        }

        if (note.memo) {
          lines.push("");
          lines.push(note.memo);
        }
        return lines.join("\n");
      }

      /* ---- 식단 기록 ---- */
      function addMeal() {
        var text = (document.getElementById("m-text").value || "").trim();
        if (!text) { notify("음식을 입력해주세요."); return; }
        var kcalEl = document.getElementById("m-kcal");
        var kcal = parseInt(kcalEl.value, 10);
        var rec = summaryDate();
        if (!days[rec]) days[rec] = {};
        if (!days[rec].meals) days[rec].meals = [];
        var meal = { text: text.slice(0, 200) };
        if (isFinite(kcal) && kcal > 0) meal.kcal = Math.min(99999, kcal);
        days[rec].meals.push(meal);
        saveDays();
        render();
        notify(text + " 추가했어요.", "good");
      }

      function deleteMeal(index) {
        var rec = summaryDate();
        if (!days[rec] || !days[rec].meals) return;
        days[rec].meals.splice(index, 1);
        if (!days[rec].meals.length) delete days[rec].meals;
        saveDays();
        render();
      }

      function shareText(date) {
        var text = buildShareText(date);
        if (!text) { notify("공유할 기록이 없어요."); return; }
        if (navigator.share) {
          navigator.share({ text: text }).catch(function () {});
        } else {
          copyToClipboard(text);
        }
      }

      function copyToClipboard(text) {
        if (navigator.clipboard) {
          navigator.clipboard.writeText(text).then(function () {
            notify("클립보드에 복사했어요.", "good");
          }, function () { fallbackCopy(text); });
        } else {
          fallbackCopy(text);
        }
      }

      function fallbackCopy(text) {
        var ta = document.createElement("textarea");
        ta.value = text;
        ta.style.position = "fixed";
        ta.style.opacity = "0";
        document.body.appendChild(ta);
        ta.select();
        document.execCommand("copy");
        document.body.removeChild(ta);
        notify("클립보드에 복사했어요.", "good");
      }

      /* ---- 이미지 공유 ---- */
      /* roundRect 폴리필 — 오래된 WebView 대비 */
      if (typeof CanvasRenderingContext2D !== "undefined" &&
          !CanvasRenderingContext2D.prototype.roundRect) {
        CanvasRenderingContext2D.prototype.roundRect = function (x, y, w, h, r) {
          if (typeof r === "number") r = [r, r, r, r];
          this.moveTo(x + r[0], y);
          this.lineTo(x + w - r[1], y);
          this.arcTo(x + w, y, x + w, y + r[1], r[1]);
          this.lineTo(x + w, y + h - r[2]);
          this.arcTo(x + w, y + h, x + w - r[2], y + h, r[2]);
          this.lineTo(x + r[3], y + h);
          this.arcTo(x, y + h, x, y + h - r[3], r[3]);
          this.lineTo(x, y + r[0]);
          this.arcTo(x, y, x + r[0], y, r[0]);
          this.closePath();
        };
      }

      function shareImage(date) {
        var cal = Gym.buildCalendar(logs);
        var day = cal[date];
        var note = days[date] || {};
        var ids = sessionIds(date);
        var meals = note.meals || [];
        if (!day && !ids.length && !meals.length) { notify("공유할 기록이 없어요."); return; }

        /* 종목 목록 준비 */
        var exercises = [];
        ids.forEach(function (id) {
          var ex = resolveExercise(id);
          var entry = Gym.entryFor(logs, id, date);
          if (!entry) return;
          var used = entry.sets.filter(function (s) {
            return s.w != null || s.r != null || s.done;
          });
          if (!used.length) return;
          exercises.push({ name: ex.name, detail: Gym.formatSetLine(used) });
        });
        if (!exercises.length && !meals.length) { notify("공유할 기록이 없어요."); return; }

        /* 다크모드 감지 */
        var isDark = document.documentElement.getAttribute("data-theme") === "dark" ||
          (document.documentElement.getAttribute("data-theme") !== "light" &&
           window.matchMedia("(prefers-color-scheme: dark)").matches);

        /* 캔버스 크기 계산 */
        var dpr = 2;
        var W = 400;
        var pad = 28;
        var headerH = 80;
        var statH = 56;
        var rowH = 44;
        var mealHeaderH = meals.length ? 30 : 0;
        var mealRowH = 28;
        var memoH = note.memo ? 48 : 0;
        var footerH = 36;
        var gapAfterStat = 16;
        var gapAfterRows = (meals.length || memoH) ? 12 : 0;
        var gapAfterMeals = memoH && meals.length ? 12 : 0;
        var H = pad + headerH + statH + gapAfterStat +
          exercises.length * rowH + gapAfterRows +
          mealHeaderH + meals.length * mealRowH + gapAfterMeals +
          memoH + footerH + pad;

        var c = document.createElement("canvas");
        c.width = W * dpr;
        c.height = H * dpr;
        var ctx = c.getContext("2d");
        ctx.scale(dpr, dpr);

        /* 배경 */
        var bg = isDark ? "#0d0f22" : "#f5f6f7";
        var cardBg = isDark ? "#1a1d30" : "#ffffff";
        var textMain = isDark ? "#ffffff" : "#091e42";
        var textSub = isDark ? "rgba(255,255,255,0.55)" : "rgba(0,0,0,0.5)";
        var textMid = isDark ? "rgba(255,255,255,0.75)" : "rgba(0,0,0,0.7)";
        var accent = isDark ? "#3395ff" : "#007aff";
        var lineBg = isDark ? "rgba(255,255,255,0.07)" : "rgba(0,0,0,0.04)";

        /* 둥근 사각형 배경 */
        var r = 16;
        ctx.fillStyle = bg;
        ctx.fillRect(0, 0, W, H);
        ctx.beginPath();
        ctx.roundRect(12, 12, W - 24, H - 24, r);
        ctx.fillStyle = cardBg;
        ctx.fill();

        var x = pad + 12;
        var y = pad + 12;
        var contentW = W - 24 - pad * 2;

        /* 헤더 */
        ctx.fillStyle = accent;
        ctx.font = "700 13px -apple-system, BlinkMacSystemFont, system-ui, sans-serif";
        ctx.fillText("WORKOUT LOG", x, y + 18);

        ctx.fillStyle = textMain;
        ctx.font = "700 22px -apple-system, BlinkMacSystemFont, system-ui, sans-serif";
        ctx.fillText(Gym.shortDate(date), x, y + 48);

        var dur = Gym.formatDuration(note.min);
        if (dur) {
          ctx.fillStyle = textSub;
          ctx.font = "500 13px -apple-system, BlinkMacSystemFont, system-ui, sans-serif";
          ctx.fillText(dur, x, y + 68);
        }
        y += headerH;

        /* 요약 통계 바 */
        ctx.fillStyle = lineBg;
        ctx.beginPath();
        ctx.roundRect(x, y, contentW, statH, 10);
        ctx.fill();

        var mealKcal = 0;
        meals.forEach(function (m) { if (m.kcal) mealKcal += m.kcal; });
        var totalKcal = (note.kcal || 0) + mealKcal;
        var stats = [];
        if (day) {
          stats.push({ v: String(day.count), u: "종목" });
          stats.push({ v: String(day.sets), u: "세트" });
          stats.push({ v: Gym.formatNumber(day.volume), u: "kg" });
        }
        if (totalKcal) stats.push({ v: Gym.formatNumber(totalKcal), u: "kcal" });
        if (stats.length) {
          var sw = contentW / stats.length;
          stats.forEach(function (s, i) {
            var sx = x + sw * i + sw / 2;
            ctx.fillStyle = textMain;
            ctx.font = "700 18px -apple-system, BlinkMacSystemFont, system-ui, sans-serif";
            ctx.textAlign = "center";
            ctx.fillText(s.v, sx, y + 26);
            ctx.fillStyle = textSub;
            ctx.font = "500 11px -apple-system, BlinkMacSystemFont, system-ui, sans-serif";
            ctx.fillText(s.u, sx, y + 43);
          });
          ctx.textAlign = "left";
        }
        y += statH + gapAfterStat;

        /* 종목 목록 */
        exercises.forEach(function (ex, i) {
          if (i % 2 === 0) {
            ctx.fillStyle = lineBg;
            ctx.fillRect(x, y, contentW, rowH);
          }
          ctx.fillStyle = textMain;
          ctx.font = "600 13px -apple-system, BlinkMacSystemFont, system-ui, sans-serif";
          ctx.fillText(ex.name, x + 10, y + 18);

          ctx.fillStyle = textMid;
          ctx.font = "400 12px -apple-system, BlinkMacSystemFont, system-ui, sans-serif";
          var detail = ex.detail;
          if (ctx.measureText(detail).width > contentW - 20) {
            while (detail.length > 4 && ctx.measureText(detail + "…").width > contentW - 20) {
              detail = detail.slice(0, -1);
            }
            detail += "…";
          }
          ctx.fillText(detail, x + 10, y + 35);
          y += rowH;
        });

        /* 식단 */
        if (meals.length) {
          y += gapAfterRows;
          ctx.fillStyle = textSub;
          ctx.font = "600 11px -apple-system, BlinkMacSystemFont, system-ui, sans-serif";
          ctx.fillText("DIET", x + 4, y + 16);
          y += mealHeaderH;
          meals.forEach(function (m) {
            ctx.fillStyle = textMid;
            ctx.font = "400 12px -apple-system, BlinkMacSystemFont, system-ui, sans-serif";
            var mtext = m.text + (m.kcal ? "  " + m.kcal + "kcal" : "");
            if (ctx.measureText(mtext).width > contentW - 20) {
              while (mtext.length > 4 && ctx.measureText(mtext + "…").width > contentW - 20) {
                mtext = mtext.slice(0, -1);
              }
              mtext += "…";
            }
            ctx.fillText("· " + mtext, x + 4, y + 16);
            y += mealRowH;
          });
        }

        /* 메모 */
        if (note.memo) {
          y += gapAfterMeals || (meals.length ? 0 : gapAfterRows);
          ctx.fillStyle = textSub;
          ctx.font = "italic 12px -apple-system, BlinkMacSystemFont, system-ui, sans-serif";
          var memo = note.memo;
          if (ctx.measureText(memo).width > contentW - 10) {
            while (memo.length > 4 && ctx.measureText(memo + "…").width > contentW - 10) {
              memo = memo.slice(0, -1);
            }
            memo += "…";
          }
          ctx.fillText("\"" + memo + "\"", x + 4, y + 16);
          y += memoH;
        }

        /* 푸터 */
        ctx.fillStyle = textSub;
        ctx.font = "500 10px -apple-system, BlinkMacSystemFont, system-ui, sans-serif";
        ctx.textAlign = "right";
        ctx.fillText("심트 · 심플 트레이닝", x + contentW - 4, y + 20);
        ctx.textAlign = "left";

        /* 공유 / 다운로드 */
        c.toBlob(function (blob) {
          if (!blob) { notify("이미지 생성에 실패했어요."); return; }
          var file = new File([blob], "workout-" + date + ".png", { type: "image/png" });
          if (navigator.canShare && navigator.canShare({ files: [file] })) {
            navigator.share({ files: [file] }).catch(function () {});
          } else {
            var a = document.createElement("a");
            a.href = URL.createObjectURL(blob);
            a.download = file.name;
            a.click();
            setTimeout(function () { URL.revokeObjectURL(a.href); }, 5000);
            notify("이미지를 다운로드했어요.", "good");
          }
        }, "image/png");
      }

      /* ---------- 캘린더 ---------- */
      var DOW = ["일", "월", "화", "수", "목", "금", "토"];
      var VOLUME_LEVELS = [0.34, 0.67]; // 그 달 최대 볼륨 대비 색 농도 구간

      function volumeLevel(volume, max) {
        if (!max || !volume) return 1;
        var ratio = volume / max;
        if (ratio <= VOLUME_LEVELS[0]) return 1;
        if (ratio <= VOLUME_LEVELS[1]) return 2;
        return 3;
      }

      function calCellHTML(key, cal, monthMax) {
        if (!key) return '<div class="calcell pad"></div>';
        var day = cal[key];
        var num = +key.slice(8);
        var cls = "calcell";
        if (key === today()) cls += " today";
        if (key === state.calDay) cls += " sel";
        if (day) cls += " has lv" + volumeLevel(day.volume, monthMax);

        /* 앞날은 기록할 수 없으니 고를 수도 없게 둔다. */
        if (Gym.dayDiff(key, today()) < 0) {
          return '<div class="' + cls + ' future">' + num + "</div>";
        }
        return (
          '<button class="' +
          cls +
          '" data-calday="' +
          Gym.esc(key) +
          '" aria-label="' +
          Gym.esc(Gym.shortDate(key)) +
          " " +
          (day ? day.count + "종목" : "기록 없음") +
          '">' +
          num +
          (day ? "<i></i>" : "") +
          "</button>"
        );
      }

      function calDayDetailHTML(cal) {
        if (!state.calDay) {
          return '<div class="empty">날짜를 누르면 그날 하신 운동이 나와요.</div>';
        }
        var day = cal[state.calDay];

        var h =
          '<div class="calday"><div class="caldayhead"><h3>' +
          Gym.esc(Gym.shortDate(state.calDay)) +
          "(" +
          Gym.esc(Gym.weekday(state.calDay)) +
          ")</h3><span>" +
          (day ? day.count + "종목 · " + day.sets + "세트" : "기록 없음") +
          "</span></div>";

        h += daySummaryHTML(state.calDay, cal);

        h +=
          '<div class="ptools" style="margin:var(--gap-md) 0 var(--gap-lg)">' +
          '<button class="btn primary" data-jump="' +
          Gym.esc(state.calDay) +
          '">' +
          (day ? "이 날짜에 기록하기" : "이 날짜에 기록 시작") +
          "</button></div>";

        if (!day) return h + "</div>";

        var ordered = day.exercises.slice().sort(function (a, b) {
          return b.volume - a.volume;
        });
        ordered.forEach(function (item) {
          var color = categoryColor(exerciseCategory(item.id));
          h +=
            '<div class="calex" style="border-left-color:' +
            color +
            '">' +
            '<div class="n">' +
            Gym.esc(exerciseName(item.id)) +
            "</div>" +
            '<div class="s">' +
            Gym.esc(Gym.formatSetLine(item.sets)) +
            "</div>" +
            (item.volume
              ? '<div class="v">볼륨 ' +
                Gym.formatNumber(item.volume) +
                "kg" +
                (item.top != null ? " · 최고 " + item.top + "kg" : "") +
                "</div>"
              : "") +
            "</div>";
        });
        h += "</div>";
        return h;
      }

      function renderCalendar() {
        var cal = Gym.buildCalendar(logs);
        var stats = Gym.monthStats(cal, state.calYear, state.calMonth);
        var weeks = Gym.monthMatrix(state.calYear, state.calMonth);

        var monthMax = 0;
        var prefix =
          state.calYear + "-" + (state.calMonth + 1 < 10 ? "0" : "") + (state.calMonth + 1) + "-";
        Object.keys(cal).forEach(function (k) {
          if (k.indexOf(prefix) === 0 && cal[k].volume > monthMax)
            monthMax = cal[k].volume;
        });

        var h =
          '<div class="calhead">' +
          "<h2>" +
          Gym.esc(Gym.monthLabel(state.calYear, state.calMonth)) +
          "</h2>" +
          '<button class="calnav" data-cal="-1" aria-label="이전 달">‹</button>' +
          '<button class="calnav" data-cal="1" aria-label="다음 달">›</button>' +
          "</div>";

        h +=
          '<div class="calstat">' +
          "<span>운동한 날 <b>" +
          stats.days +
          "</b>일</span>" +
          "<span>총 <b>" +
          stats.sets +
          "</b>세트</span>" +
          "<span>총 볼륨 <b>" +
          Gym.formatNumber(stats.volume) +
          "</b>kg</span>" +
          "</div>";

        h += '<div class="calgrid"><div class="caldow">';
        DOW.forEach(function (d) {
          h += "<span>" + d + "</span>";
        });
        h += "</div>";
        weeks.forEach(function (week) {
          h += '<div class="calweek">';
          week.forEach(function (key) {
            h += calCellHTML(key, cal, monthMax);
          });
          h += "</div>";
        });
        h += "</div>";

        h += calDayDetailHTML(cal);
        return h;
      }

      /* 추이는 id 가 아니라 "같은 운동" 단위여야 한다. 내장 루틴과 카탈로그가
         서로 다른 id 를 쓰는 탓에, id 로 묶으면 한 종목이 둘로 갈라진다. */
      var METRICS = [
        { id: "top", label: "최고 중량", unit: "kg" },
        { id: "e1rm", label: "추정 1RM", unit: "kg" },
        { id: "volume", label: "볼륨", unit: "kg" },
      ];

      /* 지표가 무엇을 재는지 화면에서 바로 알 수 있게 한 줄 적어둔다. */
      function metricNote(metric) {
        if (metric === "e1rm")
          return (
            "그날 세트 중 가장 높은 추정치예요. " +
            "<code>중량 × (1 + 반복수 ÷ 30)</code> — Epley 공식. " +
            "5~12회 구간에서 쓸 만하고, 그 밖에서는 오차가 커져요. " +
            "실제로 재본 1RM 이 아니라 추세를 보는 값이에요."
          );
        if (metric === "volume")
          return "그날 <code>중량 × 반복수</code> 를 모두 더한 값이에요. 맨몸 종목은 볼륨에 안 잡혀요.";
        return "그날 가장 무겁게 든 세트의 중량이에요. 반복수가 늘어난 발전은 이 지표로는 안 보여요.";
      }

      function renderStats() {
        var metric = state.metric || "top";
        var series = Gym.seriesByName(logs, exerciseName, metric);
        var names = Object.keys(series).sort();
        if (!names.length) {
          return '<div class="empty">아직 기록이 없어요.<br>종목을 눌러서 중량과 반복수를 입력하시면<br>여기에 그래프가 쌓여요.</div>';
        }
        if (!state.chartEx || names.indexOf(state.chartEx) < 0)
          state.chartEx = names[0];

        var h = '<div class="seg metrics" role="group" aria-label="그래프 지표">';
        METRICS.forEach(function (m) {
          h +=
            '<button class="segbtn' +
            (metric === m.id ? " on" : "") +
            '" data-metric="' +
            m.id +
            '" aria-pressed="' +
            (metric === m.id ? "true" : "false") +
            '">' +
            m.label +
            "</button>";
        });
        h += "</div>";

        h += '<select class="hsel" id="hsel" aria-label="그래프에 표시할 종목">';
        names.forEach(function (n) {
          h +=
            '<option value="' +
            Gym.esc(n) +
            '"' +
            (n === state.chartEx ? " selected" : "") +
            ">" +
            Gym.esc(n) +
            "</option>";
        });
        h += "</select>";

        h += '<div class="chart">' + Gym.chartSVG(series[state.chartEx]) + "</div>";
        h += '<div class="metricnote">' + metricNote(metric) + "</div>";

        /* 이력도 같은 이름을 쓰는 id 를 전부 모아 날짜별로 합친다. */
        var byDate = {};
        Object.keys(logs).forEach(function (id) {
          if (exerciseName(id) !== state.chartEx) return;
          (logs[id] || []).forEach(function (e) {
            var used = e.sets.filter(function (s) {
              return s.w != null || s.r != null;
            });
            if (!used.length) return;
            (byDate[e.date] = byDate[e.date] || []).push(Gym.formatSetLine(used));
          });
        });

        h += '<div class="hlist">';
        Object.keys(byDate)
          .sort()
          .reverse()
          .forEach(function (d) {
            h +=
              '<div class="hitem"><span class="d">' +
              Gym.esc(Gym.shortDate(d)) +
              '</span><span class="s">' +
              Gym.esc(byDate[d].join("  ")) +
              "</span></div>";
          });
        h += "</div>";
        return h;
      }

      /* ---------- 테마 ---------- */
      /* "system" 이면 속성을 지워 tokens.css 의 prefers-color-scheme 규칙에 맡긴다. */
      function applyTheme(mode) {
        var root = document.documentElement;
        if (mode === "dark" || mode === "light") root.setAttribute("data-theme", mode);
        else root.removeAttribute("data-theme");
      }

      function setTheme(mode) {
        if (["system", "light", "dark"].indexOf(mode) < 0) return;
        state.theme = mode;
        applyTheme(mode);
        try {
          if (mode === "system") localStorage.removeItem(THEME_KEY);
          else localStorage.setItem(THEME_KEY, mode);
        } catch (e) {}
        render();
      }

      (function initTheme() {
        var saved = null;
        try { saved = localStorage.getItem(THEME_KEY); } catch (e) {}
        state.theme = saved === "dark" || saved === "light" ? saved : "system";
        applyTheme(state.theme);
      })();

      function themeSegHTML() {
        var opts = [
          { id: "system", label: "시스템" },
          { id: "light", label: "라이트" },
          { id: "dark", label: "다크" },
        ];
        return (
          '<div class="seg" role="group" aria-label="테마">' +
          opts
            .map(function (o) {
              return (
                '<button class="segbtn' +
                (state.theme === o.id ? " on" : "") +
                '" data-theme-set="' +
                o.id +
                '" aria-pressed="' +
                (state.theme === o.id ? "true" : "false") +
                '">' +
                o.label +
                "</button>"
              );
            })
            .join("") +
          "</div>"
        );
      }

      /* ---------- 팁 ---------- */
      function renderTips() {
        var h =
          '<div class="dayhead"><div class="num">TIPS</div><h2>훈련 팁</h2>' +
          "<p>헷갈릴 때 열어보시는 기준들</p></div>";

        h += '<div class="sechead">중량 올리는 기준</div><div class="addbox">' +
          '<div class="rule"><i>01</i><div><b>목표 반복수 상단을 전 세트에서 채우면 올려주세요.</b> 벤치·스쿼트·데드는 2.5kg, 덤벨은 한 단계 위로 올려주세요.</div></div>' +
          '<div class="rule"><i>02</i><div><b>어깨 서킷은 15회가 쉬워지면 20회 → 6kg 15회</b> 순으로 올려주세요.</div></div>' +
          '<div class="rule"><i>03</i><div><b>단백질 하루 135-165g.</b> 감량은 주당 0.5kg 내외로 완만하게 가주세요.</div></div>' +
          '<div class="rule"><i>04</i><div><b>큰 종목의 2-3분 휴식은 줄이지 마세요.</b> 회복이 덜 되면 반복수가 떨어져 총볼륨이 줄어들어요.</div></div>' +
          '<div class="rule"><i>05</i><div><b>기계 종목은 표시 중량을 믿지 마세요.</b> 12회에 2개 남는 지점을 직접 찾아주세요.</div></div>' +
          '<div class="rule"><i>06</i><div><b>어깨 앞·위쪽이 시큰하면 그날 서킷은 건너뛰세요.</b> 근육통과 관절 통증은 다릅니다.</div></div>' +
          "</div>";

        h +=
          '<div class="sechead">세트 · 휴식</div><div class="addbox">' +
          '<div class="rule"><i>01</i><div><b>큰 종목은 2-3분, 작은 종목은 60초로 쉬어주세요.</b> 휴식이 짧으면 반복수가 떨어져 총볼륨이 줄어요.</div></div>' +
          '<div class="rule"><i>02</i><div><b>마지막 세트는 2개 남기고 멈춰주세요.</b> 매 세트 실패까지 가면 다음 날 회복이 안 돼요.</div></div>' +
          '<div class="rule"><i>03</i><div><b>세트가 모자라면 ＋ 세트로 늘려주세요.</b> 직전 세트의 중량·반복수를 그대로 복사해드려요.</div></div>' +
          "</div>";

        h +=
          '<div class="sechead">기록 습관</div><div class="addbox">' +
          '<div class="rule"><i>01</i><div><b>세트 끝나자마자 적어주세요.</b> 나중에 몰아 적으면 반드시 틀려요.</div></div>' +
          '<div class="rule"><i>02</i><div><b>못 적었으면 날짜를 되돌려 적어주세요.</b> 운동 화면 위쪽 날짜 바에서 옮기실 수 있어요.</div></div>' +
          '<div class="rule"><i>03</i><div><b>가끔 설정에서 내보내주세요.</b> 기록은 이 브라우저에만 있어요.</div></div>' +
          "</div>";
        return h;
      }

      /* ---------- 설정 ---------- */
      function logStats() {
        var days = {},
          exercises = 0,
          sets = 0;
        Object.keys(logs).forEach(function (id) {
          exercises += 1;
          (logs[id] || []).forEach(function (e) {
            days[e.date] = 1;
            sets += e.sets.filter(function (s) {
              return s.w != null || s.r != null || s.done;
            }).length;
          });
        });
        return {
          exercises: exercises,
          days: Object.keys(days).length,
          sets: sets,
        };
      }

      function storedBytes() {
        try {
          var raw =
            JSON.stringify(logs || {}) + JSON.stringify(custom || {});
          return new Blob([raw]).size;
        } catch (e) {
          return 0;
        }
      }

      function renderSettings() {
        var s = logStats();

        var h = '<div class="dayhead"><div class="num">SETTINGS</div><h2>설정</h2></div>';

        h +=
          '<div class="sechead">화면</div>' +
          '<div class="addbox">' +
          themeSegHTML() +
          '<div class="hint">시스템으로 두면 기기 설정을 따라가요.</div>' +
          "</div>";

        h +=
          '<div class="sechead">앱 설치</div><div class="addbox">' +
          installGuideHTML(false) +
          "</div>";

        h +=
          '<div class="sechead">바벨</div><div class="addbox">' +
          '<div class="sumrow"><label for="s-bar">봉 무게</label>' +
          '<div class="fld"><input type="number" id="s-bar" inputmode="decimal" step="0.5" ' +
          'min="1" max="100" value="' +
          barKg() +
          '"><span>kg</span></div></div>' +
          '<div class="hint">원판 계산에 써요. 여성용 봉은 15kg, EZ바는 보통 7-10kg 예요.</div>' +
          "</div>";

        h +=
          '<div class="sechead">앱 업데이트</div>' +
          '<div class="addbox">' +
          '<div class="srow"><span>캐시</span><b id="s-cache">확인 중…</b></div>' +
          '<div class="srow"><span>서비스워커</span><b id="s-sw">확인 중…</b></div>' +
          '<div class="ptools">' +
          '<button class="btn" id="s-update">업데이트 확인</button>' +
          '<button class="btn warnbtn" id="s-purge">캐시 비우고 새로고침</button>' +
          "</div>" +
          '<div class="hint">새 버전이 안 보이면 <b>캐시 비우고 새로고침</b>을 눌러주세요.<br>' +
          "앱 파일만 지우고 <b>운동 기록은 그대로 남아요.</b></div>" +
          "</div>";

        h +=
          '<div class="sechead">저장 공간</div>' +
          '<div class="addbox">' +
          '<div class="srow"><span>기록한 날</span><b>' +
          s.days +
          "일</b></div>" +
          '<div class="srow"><span>기록된 종목</span><b>' +
          s.exercises +
          "개</b></div>" +
          '<div class="srow"><span>총 세트</span><b>' +
          Gym.formatNumber(s.sets) +
          "세트</b></div>" +
          '<div class="srow"><span>기록 용량</span><b>' +
          Gym.formatBytes(storedBytes()) +
          "</b></div>" +
          '<div class="srow"><span>브라우저 할당량</span><b id="s-quota">확인 중…</b></div>' +
          "</div>";

        h += '<div class="sechead">데이터</div>' + dataBoxHTML();

        h +=
          '<div class="sechead">앱 정보</div>' +
          '<div class="addbox">' +
          '<div class="srow"><span>실행 방식</span><b>' +
          (window.matchMedia("(display-mode: standalone)").matches
            ? "홈 화면 앱"
            : "브라우저 탭") +
          "</b></div>" +
          '<div class="srow"><span>저장소</span><b>' +
          (Store.ok ? "localStorage" : "메모리 (임시)") +
          "</b></div>" +
          '<div class="srow"><span>오프라인</span><b>' +
          ("serviceWorker" in navigator ? "지원" : "미지원") +

        return h;
      }

      /* 캐시 이름·할당량은 비동기라 자리만 잡아두고 나중에 채운다. */
      function fillSettingsAsync() {
        var cacheEl = document.getElementById("s-cache");
        var swEl = document.getElementById("s-sw");
        var quotaEl = document.getElementById("s-quota");
        if (!cacheEl) return;

        if (window.caches) {
          caches
            .keys()
            .then(function (keys) {
              cacheEl.textContent = keys.length ? keys.join(", ") : "없음";
            })
            .catch(function () {
              cacheEl.textContent = "확인 불가";
            });
        } else {
          cacheEl.textContent = "미지원";
        }

        if ("serviceWorker" in navigator) {
          navigator.serviceWorker
            .getRegistration()
            .then(function (reg) {
              if (!reg) {
                swEl.textContent = "미등록";
              } else if (reg.waiting) {
                swEl.textContent = "새 버전 대기 중";
              } else if (reg.active) {
                swEl.textContent = "동작 중";
              } else {
                swEl.textContent = "설치 중";
              }
            })
            .catch(function () {
              swEl.textContent = "확인 불가";
            });
        } else {
          swEl.textContent = "미지원";
        }

        if (navigator.storage && navigator.storage.estimate) {
          navigator.storage
            .estimate()
            .then(function (est) {
              quotaEl.textContent =
                Gym.formatBytes(est.usage || 0) +
                " / " +
                Gym.formatBytes(est.quota || 0);
            })
            .catch(function () {
              quotaEl.textContent = "확인 불가";
            });
        } else {
          quotaEl.textContent = "미지원";
        }
      }

      function checkUpdate() {
        if (!("serviceWorker" in navigator)) {
          notify("이 브라우저는 서비스워커를 지원하지 않아요.");
          return;
        }
        navigator.serviceWorker
          .getRegistration()
          .then(function (reg) {
            if (!reg) {
              notify("서비스워커가 등록돼 있지 않아요. http/https 로 열어야 등록돼요.");
              return null;
            }
            return reg.update().then(function () {
              if (reg.installing || reg.waiting) {
                notify("새 버전을 받았어요. 새로고침하면 적용돼요.", "good");
              } else {
                notify("이미 최신이에요.", "good");
              }
            });
          })
          .catch(function () {
            notify("업데이트를 확인하지 못했어요. 네트워크를 확인해주세요.");
          });
      }

      /* 앱 파일 캐시만 비운다. localStorage 는 건드리지 않는다. */
      function purgeCaches() {
        if (
          !window.confirm(
            "앱 파일 캐시를 비우고 새로고침할까요?\n운동 기록은 지워지지 않아요.",
          )
        )
          return;

        var jobs = [];
        if ("serviceWorker" in navigator) {
          jobs.push(
            navigator.serviceWorker.getRegistrations().then(function (regs) {
              return Promise.all(
                regs.map(function (r) {
                  return r.unregister();
                }),
              );
            }),
          );
        }
        if (window.caches) {
          jobs.push(
            caches.keys().then(function (keys) {
              return Promise.all(
                keys.map(function (k) {
                  return caches.delete(k);
                }),
              );
            }),
          );
        }
        Promise.all(jobs)
          .catch(function () {})
          .then(function () {
            location.reload();
          });
      }

      function render() {
        invalidatePR();
        renderChips();
        renderNav();
        var v = document.getElementById("view");
        if (state.section === "home") {
          v.innerHTML = renderHome();
        } else if (state.section === "tips") {
          v.innerHTML = renderTips();
        } else if (state.section === "settings") {
          v.innerHTML = renderSettings();
          fillSettingsAsync();
        } else if (state.section === "records") {
          v.innerHTML = renderCalendar();
        } else if (state.section === "stats") {
          v.innerHTML = renderStats();
        } else if (state.section === "routine") {
          v.innerHTML = renderRoutineEdit();
        } else {
          v.innerHTML = renderSession(recordDate());
        }
        /* 어느 날짜를 보고 있는지는 운동 화면의 날짜 바가 알려준다.
           상단은 날짜만 담백하게 둔다. */
        document.getElementById("today").textContent = recordDate();
      }

      /* ============ backup ============ */
      function exportData() {
        try {
          var payload = {
            v: BACKUP_VERSION,
            exportedAt: new Date().toISOString(),
            logs: logs,
            custom: custom,
            days: days,
            mylib: myLib,
            routines: routines,
            prefs: prefs,
            order: order,
            sessions: sessions,
          };
          var blob = new Blob([JSON.stringify(payload, null, 2)], {
            type: "application/json",
          });
          var url = URL.createObjectURL(blob);
          var a = document.createElement("a");
          a.href = url;
          a.download = "gym-backup-" + today() + ".json";
          document.body.appendChild(a);
          a.click();
          document.body.removeChild(a);
          setTimeout(function () {
            URL.revokeObjectURL(url);
          }, 1000);
          notify("백업 파일을 내려받았어요.", "good");
        } catch (e) {
          notify("내보내기에 실패했어요. 브라우저가 파일 저장을 막았을 수 있어요.");
        }
      }

      function importFile(input) {
        var f = input.files && input.files[0];
        input.value = "";
        if (!f) return;
        if (f.size > MAX_BACKUP_BYTES) {
          notify("파일이 너무 커요 (5MB 초과).");
          return;
        }
        var fr = new FileReader();
        fr.onerror = function () {
          notify("파일을 읽지 못했어요.");
        };
        fr.onload = function () {
          var parsed;
          try {
            parsed = JSON.parse(fr.result);
          } catch (e) {
            notify("JSON 형식이 아니에요.");
            return;
          }
          if (!parsed || typeof parsed !== "object") {
            notify("백업 파일 형식이 아니에요.");
            return;
          }

          var inLogs = Gym.sanitizeLogs(parsed.logs);
          var inCustom = Gym.sanitizeCustom(parsed.custom);
          var inDays = Gym.sanitizeDays(parsed.days);
          var inLib = Gym.sanitizeLibrary(parsed.mylib);
          var inRoutines = Gym.sanitizeRoutines(parsed.routines);
          var inSessions = Gym.sanitizeSessions(parsed.sessions);
          var inBar = parsed.prefs && parseFloat(parsed.prefs.bar);
          var nLogs = Object.keys(inLogs).length;
          var nCustom = Object.keys(inCustom).length;
          if (!nLogs && !nCustom) {
            notify("불러올 기록이 없어요. 파일을 확인해주세요.");
            return;
          }

          logs = Gym.mergeLogs(logs, inLogs);
          custom = Gym.mergeCustom(custom, inCustom);
          days = Gym.mergeDays(days, inDays);
          myLib = Gym.mergeLibrary(myLib, inLib);
          routines = Gym.mergeRoutines(routines, inRoutines);
          sessions = Gym.mergeSessions(sessions, inSessions);
          saveSessions();
          saveMyLib();
          saveRoutines();
          if (isFinite(inBar) && inBar > 0 && inBar <= 100) {
            prefs.bar = inBar;
            savePrefs();
          }
          var okLogs = saveLogs(),
            okCustom = saveCustom();
          saveDays();
          render();
          if (okLogs && okCustom)
            notify("종목 " + nLogs + "개의 기록을 합쳤어요.", "good");
        };
        fr.readAsText(f);
      }

      function resetAll() {
        if (
          !window.confirm("모든 기록과 추가한 종목을 지울까요? 되돌릴 수 없어요.")
        )
          return;
        logs = {};
        custom = {};
        days = {};
        myLib = [];
        routines = [];
        order = {};
        sessions = {};
        state.open = {};
        state.chartEx = null;
        saveLogs();
        saveCustom();
        saveDays();
        saveMyLib();
        saveRoutines();
        saveOrder();
        saveSessions();
        state.day = DAYS[0].id;
        render();
        notify("전체 삭제했어요.", "good");
      }

      /* ============ events ============ */
      var CLICK_SELECTOR =
        "[data-section],[data-start],[data-panel],[data-loadroutine],[data-editroutine],[data-donex],[data-swap],[data-daytab],[data-addset],[data-delset],[data-up],[data-down],[data-rname],[data-rdel],[data-toggle],[data-done],[data-rest],[data-form],[data-fill],[data-del],[data-editex],[data-sharedate],[data-sharetxt],[data-mealdel],#m-add," +
        "[data-cal],[data-calday],[data-cat],[data-pick],[data-date],[data-jump]," +
        "#a-go,#a-clear,#date-today,#d-export,#d-import,#d-reset,#nav-tips,#chip-new,[data-grp]," +
        "#s-update,#s-purge,#do-install,#day-done,#swap-cancel,#nav-settings,[data-theme-set],[data-metric],#alert";

      /* 미래 날짜는 막는다 — 아직 하지 않은 운동을 적을 일은 없다. */
      /* 거부하면 false 를 돌려준다 — 호출한 쪽이 입력창을 되돌려야 하기 때문. */
      function setLogDate(key) {
        if (!Gym.isDateKey(key)) return false;
        if (Gym.dayDiff(key, Gym.todayKey()) < 0) {
          notify("앞날에는 기록할 수 없어요.");
          return false;
        }
        state.logDate = key;
        clearNotify();
        render();
        return true;
      }

      function toggleCard(rowEl) {
        var id = rowEl.dataset.toggle;
        /* .row 를 .cardtop 으로 감싼 뒤로 parentNode 는 .card 가 아니다.
           .cardtop 에 open 이 붙어서 .card.open .panel 규칙이 안 먹었다. */
        var card = rowEl.closest(".card");
        if (!card) return;
        state.open[id] = !state.open[id];
        card.classList.toggle("open", state.open[id]);
        rowEl.setAttribute("aria-expanded", state.open[id] ? "true" : "false");
      }

      function setVal(id, v) {
        var el = document.getElementById(id);
        if (el) el.value = v;
      }

      function updateSuggestions() {
        var sug = document.getElementById("a-sug");
        if (sug) sug.innerHTML = suggestionsHTML();
        var picked = document.getElementById("a-picked");
        if (picked) picked.innerHTML = pickedHTML();
      }

      function selectCategory(catId) {
        state.cat = catId || null;
        state.pick = null;
        var chips = document.getElementById("a-cats");
        if (chips) chips.outerHTML = catChipsHTML();
        updateSuggestions();
      }

      function pickExercise(id) {
        var e = GymExercises.BY_ID[id] || libById(id);
        if (!e) return;
        state.pick = e;
        state.q = e.name;
        setVal("a-name", e.name);
        setVal("a-load", e.load || "");
        setVal("a-sets", e.sets);
        setVal("a-reps", e.reps);
        setVal("a-rest", e.rest);
        updateSuggestions();
      }

      function clearPick() {
        state.pick = null;
        state.q = "";
        ["a-name", "a-load", "a-sets", "a-reps", "a-rest"].forEach(function (id) {
          setVal(id, "");
        });
        updateSuggestions();
        var input = document.getElementById("a-name");
        if (input) input.focus();
      }

      /* 같은 날에 같은 이름이 두 번 뜨면 어느 카드에 적었는지 헷갈린다.
         자유 요일은 워밍업·서킷을 띄우지 않으니 그 이름들은 막지 않는다. */
      function dayHasExercise(dayId, name, id) {
        var day = allDays().filter(function (d) {
          return d.id === dayId;
        })[0];
        var list = (day ? day.main : []).concat(custom[dayId] || []);
        if (!day || !day.freeform) list = list.concat(WARM, CIRCUIT);
        return list.some(function (e) {
          return e.name === name || e.id === id;
        });
      }

      function addExercise(dayId, isSession) {
        var pick = state.pick;
        var name = (pick ? pick.name : document.getElementById("a-name").value)
          .trim()
          .slice(0, MAX_NAME);
        if (!name) {
          notify("종목을 검색해서 고르시거나 이름을 직접 적어주세요.");
          return;
        }

        /* 카탈로그에서 고른 건 카탈로그 id 를 그대로 쓴다.
           그래야 여러 요일에 넣어도 기록이 한 줄로 이어진다. */
        /* 같은 이름이 다른 요일에 이미 있으면 그 id 를 그대로 쓴다.
           안 그러면 같은 운동이 두 id 로 갈라져 추이가 반토막 난다. */
        var existing = null;
        var all = allExercises();
        for (var ai = 0; ai < all.length; ai++) {
          if (all[ai].name === name) { existing = all[ai].id; break; }
        }
        var id = existing || (pick ? pick.id : "my-" + Date.now());
        var dup = isSession
          ? sessionIds(dayId)
              .filter(function (x) { return x !== state.swap; })
              .some(function (x) {
                return x === id || resolveExercise(x).name === name;
              })
          : dayHasExercise(dayId, name, id);
        if (dup) {
          notify(name + " 은(는) 이미 있어요.");
          return;
        }
        /* 카탈로그에 없는 이름이면 부위를 받아 내 목록에 넣는다.
           안 그러면 다음에 또 검색해도 안 나와서 매번 다시 쳐야 한다. */
        var isNew = !pick && !existing && !libById(id);
        if (isNew && !state.cat) {
          notify("새 종목은 부위를 먼저 골라주세요. 위의 부위 칩에서 고르시면 돼요.");
          return;
        }

        var load = parseFloat(document.getElementById("a-load").value);
        var sets = parseInt(document.getElementById("a-sets").value, 10);
        var rest = parseInt(document.getElementById("a-rest").value, 10);
        var reps = document
          .getElementById("a-reps")
          .value.trim()
          .slice(0, MAX_REPS);

        var entry = {
          id: id,
          name: name,
          load:
            isFinite(load) && load >= 0 && load <= MAX_LOAD
              ? load
              : pick
                ? pick.load
                : 0,
          unit: pick ? pick.unit : "kg",
          sets: Math.min(MAX_SETS, Math.max(1, sets || (pick ? pick.sets : 3))),
          reps: reps || (pick ? pick.reps : "12회"),
          rest: Math.min(
            MAX_REST,
            Math.max(0, isFinite(rest) ? rest : pick ? pick.rest : 60),
          ),
        };
        entry.grp = state.grp === "warm" ? "warm" : "main";
        if (pick) {
          entry.cat = pick.cat;
          if (pick.plates) entry.plates = true;
        }

        if (isNew) {
          entry.cat = state.cat;
          myLib = myLib.concat([
            {
              id: id,
              name: name,
              cat: state.cat,
              load: entry.load,
              unit: entry.unit,
              sets: entry.sets,
              reps: entry.reps,
              rest: entry.rest,
            },
          ]);
          saveMyLib();
        }

        var swapped = false;
        if (isSession && state.swap) {
          if (!applySwap(dayId, id, name)) return;
          state.swap = null;
          swapped = true;
        } else if (isSession) {
          /* 그날 한 번만 하는 종목은 루틴을 건드리지 않는다. */
          var cur = sessionIds(dayId);
          cur.push(id);
          setSession(dayId, cur);
          if (isNew || pick) {
            /* 카탈로그·내 종목이면 메타를 기억해 다음에도 같은 값이 뜨게 한다 */
          }
        } else {
          custom[dayId] = (custom[dayId] || []).concat([entry]);
          saveCustom();
        }
        state.pick = null;
        state.q = "";
        state.panel = null;
        render();
        notify(
          swapped ? name + " 로 교체했어요." : name + " 을(를) 추가했어요.",
          "good",
        );
      }

      function removeFromSession(date, exId) {
        var name = resolveExercise(exId).name;
        if (!window.confirm(name + " 을(를) 이 날 기록에서 뺄까요?\n입력한 세트도 함께 지워져요.")) return;
        setSession(
          date,
          sessionIds(date).filter(function (id) { return id !== exId; }),
        );
        /* 그날 기록만 지운다. 다른 날짜의 같은 종목 기록은 남는다. */
        if (logs[exId]) {
          logs[exId] = logs[exId].filter(function (e) { return e.date !== date; });
          if (!logs[exId].length) delete logs[exId];
          saveLogs();
        }
        render();
      }

      function deleteExercise(dayId, exId) {
        if (!window.confirm("이 종목과 지금까지의 기록을 함께 지울까요?")) return;
        custom[dayId] = (custom[dayId] || []).filter(function (e) {
          return e.id !== exId;
        });
        if (!custom[dayId].length) delete custom[dayId];
        if (order[dayId])
          order[dayId] = order[dayId].filter(function (id) {
            return id !== exId;
          });
        saveOrder();
        delete logs[exId]; // 고아 기록을 남기지 않는다
        delete state.open[exId];
        state.chartEx = null;
        saveCustom();
        saveLogs();
        render();
      }

      function toggleSetDone(btn) {
        var exId = btn.dataset.done,
          i = +btn.dataset.i;
        var ex = resolveExercise(exId);
        if (!ex) return;
        var e = ensureEntry(exId, recordDate(), setCountFor(ex, recordDate()));
        var next = !e.sets[i].done;
        e.sets[i].done = next;
        saveLogs();
        btn.classList.toggle("on", next);
        btn.setAttribute("aria-pressed", next ? "true" : "false");
        var card = btn.closest(".card");
        if (card)
          card.classList.toggle(
            "done",
            e.sets.every(function (s) {
              return s.done;
            }),
          );
        refreshSummary();
        refreshProgress();
        if (next && ex.rest)
          Timer.start(ex.rest, ex.name + " · " + (i + 1) + "세트 완료");
      }

      function isExerciseDone(exId, date) {
        var e = Gym.entryFor(logs, exId, date);
        return !!(
          e &&
          e.sets.length &&
          e.sets.every(function (s) { return s.done; })
        );
      }

      function sessionProgress(date) {
        var ids = sessionIds(date);
        var done = 0;
        ids.forEach(function (id) {
          if (isExerciseDone(id, date)) done += 1;
        });
        return { done: done, total: ids.length };
      }

      /* 종목 하나를 통째로 완료·해제한다. 세트를 하나씩 누르지 않아도 되게. */
      /* 진행 표시. renderSession 과 refreshProgress 가 같은 마크업을 써야
         세트를 체크했을 때 막대가 바로 따라 움직인다. */
      function dayProgHTML(date) {
        var prog = sessionProgress(date);
        if (!prog.total) return "";
        var all = prog.done === prog.total;
        return (
          '<div class="dayprog' +
          (all ? " done" : "") +
          '" id="dayprog"><div class="pinfo"><b>' +
          prog.done +
          "</b><span>/ " +
          prog.total +
          " 종목</span>" +
          (all ? "<em>다 하셨어요</em>" : "") +
          '</div><button class="pbtn" id="day-done">' +
          (all ? "해제" : "전체 완료") +
          "</button></div>"
        );
      }

      /* 세트 체크는 입력 포커스를 지키려고 전체 리렌더를 하지 않는다.
         그래서 진행 막대만 따로 갈아끼운다. */
      function refreshProgress() {
        var box = document.getElementById("dayprog");
        if (box) box.outerHTML = dayProgHTML(recordDate());
      }

      function toggleExerciseDone(exId) {
        var date = recordDate();
        var ex = resolveExercise(exId);
        var e = ensureEntry(exId, date, setCountFor(ex, date));
        var next = !isExerciseDone(exId, date);
        e.sets.forEach(function (s) { s.done = next; });
        saveLogs();
        render();
      }

      /* 그날 전체를 완료·해제한다. */
      function toggleDayDone() {
        var date = recordDate();
        var ids = sessionIds(date);
        if (!ids.length) return;
        var p = sessionProgress(date);
        var next = p.done < p.total;
        ids.forEach(function (id) {
          var ex = resolveExercise(id);
          var e = ensureEntry(id, date, setCountFor(ex, date));
          e.sets.forEach(function (s) { s.done = next; });
        });
        saveLogs();
        render();
        notify(next ? "오늘 운동을 완료했어요. 수고하셨어요." : "완료를 해제했어요.", next ? "good" : "bad");
      }

      /* ── 종목 교체 ──
         자리를 그대로 두고 다른 종목으로 바꾼다. 기구가 차 있을 때 쓴다. */
      function startSwap(exId) {
        state.swap = exId;
        state.panel = "add";
        state.q = "";
        state.pick = null;
        state.cat = null;
        render();
      }

      function cancelSwap() {
        state.swap = null;
        state.panel = null;
        render();
      }

      function applySwap(date, newId, newName) {
        var oldId = state.swap;
        var ids = sessionIds(date);
        var i = ids.indexOf(oldId);
        if (i < 0) return false;

        var e = Gym.entryFor(logs, oldId, date);
        var hasData = e && !Gym.isEmptyEntry(e);
        if (hasData) {
          if (
            !window.confirm(
              resolveExercise(oldId).name +
                " 에 적어둔 기록이 있어요.\n" +
                newName +
                " 로 바꾸면 이 날 기록은 지워져요. 바꿀까요?",
            )
          )
            return false;
        }

        ids[i] = newId;
        setSession(date, ids);
        if (logs[oldId]) {
          logs[oldId] = logs[oldId].filter(function (x) { return x.date !== date; });
          if (!logs[oldId].length) delete logs[oldId];
          saveLogs();
        }
        return true;
      }

      /* 세트를 늘리면 직전 세트의 중량·반복수를 복사한다 — 보통 같은 무게로 이어가니까. */
      function addSet(exId) {
        var ex = resolveExercise(exId);
        if (!ex) return;
        var date = recordDate();
        var count = setCountFor(ex, date);
        if (count >= MAX_SETS) {
          notify("세트는 " + MAX_SETS + "개까지예요.");
          return;
        }
        var e = ensureEntry(exId, date, count);
        var last = e.sets[e.sets.length - 1];
        e.sets.push({
          w: last ? last.w : null,
          r: last ? last.r : null,
          done: false,
        });
        e.n = e.sets.length;
        saveLogs();
        render();
      }

      function removeSet(exId) {
        var ex = resolveExercise(exId);
        if (!ex) return;
        var date = recordDate();
        var count = setCountFor(ex, date);
        if (count <= 1) return;
        var e = ensureEntry(exId, date, count);
        e.sets.pop();
        e.n = e.sets.length;
        saveLogs();
        render();
      }

      function fillFromPrev(exId) {
        var prev = Gym.prevEntry(logs, exId, recordDate());
        if (!prev) {
          notify("불러올 지난 기록이 없어요.");
          return;
        }
        var ex = resolveExercise(exId);
        if (!ex) return;
        var cur = ensureEntry(exId, recordDate(), setCountFor(ex, recordDate()));
        prev.sets.forEach(function (s, i) {
          if (cur.sets[i]) {
            cur.sets[i].w = s.w;
            cur.sets[i].r = s.r;
          }
        });
        saveLogs();
        render();
      }

      document.addEventListener("click", function (ev) {
        var t = ev.target.closest ? ev.target.closest(CLICK_SELECTOR) : null;
        if (!t) return;

        if (t.id === "alert") {
          clearNotify();
          return;
        }

        if (t.dataset.panel) {
          state.panel = state.panel === t.dataset.panel ? null : t.dataset.panel;
          render();
          return;
        }
        if (t.dataset.loadroutine) {
          loadRoutine(t.dataset.loadroutine, recordDate());
          return;
        }
        if (t.dataset.editroutine) {
          state.editRoutine = t.dataset.editroutine;
          state.section = "routine";
          window.scrollTo(0, 0);
          render();
          return;
        }
        if (t.dataset.start) {
          /* 홈에서 고른 루틴은 오늘 기록에 종목을 채워 넣고 운동 탭으로 간다. */
          state.section = "workout";
          state.panel = null;
          window.scrollTo(0, 0);
          loadRoutine(t.dataset.start, recordDate());
          return;
        }
        if (t.dataset.section) {
          state.section = t.dataset.section;
          window.scrollTo(0, 0);
          render();
          return;
        }
        if (t.dataset.daytab) {
          state.day = t.dataset.daytab;
          state.section = "workout";
          window.scrollTo(0, 0);
          render();
          return;
        }
        if (t.id === "nav-settings") {
          state.section = state.section === "settings" ? "workout" : "settings";
          window.scrollTo(0, 0);
          render();
          return;
        }
        if (t.id === "chip-new") {
          newRoutine();
          return;
        }
        if (t.dataset.rname) {
          renameRoutine(t.dataset.rname);
          return;
        }
        if (t.dataset.rdel) {
          deleteRoutine(t.dataset.rdel);
          return;
        }
        if (t.id === "nav-tips") {
          state.section = state.section === "tips" ? "workout" : "tips";
          window.scrollTo(0, 0);
          render();
          return;
        }
        if (t.hasAttribute("data-theme-set")) {
          setTheme(t.dataset.themeSet);
          return;
        }
        if (t.dataset.toggle) {
          toggleCard(t);
          return;
        }
        if (t.dataset.done) {
          toggleSetDone(t);
          return;
        }
        if (t.dataset.rest) {
          Timer.start(+t.dataset.rest, "휴식");
          return;
        }
        if (t.dataset.up) {
          moveExercise(t.dataset.day, t.dataset.up, -1);
          return;
        }
        if (t.dataset.down) {
          moveExercise(t.dataset.day, t.dataset.down, 1);
          return;
        }
        if (t.dataset.donex) {
          toggleExerciseDone(t.dataset.donex);
          return;
        }
        if (t.dataset.swap) {
          startSwap(t.dataset.swap);
          return;
        }
        if (t.id === "swap-cancel") {
          cancelSwap();
          return;
        }
        if (t.id === "day-done") {
          toggleDayDone();
          return;
        }
        if (t.dataset.addset) {
          addSet(t.dataset.addset);
          return;
        }
        if (t.dataset.delset) {
          removeSet(t.dataset.delset);
          return;
        }
        if (t.dataset.metric) {
          state.metric = t.dataset.metric;
          render();
          return;
        }
        if (t.hasAttribute("data-grp")) {
          state.grp = t.dataset.grp;
          var seg = document.querySelector("[data-grp]");
          if (seg && seg.parentNode) seg.parentNode.outerHTML = grpSegHTML();
          return;
        }
        if (t.dataset.fill) {
          fillFromPrev(t.dataset.fill);
          return;
        }
        if (t.dataset.editex) {
          editExerciseInRoutine(t.dataset.editex, t.dataset.day);
          return;
        }
        if (t.dataset.sharedate) {
          shareImage(t.dataset.sharedate);
          return;
        }
        if (t.dataset.sharetxt) {
          shareText(t.dataset.sharetxt);
          return;
        }
        if (t.dataset.mealdel != null) {
          deleteMeal(+t.dataset.mealdel);
          return;
        }
        if (t.id === "m-add") {
          addMeal();
          return;
        }
        if (t.dataset.del) {
          if (t.dataset.session === "1")
            removeFromSession(t.dataset.day, t.dataset.del);
          else if (state.section === "routine")
            deleteFromRoutine(t.dataset.del, t.dataset.day);
          else deleteExercise(t.dataset.day, t.dataset.del);
          return;
        }

        if (t.dataset.date) {
          setLogDate(Gym.shiftDate(recordDate(), +t.dataset.date));
          return;
        }
        if (t.id === "date-today") {
          setLogDate(Gym.todayKey());
          return;
        }
        if (t.dataset.jump) {
          setLogDate(t.dataset.jump);
          state.section = "workout";
          window.scrollTo(0, 0);
          render();
          return;
        }

        if (t.dataset.cal) {
          var m = Gym.shiftMonth(state.calYear, state.calMonth, +t.dataset.cal);
          state.calYear = m.year;
          state.calMonth = m.month;
          state.calDay = null;
          render();
          return;
        }
        if (t.dataset.calday) {
          state.calDay =
            state.calDay === t.dataset.calday ? null : t.dataset.calday;
          render();
          return;
        }
        if (t.hasAttribute("data-cat")) {
          selectCategory(t.dataset.cat);
          return;
        }
        if (t.dataset.pick) {
          pickExercise(t.dataset.pick);
          return;
        }
        if (t.id === "a-clear") {
          clearPick();
          return;
        }

        if (t.dataset.form) {
          window.open(
            "https://www.youtube.com/results?search_query=" +
              encodeURIComponent(t.dataset.form + " 자세"),
            "_blank",
            "noopener,noreferrer",
          );
          return;
        }

        if (t.id === "a-go") {
          addExercise(t.dataset.day, t.dataset.session === "1");
          return;
        }
        if (t.id === "d-export") {
          exportData();
          return;
        }
        if (t.id === "d-import") {
          document.getElementById("d-file").click();
          return;
        }
        if (t.id === "d-reset") {
          resetAll();
          return;
        }
        if (t.id === "do-install") {
          doInstall();
          return;
        }
        if (t.id === "s-update") {
          checkUpdate();
          return;
        }
        if (t.id === "s-purge") {
          purgeCaches();
          return;
        }
      });

      /* 검색창에서 Enter 는 첫 번째 후보를 골라주세요. */
      document.addEventListener("keydown", function (ev) {
        if (ev.target.id === "a-name" && ev.key === "Enter") {
          ev.preventDefault();
          var first = document.querySelector("#a-sug [data-pick]");
          if (first) pickExercise(first.dataset.pick);
          return;
        }

        /* 종목 카드는 role="button" 이니 Enter/Space 로도 열려야 한다. */
        if (ev.key !== "Enter" && ev.key !== " " && ev.key !== "Spacebar")
          return;
        var row = ev.target.closest ? ev.target.closest("[data-toggle]") : null;
        if (!row) return;
        ev.preventDefault();
        toggleCard(row);
      });

      document.addEventListener("input", function (ev) {
        if (ev.target.id === "s-memo") {
          /* 메모는 다시 그리지 않는다 — 한 글자 칠 때마다 포커스가 날아간다 */
          var rec = summaryDate();
          if (!days[rec]) days[rec] = {};
          var memo = ev.target.value.slice(0, 500);
          if (memo.trim()) days[rec].memo = memo;
          else delete days[rec].memo;
          saveDays();
          return;
        }
        if (ev.target.id !== "a-name") return;
        state.q = ev.target.value;
        state.pick = null;
        updateSuggestions();
      });

      document.addEventListener("change", function (ev) {
        var el = ev.target;

        if (el.id === "s-bar") {
          var b = parseFloat(el.value);
          if (isFinite(b) && b > 0 && b <= 100) prefs.bar = b;
          else delete prefs.bar;
          savePrefs();
          render();
          return;
        }
        if (el.id === "s-min") {
          var mins = parseInt(el.value, 10);
          var rec = summaryDate();
          if (!days[rec]) days[rec] = {};
          if (isFinite(mins) && mins > 0) days[rec].min = Math.min(1440, mins);
          else delete days[rec].min;
          saveDays();
          render();
          return;
        }
        if (el.id === "s-kcal") {
          var kcal = parseInt(el.value, 10);
          var rec = summaryDate();
          if (!days[rec]) days[rec] = {};
          if (isFinite(kcal) && kcal > 0) days[rec].kcal = Math.min(99999, kcal);
          else delete days[rec].kcal;
          saveDays();
          render();
          return;
        }
        if (el.id === "logdate") {
          /* 거부되면 화면과 실제 기록 날짜가 어긋나니 입력창을 되돌린다. */
          if (!setLogDate(el.value)) el.value = recordDate();
          return;
        }
        if (el.id === "d-file") {
          importFile(el);
          return;
        }
        if (el.id === "hsel") {
          state.chartEx = el.value;
          render();
          return;
        }

        var exId = el.dataset.w || el.dataset.r;
        if (!exId) return;
        var ex = resolveExercise(exId);
        if (!ex) return;

        var raw = el.value.trim();
        var v = null;
        if (raw !== "") {
          var parsed = parseFloat(raw);
          if (!isFinite(parsed) || parsed < 0) el.value = "";
          else v = parsed;
        }
        var e = ensureEntry(exId, recordDate(), setCountFor(ex, recordDate())),
          i = +el.dataset.i;
        if (el.dataset.w) {
          e.sets[i].w = v;
        } else {
          e.sets[i].r = v;
          /* 중량 칸의 회색 숫자는 placeholder 라 값이 아니다. 횟수만 적고 넘어가면
             중량이 비어 볼륨이 0 이 된다. 카드에 적힌 계획 중량을 실제 값으로
             채워 넣고, 입력창에도 보여줘서 다르면 바로 고칠 수 있게 한다. */
          if (v != null && e.sets[i].w == null && ex.load > 0) {
            e.sets[i].w = ex.load;
            var wInput = document.querySelector(
              '.panel input[data-w="' + ex.id + '"][data-i="' + i + '"]',
            );
            if (wInput) wInput.value = ex.load;
          }
        }
        saveLogs();
        refreshSummary();
      });

      render();

      /* ============ service worker ============ */
      if ("serviceWorker" in navigator && location.protocol !== "blob:") {
        window.addEventListener("load", function () {
          navigator.serviceWorker.register("./sw.js").catch(function () {});
        });
      }
    </script>
  </body>
</html>
